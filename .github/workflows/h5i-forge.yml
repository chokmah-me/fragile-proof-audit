name: h5i-forge

# One-shot audit forge for the h5i-app-bench harvest audit
# (h5i-dev/h5i-app-bench @ bebcf72). NOT standing CI: delete this
# file once the receipt is recorded.
#
# Why this exists: the audit's M2 leg must recheck, at the pin, the
# bench's own claim (prove/results/verification/coverage.json):
# 99 of 101 selected specifications accepted as previously checked
# certificates, 2 missing (kanidm-effective-total, tuwunel-total).
# The control-plane VM reboots roughly hourly and is the wrong place
# for six Lean projects; at the user's word (2026-10-23, "Run the
# full h5i audit as scoped") the job runs on the overflow lane
# ([self-hosted, laptop], Dell, 32 GB), per the runner-first build
# dispatch rule (2026-10-21).
#
# Procedure (mirrors the project's own grading standard,
# prove/harness/bench.py: a proof passes iff the statement matches
# and its #print axioms set is within STD_AXIOMS =
# {propext, Classical.choice, Quot.sound}):
#   1. fresh clone of h5i-dev/h5i-app-bench @
#      bebcf72c15d52bde888c49d6ea45b897033175d6 (asserted); per-port
#      toolchain leanprover/lean4:v4.31.0 (asserted);
#   2. coverage inventory with the project's own harness
#      (python3 harness/coverage.py, output recorded, non-gating:
#      it is their tool, the receipt records what it prints);
#   3. per port (nora, artifactkeeper, kanidm, rustfs, tuwunel,
#      oxicloud): lake exe cache get (recorded, non-gating), then
#      lake build of the proofs project (default target Proofs,
#      which imports Spec/Properties and through them the Verified
#      integration and the generated kernel), then a scratch file
#      printing the axioms of every theorem in the port's
#      h5i-app.toml [check] list, run under lake env lean. No phase
#      aborts the next port. The [check] lists total 356 theorems
#      at the pin: the 101 selected specifications are the dataset
#      tasks, and rustfs decomposes its 13 tasks into 268 gate
#      theorems (counted with a TOML parser during audit prep).
#   4. fail-closed verdict against the documented claim: all six
#      builds exit 0, all six axiom prints exit 0, every [check]
#      theorem has an axiom record, exactly the two documented
#      missing theorems depend on sorryAx
#      (kanidm_kernel.Properties.effective_permission_check_total,
#      tuwunel_kernel.Properties.transition_total), every other
#      gate theorem is clean within the classical three, and no
#      theorem depends on any off-allowlist axiom. Any deviation
#      fails the run.
#
# Harness rules: pins are literals (no dispatch inputs); the scratch
# clone lives in $HOME outside the shared checkout and is removed
# in an always() step; no `lake update`; exit codes are captured
# with `rc=0` + `cmd || rc=$?` (the runner forces bash -e;
# AGENTS.md (24)). The verdict parser joins wrapped lines before
# reading an axiom list (2026-10-22 thomgame-build lesson).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h5i-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 900
    steps:
      - name: Install elan if missing
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf --retry 5 --retry-delay 10 --retry-all-errors | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Clone pinned bench repo; coverage inventory
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          D="$HOME/h5i-bebcf72"
          rm -rf "$D"
          git clone https://github.com/h5i-dev/h5i-app-bench.git "$D"
          git -C "$D" checkout bebcf72c15d52bde888c49d6ea45b897033175d6
          HEAD=$(git -C "$D" rev-parse HEAD)
          echo "cloned HEAD: $HEAD"
          [ "$HEAD" = "bebcf72c15d52bde888c49d6ea45b897033175d6" ] || { echo "FAIL: HEAD != pin"; exit 1; }
          for p in nora artifactkeeper kanidm rustfs tuwunel oxicloud; do
            grep -qx 'leanprover/lean4:v4.31.0' "$D/prove/ports/$p/proofs/lean-toolchain" || { echo "FAIL: toolchain mismatch in $p"; exit 1; }
          done
          cd "$D/prove"
          rc=0
          python3 harness/coverage.py > "$GITHUB_WORKSPACE/coverage-inventory.log" 2>&1 || rc=$?
          echo "COVERAGE_EXIT:$rc" | tee "$GITHUB_WORKSPACE/exits.txt"
          cp results/verification/coverage.json "$GITHUB_WORKSPACE/coverage-after-inventory.json" 2>/dev/null || true
          cat "$GITHUB_WORKSPACE/exits.txt"

      - name: Build all six ports and print axioms for all check theorems
        timeout-minutes: 840
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          D="$HOME/h5i-bebcf72"
          : > "$GITHUB_WORKSPACE/check-names.txt"
          for p in nora artifactkeeper kanidm rustfs tuwunel oxicloud; do
            P="$D/prove/ports/$p"
            cd "$P/proofs"
            rc=0
            lake exe cache get > "$GITHUB_WORKSPACE/cache-$p.log" 2>&1 || rc=$?
            echo "CACHE_${p}_EXIT:$rc" >> "$GITHUB_WORKSPACE/exits.txt"
            rc=0
            lake build > "$GITHUB_WORKSPACE/build-$p.log" 2>&1 || rc=$?
            echo "BUILD_${p}_EXIT:$rc" >> "$GITHUB_WORKSPACE/exits.txt"
            python3 - "$P/h5i-app.toml" "$GITHUB_WORKSPACE/check-names.txt" > "$P/proofs/AxiomPrint.lean" << 'PYEOF'
          import re, sys
          txt = open(sys.argv[1]).read()
          m = re.search(r'\[check\]\s*theorems\s*=\s*\[(.*?)\]', txt, re.S)
          names = re.findall(r'"([^"]+)"', m.group(1))
          with open(sys.argv[2], 'a') as f:
              for n in names:
                  f.write(n + '\n')
          print("import Properties")
          for n in names:
              print(f"#print axioms {n}")
          PYEOF
            rc=0
            lake env lean AxiomPrint.lean > "$GITHUB_WORKSPACE/axiom-$p.out" 2> "$GITHUB_WORKSPACE/axiom-$p.err" || rc=$?
            echo "AXIOM_${p}_EXIT:$rc" >> "$GITHUB_WORKSPACE/exits.txt"
            rm -f "$P/proofs/AxiomPrint.lean"
          done
          cat "$GITHUB_WORKSPACE/exits.txt"

      - name: Verdict (fail-closed against the documented claim)
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re, sys, os
          ws = os.environ['GITHUB_WORKSPACE']
          exits = {}
          for line in open(ws + '/exits.txt'):
              if ':' in line:
                  k, v = line.strip().split(':', 1)
                  try: exits[k] = int(v)
                  except ValueError: pass
          ok = True
          ports = ('nora', 'artifactkeeper', 'kanidm', 'rustfs', 'tuwunel', 'oxicloud')
          for p in ports:
              for kind in ('BUILD', 'AXIOM'):
                  k = f"{kind}_{p}_EXIT"
                  if exits.get(k) != 0:
                      print(f"FAIL: {k} = {exits.get(k)}")
                      ok = False
          allow = {'propext', 'Classical.choice', 'Quot.sound'}
          expected_sorry = {
              'kanidm_kernel.Properties.effective_permission_check_total',
              'tuwunel_kernel.Properties.transition_total',
          }
          clean, sorry, offallow, missing = set(), set(), set(), set()
          seen = set()
          for p in ports:
              out = open(f"{ws}/axiom-{p}.out").read()
              err = open(f"{ws}/axiom-{p}.err").read()
              if re.search(r': error:', err):
                  print(f"FAIL: axiom-{p}.err contains an error line")
                  ok = False
              text = out.replace('\n', ' ')
              records = re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", text)
              nodep = re.findall(r"'([^']+)' does not depend on any axioms", text)
              for name, lst in records:
                  seen.add(name)
                  axioms = {a.strip().strip(',') for a in lst.split(',') if a.strip()}
                  if 'sorryAx' in axioms:
                      sorry.add(name)
                      axioms.discard('sorryAx')
                  extra = axioms - allow
                  if extra:
                      offallow.add((name, tuple(sorted(extra))))
                  elif name not in sorry:
                      clean.add(name)
              for name in nodep:
                  seen.add(name)
                  clean.add(name)
          # Expected theorem universe: exactly the [check] lists,
          # written by the build step to check-names.txt.
          expected = {l.strip() for l in open(ws + '/check-names.txt') if l.strip()}
          if seen != expected:
              print(f"FAIL: axiom records {len(seen)} vs [check] universe {len(expected)}; missing={sorted(expected - seen)[:5]} extra={sorted(seen - expected)[:5]}")
              ok = False
          if sorry != expected_sorry:
              print(f"FAIL: sorry set {sorted(sorry)} != documented missing {sorted(expected_sorry)}")
              ok = False
          if offallow:
              print(f"FAIL: off-allowlist axioms: {sorted(offallow)}")
              ok = False
          print(f"clean: {len(clean)}, sorry (documented missing): {len(sorry)}, off-allowlist: {len(offallow)}, records: {len(seen)}")
          print("VERDICT: " + ("PASS" if ok else "FAIL"))
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Write pins file
        if: always()
        run: |
          set -uo pipefail
          {
            echo "target_repo=https://github.com/h5i-dev/h5i-app-bench"
            echo "target_head=bebcf72c15d52bde888c49d6ea45b897033175d6"
            echo "toolchain=leanprover/lean4:v4.31.0 (all six ports)"
            echo "grader_standard=prove/harness/bench.py STD_AXIOMS={propext, Classical.choice, Quot.sound}"
            echo "upstream_pins=nora f864a9a; artifactkeeper 7c42891; kanidm f608c4f; rustfs e870a6d; tuwunel 7801b8e; oxicloud 8c0dd33"
            echo "lane=[self-hosted, laptop]"
            echo "procedure=coverage inventory (non-gating); per port: lake build; lake env lean AxiomPrint.lean over the h5i-app.toml [check] list (356 theorems at the pin)"
            cat "$GITHUB_WORKSPACE/exits.txt" 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/pins.txt"
          cat "$GITHUB_WORKSPACE/pins.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5i-forge-evidence
          path: |
            coverage-inventory.log
            coverage-after-inventory.json
            cache-*.log
            build-*.log
            axiom-*.out
            axiom-*.err
            check-names.txt
            exits.txt
            pins.txt
          if-no-files-found: warn

      - name: Remove scratch dirs (shared-runner meta-rule)
        if: always()
        run: |
          rm -rf "$HOME/h5i-bebcf72"
