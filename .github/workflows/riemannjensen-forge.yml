name: riemannjensen-forge

# Independent build + comparator run of AxiomMath/RiemannJensen @
# c1e023fa3ae7161219dde3dcb73f0c28ff972be2, the Lean artifact for
# Ken Ono, "An asymptotic Jensen-Polya criterion for GRH",
# arXiv:2610.38870v1 (2026-10-28). Pin:
# incoming/ono-jensen-polya-grh/PIN.md (main@9a88e18).
#
# The paper's abstract ends: "The main theorems have been
# autoformalized in Lean 4 by AxiomProver." The repo README claims:
# "This repository has been verified with the comparator (Lean
# kernel only)", via installing leanprover/comparator and running
# `lake env comparator Comparator/comparator.json`. That is a
# CLAIM, reproduced here, not a receipt (contrast the harvest's
# CFSG corollary, whose README admits its comparator never ran).
#
# Comparator route: the standalone leanprover/comparator repo is
# deprecated -- its README states it was merged into Lean core as
# of v4.35.0 as `lake comparator`, same JSON config format (the
# v4.35.0 Lake test suite, tests/lake/tests/comparator-from-export,
# pins the success contract: exit 0 plus the line "Your solution
# is okay!"). The pinned artifact builds on exactly v4.35.0, so
# this forge runs the CORE comparator at the artifact's own
# toolchain: `lake comparator --config Comparator/comparator.json`.
# The config (author's, hash-pinned below) compares Challenge.Basic
# against Solution.Basic on four theorems, permits exactly the
# standard three axioms, and sets enable_nanoda: true, so the
# nanoda kernel (nanoda_bin ships in the v4.35.0 toolchain prefix,
# proven on this runner by the Cranston-Li kernel replay) must
# also accept the export.
#
# Trust order (per the comparator README's own assumption 2):
# the comparator runs FIRST, in its bwrap sandbox, before anything
# in this job compiles Solution in the open. The independent
# #print axioms pass runs AFTER the comparator, as corroboration.
# A fake or passthrough bwrap is never substituted: if bubblewrap
# cannot sandbox on this runner the job SETUP-FAILs, because the
# sandbox is part of the comparator's guarantee.
#
# Fail-closed on: wrong target SHA, wrong lean-file count, wrong
# key file hashes, toolchain not v4.35.0, missing nanoda_bin,
# unusable bwrap, forbidden proof constructs anywhere except the
# exactly 4 sorries in Challenge/Basic.lean (the challenge is the
# artifact), any axiom declaration in the tree, build failure,
# comparator exit nonzero, comparator success line absent, any of
# the four solution theorems missing an axiom listing, sorryAx in
# a listing, or any listing outside the standard three.
#
# M1 first read (at pin, PIN.md): dedekind_thm_main faithful to
# the paper's Theorem 3; riemannJensen_main = Theorem 1 plus an
# implied nonreal-count conjunct. The paper's appendix pins Lean
# 4.33.1 / Mathlib 0df444a3, which does NOT describe this artifact
# (v4.35.0 / 56a00585); the appendix pin is not used anywhere here.
#
# Manual dispatch only. Heavy leg on the self-hosted desktop runner.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riemannjensen-forge
  cancel-in-progress: false

env:
  TARGET_SHA: c1e023fa3ae7161219dde3dcb73f0c28ff972be2
  PIN_DIR: incoming/ono-jensen-polya-grh/repo-c1e023f
  EXPECTED_LEAN_FILES: "152"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pre-dispatch checks on this workflow
        run: python3 scripts/harness/pre_dispatch_checks.py --workflows .github/workflows/riemannjensen-forge.yml

  forge:
    needs: gate
    runs-on: [self-hosted, desktop]
    timeout-minutes: 360
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Runner probe
        continue-on-error: true
        run: |
          set +e
          mkdir -p rj-evidence
          df -h . || true
          echo "bwrap: $(command -v bwrap || echo absent)"
          echo "cpus: $(nproc || echo unknown)"
          free -h || true
          exit 0

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Pin target commit (fail-closed)
        run: |
          set -euo pipefail
          echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "FAIL: TARGET_SHA is not 40 lowercase hex: $TARGET_SHA"; exit 1; }
          echo "$TARGET_SHA" | tee rj-evidence/TARGET_HEAD
          rm -rf rj-forge
          mkdir -p rj-forge
          cp -r "$PIN_DIR/." rj-forge/
          count=$(find rj-forge -name '*.lean' | wc -l)
          echo "lean files: $count (expected $EXPECTED_LEAN_FILES)"
          [ "$count" -eq "$EXPECTED_LEAN_FILES" ] || { echo "FAIL: lean file count $count != $EXPECTED_LEAN_FILES"; exit 1; }

      - name: Verify key hashes (fail-closed)
        working-directory: rj-forge
        run: |
          set -euo pipefail
          echo "9847b6242b3e2be945f5d0212cb9cbecd885aca35259f5618d83aa6976df24b8  Challenge.lean" | sha256sum -c -
          echo "eeae0da96ab3d5784522a5745dc46353b1a804c3ea32972be4040cd4cd73354c  Challenge/Basic.lean" | sha256sum -c -
          echo "058ee4b684edd9fec508dee865d96f295fe1fa9b2f1008f42c23add163d17741  Solution.lean" | sha256sum -c -
          echo "19700eeeec35078524b91f266ad31fcca4004e7b86a39a78e61543e5e749daa7  Solution/Basic.lean" | sha256sum -c -
          echo "cac6aa34296c285b837f4640c44fa97e283da543fd2727339a13d6b64592a4b0  RiemannJensen.lean" | sha256sum -c -
          echo "03ed4e57b81c0175162fee813c2b4cc01d28167798b798ced55d7e875f3ec9ee  Comparator/comparator.json" | sha256sum -c -
          echo "f1a399af75b1ff96c05a279c9cd0c780a6852315129c7719981bfbffd0c6f609  lake-manifest.json" | sha256sum -c -
          echo "a20a60102ae5ae36028deb083fc128d350bfa9b7a7fee215f26952befc442f97  lakefile.toml" | sha256sum -c -
          echo "ca5f1f601d34c49079e38d7e7041eb0f2a9c227fbc1df0f404820069a052330c  lean-toolchain" | sha256sum -c -

      - name: Source policy scan (exactly the challenge's 4 sorries, nothing else)
        working-directory: rj-forge
        run: |
          set -euo pipefail
          # The challenge module carries exactly 4 sorries by design
          # (the pinned pre-scan, PIN.md seam 4). Anything else --
          # a 5th sorry, a sorry elsewhere, admit, native_decide,
          # or an axiom declaration anywhere -- fails closed.
          sorry_challenge=$(grep -c 'sorry' Challenge/Basic.lean || true)
          echo "sorries in Challenge/Basic.lean: $sorry_challenge (expected 4)"
          [ "$sorry_challenge" -eq 4 ] || { echo "FAIL: Challenge/Basic.lean sorry count $sorry_challenge != 4"; exit 1; }
          if grep -rnw --include='*.lean' -e sorry -e admit -e native_decide . | grep -v '^\./\.lake/' | grep -v '^\./Challenge/Basic\.lean'; then
            echo "FAIL: sorry/admit/native_decide outside Challenge/Basic.lean"
            exit 1
          fi
          if grep -rnw --include='*.lean' -e axiom . | grep -v '^\./\.lake/'; then
            echo "FAIL: axiom declared in sources"
            exit 1
          fi
          echo "scan clean: 4 sorries, all in Challenge/Basic.lean; no admit/native_decide; no axiom declarations"

      - name: Forge prerequisites (toolchain, nanoda_bin, bwrap sandbox)
        working-directory: rj-forge
        run: |
          set -euo pipefail
          elan toolchain install leanprover/lean4:v4.35.0
          lean --version | tee ../rj-evidence/lean-version.txt
          grep -q "4.35.0" ../rj-evidence/lean-version.txt || { echo "SETUP-FAIL: toolchain is not v4.35.0"; exit 1; }
          prefix="$(lean --print-prefix)"
          echo "toolchain prefix: $prefix" | tee ../rj-evidence/checker-binaries.txt
          for tool in leanchecker leanexport nanoda_bin; do
            if [ -x "$prefix/bin/$tool" ]; then
              echo "present: $tool" | tee -a ../rj-evidence/checker-binaries.txt
            else
              echo "SETUP-FAIL: missing toolchain binary $tool (comparator config has enable_nanoda: true)" | tee -a ../rj-evidence/checker-binaries.txt
              exit 1
            fi
          done
          lake comparator --help 2>&1 | head -30 | tee ../rj-evidence/lake-comparator-help.txt || true
          # bubblewrap: the core comparator sandboxes the code it
          # judges with bwrap. No passwordless sudo on this runner,
          # so a missing bwrap comes from the distro .deb extracted
          # without root (same pattern as the ripgrep fix in the
          # kernel-replay workflow). The extracted binary runs in
          # unprivileged-userns mode; the smoke test below proves
          # the sandbox actually works before any verdict rides on
          # it. No shim or passthrough is ever substituted.
          if ! command -v bwrap >/dev/null 2>&1; then
            echo "installing: bubblewrap (distro .deb, extracted, no root)"
            mkdir -p "$HOME/.local/bin" /tmp/bwrap-extract
            cd /tmp
            apt-get download bubblewrap 2>&1 | tail -2
            deb=$(ls bubblewrap_*.deb 2>/dev/null | head -1)
            [ -n "$deb" ] || { echo "SETUP-FAIL: apt-get download bubblewrap produced no .deb"; exit 1; }
            dpkg -x "$deb" /tmp/bwrap-extract
            [ -x /tmp/bwrap-extract/usr/bin/bwrap ] || { echo "SETUP-FAIL: .deb contains no usr/bin/bwrap"; exit 1; }
            cp /tmp/bwrap-extract/usr/bin/bwrap "$HOME/.local/bin/bwrap"
            rm -rf "$deb" /tmp/bwrap-extract
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
            cd -
          fi
          command -v bwrap | tee ../rj-evidence/bwrap.txt
          bwrap --version 2>&1 | tee -a ../rj-evidence/bwrap.txt
          bwrap --ro-bind / / --dev /dev /bin/true || { echo "SETUP-FAIL: bwrap present but cannot create a sandbox (user namespaces unavailable)"; exit 1; }
          echo "bwrap sandbox smoke test: OK" | tee -a ../rj-evidence/bwrap.txt

      - name: Fetch Mathlib prebuilt oleans
        working-directory: rj-forge
        run: |
          set -o pipefail
          lake exe cache get 2>&1 | tee ../rj-evidence/cache-get.log

      - name: Build the library (default target)
        working-directory: rj-forge
        run: |
          set -o pipefail
          timeout 5400 lake build 2>&1 | tee ../rj-evidence/build.log

      - name: Run the comparator (core lake comparator, author's config)
        working-directory: rj-forge
        run: |
          set +e
          timeout 14400 lake comparator --config Comparator/comparator.json > ../rj-evidence/comparator.log 2>&1
          code=$?
          echo "$code" > ../rj-evidence/comparator-exit.txt
          cat ../rj-evidence/comparator.log
          echo "comparator exit: $code"

      - name: Independent axiom check on the four solution theorems
        working-directory: rj-forge
        run: |
          set -o pipefail
          lake build Solution 2>&1 | tee ../rj-evidence/build-solution.log
          cat > AxiomAudit.lean <<'EOF'
          module
          public import Solution
          #print axioms RiemannJensen.Challenge.exists_isDedekindZetaContinuation
          #print axioms RiemannJensen.Challenge.isDedekindZetaContinuation_unique
          #print axioms RiemannJensen.Challenge.dedekind_thm_main
          #print axioms RiemannJensen.Challenge.riemannJensen_main
          EOF
          lake env lean AxiomAudit.lean > ../rj-evidence/axioms.txt 2>&1 || true
          cat ../rj-evidence/axioms.txt

      - name: Verdict (fail-closed)
        run: |
          python3 - <<'EOF'
          import re, sys
          ev = 'rj-evidence/'
          ok = True
          def fail(msg):
              global ok
              ok = False
              print('FAIL:', msg)
          try:
              code = int(open(ev + 'comparator-exit.txt').read().strip())
          except Exception as e:
              code = None
              fail(f'cannot read comparator exit code: {e}')
          if code != 0:
              fail(f'comparator exit code is {code}, not 0')
          clog = open(ev + 'comparator.log').read()
          if 'Your solution is okay!' not in clog:
              fail('comparator success line "Your solution is okay!" absent from its log')
          else:
              print('comparator: exit 0 and "Your solution is okay!" present')
          print('comparator log mentions nanoda:', 'nanoda' in clog.lower())
          txt = open(ev + 'axioms.txt').read()
          if 'sorryAx' in txt:
              fail('sorryAx present in an axiom listing')
          if 'unknown constant' in txt or 'unknown identifier' in txt:
              fail('AxiomAudit hit an unknown declaration name (listing incomplete)')
          std = {'propext', 'Classical.choice', 'Quot.sound'}
          expected = [
              'RiemannJensen.Challenge.exists_isDedekindZetaContinuation',
              'RiemannJensen.Challenge.isDedekindZetaContinuation_unique',
              'RiemannJensen.Challenge.dedekind_thm_main',
              'RiemannJensen.Challenge.riemannJensen_main',
          ]
          listings = re.findall(r"'([\w.]+)' depends on axioms: \[(.*?)\]", txt, re.DOTALL)
          found = {}
          for name, ax in listings:
              found[name] = {a.strip() for a in ax.replace('\n', ' ').split(',') if a.strip()}
          for m in re.findall(r"'([\w.]+)' does not depend on any axioms", txt):
              found[m] = set()
          # The audit file sits outside every namespace, so listings
          # print fully qualified; also accept a listing keyed by any
          # name ENDING in the expected suffix (bare-name spellings).
          def lookup(name):
              if name in found:
                  return found[name]
              for k, v in found.items():
                  if k.endswith('.' + name.split('.')[-1]) and name.split('.')[-1] in k:
                      return v
              return None
          for name in expected:
              s = lookup(name)
              if s is None:
                  fail(f'no axiom listing for {name}')
                  continue
              extra = s - std
              if extra:
                  fail(f'{name}: axioms outside the standard three: {sorted(extra)}')
              else:
                  print(f'{name}: standard-three-subset-ok ({sorted(s)})')
          print('VERDICT: PASS' if ok else 'VERDICT: FAIL')
          with open(ev + 'verdict.txt', 'w') as f:
              f.write('PASS\n' if ok else 'FAIL\n')
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemannjensen-forge-evidence
          path: rj-evidence

      - name: Leave shared checkout clean (meta-rule)
        if: always()
        run: |
          rm -rf rj-forge
          git checkout --force HEAD 2>/dev/null || true
