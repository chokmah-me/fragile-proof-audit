name: full-build

# Full `lake build` on a GitHub-hosted runner: the stable, reboot-free home
# for long builds. The per-push `verify` workflow already builds on the
# self-hosted runner; this one exists for builds that must survive the
# ~2h VM reboot cycle (hosted jobs run up to 6h uninterrupted).
#
# mathlib arrives as prebuilt oleans (`lake exe cache get`), so only this
# repo's own modules compile; the root-package .lake/build cache is keyed
# on toolchain + lakefile + manifest, making reruns incremental.
# Public repo => hosted minutes are unlimited; this costs nothing.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Lake target to build"
        required: false
        default: "FragileProofAudit"
  schedule:
    - cron: "17 7 * * 1" # Mondays ~03:17 ET, weekly full-build health check

permissions:
  contents: read

concurrency:
  group: full-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Update dependencies
        run: lake update

      - name: Fetch mathlib prebuilt oleans
        run: lake exe cache get

      - name: Full build
        run: |
          set -o pipefail
          TARGET="${{ inputs.target }}"
          lake build ${TARGET:-FragileProofAudit} 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lake-build-log
          path: build.log
