name: ab-fluid-euler-build

# Full `lake build` of the Euler route of tristanbuckmaster/fluid_lean
# (the EulerBlowup lake project) on the self-hosted WSL runner, followed by
# the hardened forge source-scan + axiom audit
# (scripts/forge/verify_lean_project.py).
#
# Why this exists: the agent VM reboots roughly every 2 hours, which keeps
# killing the Euler build during its final two modules
# (EulerBlowup/Ring/S4r/Recipe, EulerBlowup/Ring/Lr/Tower -- heavy,
# memory-hungry: ~5GB between two workers on the VM's 8GB box). The build
# sat at 9716/9769 units for a full day, reboot-killed before the tail
# closed. DESKTOP-7HDI2D1 does not reboot under a build and proved itself
# on the 12,321-module headline forge (3h14m).
#
# Scope is euler-blowup ONLY -- the audit's Euler route (PASS: Euler clean,
# zero sorry/axiom outside Challenge). The boussinesq-blowup / affinecore
# projects are not built here.
#
# Upstream repo is public; the commit pin is fail-closed (see the pin step).
# NOTE on the expected outcome: fluid_lean contains a sorry in
# EulerBlowup/Challenge.lean, which is inside the audit's Challenge
# exemption. The forge does not know that exemption, so it will report its
# verdict raw (expect FAILED, not VERIFIED) -- the evidence it uploads is
# interpreted against the audit scope, not the raw verdict alone.
#
# Manual dispatch only. Runs on the self-hosted WSL runner.

on:
  workflow_dispatch:
    inputs:
      fluid_lean_commit:
        description: 'fluid_lean commit SHA to build (40-hex, fail-closed)'
        required: false
        default: 'd0124689230b58b4f86e7b90ac59de06404b3b6b'

permissions:
  contents: read

concurrency:
  group: ab-fluid-euler-build
  cancel-in-progress: false

jobs:
  euler:
    runs-on: [self-hosted, desktop]
    env:
      # Scratch clone lives OUTSIDE the git checkout, at
      # <runner _work>/<repo>/ab-fluid-euler-scratch. This is structural:
      # actions/checkout's default `git clean -ffdx` (in ANY workflow that
      # shares this runner -- verify, zeta-zero-verify, headline-forge,
      # ...) deletes untracked dirs inside the repo, which silently
      # defeated the resume policy on runs #6/#7/#8 (each printed FRESH
      # because a verify or zeta checkout had wiped ./ab-fluid between
      # dispatches). Outside the repo, no checkout can touch it.
      AB_FLUID: ${{ github.workspace }}/../ab-fluid-euler-scratch
    # Squat-guard: the runner does one job at a time, so a wedged build
    # blocks verify. 9h is generous (headline forge: 12,321 modules in
    # 3h14m on this box; euler-blowup is 1,114 own modules with deps cached).
    timeout-minutes: 540
    steps:
      - name: Check out this repo
        # META-RULE (2026-10-09): full checkout -- never sparse-checkout or
        # any other persistent git-config change on the shared self-hosted
        # checkout. The fluid_lean scratch clone lives OUTSIDE this checkout
        # (see the AB_FLUID env above), so it cannot poison this checkout's
        # config and no checkout can delete it; it is removed on full
        # success, kept for resume on failure/cancellation (see the cleanup
        # step -- the runner has died mid-build four times).
        #
        # clean: false keeps this checkout's own untracked files (e.g. the
        # per-run logs below) across steps; tracked-file hygiene is still
        # enforced by the cleanup step's `git checkout --force HEAD`.
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Validate the commit pin
        # The input reaches the shell through `env:`, never through `${{ }}`
        # substitution inside the `run:` block: a quoted substitution would
        # still execute an input like `$(evil)` (command substitution runs
        # inside double quotes -- the classic GHA script-injection hole).
        # An env var's value is never re-parsed by the shell, and the regex
        # below then rejects anything that is not a 40-hex SHA.
        env:
          PIN: ${{ inputs.fluid_lean_commit }}
        run: |
          set -euo pipefail
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL: fluid_lean_commit is not a 40-hex SHA"
            exit 1
          fi
          echo "FLUID_SHA=$PIN" >> "$GITHUB_ENV"

      - name: Clone (or resume) fluid_lean at the pinned commit
        run: |
          set -euo pipefail
          # RESUME POLICY: $AB_FLUID persists between dispatches on the
          # self-hosted runner (the cleanup step removes it only on full
          # success). If a usable clone is already there, re-pin it to the
          # validated commit and keep the .lake incremental build progress
          # -- the runner has died mid-build four times, and a blind rm -rf
          # would discard hours of work every time. Any doubt -> fresh
          # clone (fail-closed).
          #
          # The scratch lives OUTSIDE the git checkout (see AB_FLUID), so no
          # workflow's `git clean -ffdx` can delete it between dispatches.
          # Per-run evidence files (in the checkout) are removed here so a
          # resumed run never uploads a stale log.
          rm -f FLUID_COMMIT lake-update.log build.log forge-report.json forge-err.log
          # One-time migration (2026-10-13): the scratch previously lived at
          # ./ab-fluid inside the checkout. If it's there, move it to the new
          # location instead of re-cloning -- run #8 left 93% of a build in it.
          if [ ! -d "$AB_FLUID/.git" ] && [ -d ab-fluid/.git ]; then
            echo "MIGRATE: moving legacy ./ab-fluid to $AB_FLUID"
            rm -rf "$AB_FLUID"
            mv ab-fluid "$AB_FLUID"
          fi
          resumed=0
          if [ -d "$AB_FLUID/.git" ]; then
            if ( cd "$AB_FLUID" \
                 && [ "$(git remote get-url origin 2>/dev/null)" = "https://github.com/tristanbuckmaster/fluid_lean.git" ] \
                 && git fetch --depth 1 origin "$FLUID_SHA" \
                 && git checkout "$FLUID_SHA" \
                 && [ "$(git rev-parse HEAD)" = "$FLUID_SHA" ] ); then
              resumed=1
              echo "RESUME: existing scratch re-pinned to $FLUID_SHA; keeping .lake build progress"
            else
              echo "RESUME failed (unexpected scratch state) -- falling back to fresh clone"
            fi
          fi
          if [ "$resumed" != 1 ]; then
            # Clean slate first: cloning into an existing dir fails.
            rm -rf "$AB_FLUID"
            git clone https://github.com/tristanbuckmaster/fluid_lean.git "$AB_FLUID"
            ( cd "$AB_FLUID" \
              && git fetch --depth 1 origin "$FLUID_SHA" \
              && git checkout "$FLUID_SHA" \
              && [ "$(git rev-parse HEAD)" = "$FLUID_SHA" ] ) \
              || { echo "FAIL: fresh clone could not be pinned to $FLUID_SHA"; exit 1; }
            echo "FRESH: cloned fluid_lean at $FLUID_SHA"
          fi
          # Fail-closed pin: no fallback to main. A wrong commit would
          # silently build (and audit) the wrong formalization.
          [ "$(git -C "$AB_FLUID" rev-parse HEAD)" = "$FLUID_SHA" ] || { echo "FAIL: HEAD $FLUID_SHA mismatch"; exit 1; }
          git -C "$AB_FLUID" rev-parse HEAD | tee FLUID_COMMIT
          # Sanity: the Euler project must exist at this commit (it uses
          # lakefile.toml, not lakefile.lean -- check the right filename).
          [ -f "$AB_FLUID/euler-blowup/lakefile.toml" ] || { echo "FAIL: euler-blowup/lakefile.toml absent at $FLUID_SHA"; exit 1; }
          [ -f "$AB_FLUID/euler-blowup/lean-toolchain" ] || { echo "FAIL: euler-blowup/lean-toolchain absent at $FLUID_SHA"; exit 1; }
          tc="$(cat "$AB_FLUID/euler-blowup/lean-toolchain")"
          echo "toolchain: $tc"

      - name: Align toolchain with mathlib (cache requirement)
        # `lake update` runs mathlib's post-update hook, which fetches
        # prebuilt oleans -- but the fetch succeeds ONLY when the project's
        # toolchain exactly matches the dependency's fixed toolchain.
        # EulerBlowup declares v4.32.2 while mathlib@v4.32.0 pins v4.32.0;
        # without this alignment the update fails with
        # "error: mathlib: failed to fetch cache" (runs #1 and #3). The
        # alignment MUST precede `lake update` because the failing fetch is
        # inside update's own post-update hook. mathlib's fixed toolchain is
        # read via plain HTTPS from raw.githubusercontent.com at the rev
        # euler-blowup/lakefile.toml requires (derived via tomllib, not
        # hardcoded) -- no extra clone, no sparse-checkout state anywhere.
        # (The same host already serves the elan installer above, so it is
        # proven reachable from this runner.)
        # Patch-level deviation (4.32.2 -> 4.32.0); sources compiled as-is.
        run: |
          set -euo pipefail
          cd "$AB_FLUID"
          rev="$(python3 -c "
          import tomllib
          d = tomllib.load(open('euler-blowup/lakefile.toml', 'rb'))
          reqs = [r for r in d.get('require', []) if r.get('name') == 'mathlib']
          assert len(reqs) == 1, 'expected exactly one mathlib require'
          print(reqs[0]['rev'])
          ")"
          echo "mathlib rev required: $rev"
          # -f: fail on HTTP error (unknown rev) -- never a silent empty file.
          curl -fsSL "https://raw.githubusercontent.com/leanprover-community/mathlib4/$rev/lean-toolchain" -o mathlib-toolchain
          [ -s mathlib-toolchain ] || { echo "FAIL: empty toolchain file fetched"; exit 1; }
          echo "mathlib fixed toolchain: $(cat mathlib-toolchain)"
          echo "project toolchain before: $(cat euler-blowup/lean-toolchain)"
          cp mathlib-toolchain euler-blowup/lean-toolchain
          echo "project toolchain after: $(cat euler-blowup/lean-toolchain)"
          rm -f mathlib-toolchain

      - name: Fetch dependencies
        # NOTE: no `working-directory` override -- the '${{ github.workspace }}/..'
        # form it used until run #9 is untested against the runner's path
        # validation (the same '..' construct is flatly rejected by
        # upload-artifact), so the step cds into the project itself, like
        # the Align step and step 5 already do with $AB_FLUID.
        run: |
          set -o pipefail
          cd "$AB_FLUID/euler-blowup" || { echo "FAIL: project dir missing: $AB_FLUID/euler-blowup"; exit 1; }
          lake update 2>&1 | tee "$GITHUB_WORKSPACE/lake-update.log"
          # Propagate lake update's own exit code: without this the step's
          # exit is the grep check's, so a failed update would be masked
          # and only surface indirectly in later steps (same exit-code
          # class as the forge capture bug fixed below).
          upd=$?
          if [ "$upd" != 0 ]; then
            echo "FAIL: lake update exited $upd"
            exit "$upd"
          fi
          # Fail-fast (harness rule): 'pins different versions' means the
          # satellite revs resolved wrong and cache-get would then compute
          # wrong hashes -- die here, not hours into the build.
          if grep -q "pins different versions" "$GITHUB_WORKSPACE/lake-update.log"; then
            echo "FAIL: dependency satellite version conflict"
            exit 1
          fi

      - name: Fetch mathlib prebuilt oleans
        run: |
          cd "$AB_FLUID/euler-blowup" || { echo "FAIL: project dir missing: $AB_FLUID/euler-blowup"; exit 1; }
          lake exe cache get

      - name: Build euler-blowup
        run: |
          set -o pipefail
          cd "$AB_FLUID/euler-blowup" || { echo "FAIL: project dir missing: $AB_FLUID/euler-blowup"; exit 1; }
          lake build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Hardened forge audit
        # NOTE: no `working-directory` override -- the forge script lives in
        # this repo's checkout (the step default); the project path is passed
        # absolute so a re-rooting mistake cannot silently audit the wrong
        # directory. No --skip-build: the forge re-verifies the build
        # itself (incremental no-op) and --skip-build would skip the axiom
        # audit entirely.
        run: |
          set -euo pipefail
          [ -n "${GITHUB_WORKSPACE:-}" ] || { echo "FAIL: GITHUB_WORKSPACE unset"; exit 1; }
          proj="$AB_FLUID/euler-blowup"
          [ -d "$proj" ] || { echo "FAIL: project dir missing: $proj"; exit 1; }
          # Capture the forge's exit code via `|| code=$?`, NEVER
          # `cmd; code=$?`: a command followed by `;` is NOT exempt from
          # `set -e`, so on a non-zero forge exit the shell died at the
          # command itself and the verdict was never printed (run #10:
          # build green, forge exit 1, zero evidence of what it found).
          # The `||` list IS exempt -- the failure is handled, then the
          # verdict is printed and uploaded before the step re-exits.
          code=0
          # --exclude-module Challenge: Challenge.lean is the project's own
          # trusted comparator statement ("Mathlib-only and trusted" per
          # euler-blowup/lakefile.toml), and the audit scope already exempts
          # it (the anticipated sorry). It re-declares EulerBlowup-namespace
          # structures (SmoothForce et al.) that the EulerBlowup library also
          # declares, so importing both in the axiom audit's single
          # environment is a fatal duplicate-declaration ("environment
          # already contains ... from Challenge", run #13) that zeroes the
          # whole audit. The exclusion covers only the axiom audit's imports
          # and #print list; the source scans still see Challenge.lean, so
          # the sorry finding is unaffected.
          python3 scripts/forge/verify_lean_project.py \
            --project "$proj" --timeout 3600 --json \
            --exclude-module Challenge \
            > forge-report.json 2>forge-err.log || code=$?
          echo "forge exit code: $code"
          if [ -f forge-report.json ]; then
            cat forge-report.json
          else
            echo "(forge wrote no report)"
          fi
          if [ -s forge-err.log ]; then
            echo "--- forge stderr (last 50 lines) ---"
            tail -n 50 forge-err.log || true
          fi
          exit $code

      - name: Stage scratch results for upload
        if: always()
        run: |
          # upload-artifact patterns may not contain '..' (run #9 died
          # here too: "Relative pathing '.' and '..' is not allowed"), so
          # the scratch results (outside the checkout) are copied into the
          # workspace first and uploaded from there.
          if [ -d "$AB_FLUID/euler-blowup/results" ]; then
            mkdir -p euler-results
            cp -r "$AB_FLUID/euler-blowup/results/." euler-results/
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-fluid-euler-evidence
          path: |
            FLUID_COMMIT
            lake-update.log
            build.log
            forge-report.json
            forge-err.log
            euler-results/

      - name: Leave shared checkout clean (meta-rule)
        if: always()
        run: |
          # Self-heal: never leave sparse-checkout (or other persistent git
          # state) behind in the shared self-hosted workspace -- see the
          # META-RULE comment on the checkout step above.
          # NOTE: never set `working-directory` on this step -- the default
          # step directory is already the repo checkout, so a repo-name value
          # re-roots under the checkout (fragile-proof-audit/fragile-proof-audit)
          # and the step dies before running anything (headline run #4).
          #
          # $AB_FLUID is removed ONLY when the whole job succeeded (build +
          # forge green, evidence uploaded). On failure or cancellation it is
          # KEPT so the next dispatch resumes the incremental `lake build`
          # instead of redoing hours of work -- the runner has died mid-build
          # four times. Disk is plentiful; a kept scratch dir is the lesser
          # evil. Because the scratch lives outside the git checkout, no
          # other workflow's `git clean` can delete it between dispatches.
          # `${{ job.status }}` is a GitHub-provided enum, never user input.
          if [ "${{ job.status }}" = "success" ]; then
            rm -rf "$AB_FLUID"
          else
            echo "keeping $AB_FLUID for resume (job status: ${{ job.status }})"
          fi
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true
