name: zeta-zero-verify

# Independent re-verification of arXiv:2610.08965 (Knausgård: zeta-zero records,
# 83.9% distinct / 67.35% simple on the critical line, Lean 4 formalization).
# Harvest pick #1, October 12 run. Builds the author's formalization
# (kristianmk/839 at the pinned commit) on top of anthropics/formal-math/zeta23
# at the author's pinned commit, with the author's upstream_relax.patch, then
# re-runs the author's own axiom-audit scripts (scripts/PrintAxioms*.lean) and
# statement-comparison scripts (scripts/Compare*.lean, generated by
# scripts/make_compare.py).
#
# Why the self-hosted runner: the three native_decide search evaluations need
# 7/11/7 GB RAM (author's README); the agent VM has 7 GB total. The WSL box
# has 32 GB.
#
# Queuing: the schedule polls every 30 min and the job proceeds only when the
# Euler build has finished SUCCESSFULLY (conclusion == 'success') AND this
# workflow has neither a completed run nor another live run. Single-shot by
# design -- after one finished run (any conclusion) later schedule ticks exit
# in seconds. Manual dispatch bypasses the gates. Delete this file after the
# audit note is written.
#
# 2026-10-12: the gate used to check the Euler run's status == 'completed',
# which is also true for FAILED runs -- the full replay fired off a red Euler
# run, and the default clean:true checkout then wiped ab-fluid/build.log on
# the shared runner. Both fixed here (conclusion check + clean:false).
#
# Queued 2026-10-12 at the user's "queue the full WSL re-run the moment Euler
# lands" (thumbs-up to the proposal). Euler run in flight at queue time:
# ab-fluid-euler-build #38248597178.
#
# Adversarial notes (2026-10-12, before first dispatch):
# - Workflow inputs reach the shell through env vars, never through ${{ }}
#   substitution inside run: blocks (quoted substitution would still execute
#   $(...) -- the classic GHA script-injection hole). The pin is then
#   regex-validated to 40-hex.
# - working-directory overrides resolve to zeta-verify/formal-math/zeta23, a
#   real subdir of the checkout -- not a redundant re-root (cf. headline #4).
# - The three Local.RunAll builds run strictly sequentially (author's README:
#   "built first and one at a time so that they do not run side by side");
#   the three SpotChecks likewise (10-12 GB each).
# - concurrency cancel-in-progress is FALSE: with a 30-min schedule and a
#   multi-hour build, cancel-in-progress:true would kill the build on the next
#   tick. Queued ticks exit via the gate instead (prior-completed /
#   other-live checks), so no build stampede.
# - permissions include actions:read -- the gate lists workflow runs via the
#   API with github.token. contents:read alone would 403.
# - META-RULE (2026-10-09): scratch work goes in zeta-verify/ (a subdir of the
#   shared checkout), removed by an if:always() cleanup step; no
#   sparse-checkout or other persistent git-config mutation anywhere.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      zeta839_commit:
        description: 'kristianmk/839 commit SHA to verify (40-hex, fail-closed)'
        required: false
        default: 'b280d51bef5ab32b3280b0955d040085ed522d59'

permissions:
  contents: read
  actions: read

concurrency:
  group: zeta-zero-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    # Squat-guard: author's timings on a 12-core box -- RunAll1 33-65 min,
    # RunAll2 33-96 min, RunAll3 94-110 min, rest 9-13 min, SpotChecks unknown.
    # 9h matches the Euler workflow's budget on this box.
    timeout-minutes: 540
    steps:
      - name: Check out this repo
        # clean: false -- do NOT revert to the default. Same rule as the
        # Euler and verify workflows: the checkout action's default
        # `git clean -ffdx` deletes the ab-fluid/ scratch tree (with its
        # build.log) on the shared self-hosted runner -- this workflow's
        # 2026-10-12 misfire wiped it. Nothing in this workflow modifies
        # tracked files; the cleanup step removes zeta-verify/ and the
        # per-run logs, and the Assemble step re-creates zeta-verify/.
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Gate — proceed only when Euler succeeded and no prior/live run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: gates bypassed."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          euler="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/ab-fluid-euler-build.yml/runs?per_page=1" \
            | python3 -c "
          import json, sys
          runs = json.load(sys.stdin).get('workflow_runs', [])
          r = runs[0] if runs else None
          ok = bool(r and r.get('status') == 'completed'
                    and r.get('conclusion') == 'success')
          print('success' if ok else 'no')")"
          echo "euler latest status: $euler"
          zeta="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/zeta-zero-verify.yml/runs?per_page=10" \
            | RUN_ID="$RUN_ID" python3 -c "
          import json, sys, os
          me = os.environ['RUN_ID']
          runs = json.load(sys.stdin).get('workflow_runs', [])
          done = any(r.get('conclusion') for r in runs)
          live = any(str(r.get('id')) != me and r.get('status') != 'completed' for r in runs)
          print('done' if done else 'live' if live else 'none')")"
          echo "zeta prior: $zeta"
          if [ "$euler" = "success" ] && [ "$zeta" = "none" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop — gate closed
        if: steps.gate.outputs.proceed != 'true'
        run: |
          echo "Gate closed (Euler not green, or a zeta run already finished/is live). Exiting quietly."

      - name: Validate the 839 pin
        if: steps.gate.outputs.proceed == 'true'
        env:
          PIN_IN: ${{ inputs.zeta839_commit }}
        run: |
          set -euo pipefail
          # Scheduled ticks carry no inputs; fall back to the queued pin.
          PIN="${PIN_IN:-b280d51bef5ab32b3280b0955d040085ed522d59}"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FAIL: zeta839_commit is not a 40-hex SHA"
            exit 1
          fi
          echo "ZETA_SHA=$PIN" >> "$GITHUB_ENV"

      - name: Install elan
        if: steps.gate.outputs.proceed == 'true'
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Assemble the build tree
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Clean slate: zeta-verify/ persists between dispatches on the
          # self-hosted runner, and cloning into an existing dir fails.
          rm -rf zeta-verify
          mkdir -p zeta-verify && cd zeta-verify
          git clone https://github.com/kristianmk/839.git zeta839
          cd zeta839
          git fetch --depth 1 origin "$ZETA_SHA"
          git checkout "$ZETA_SHA"
          head="$(git rev-parse HEAD)"
          [ "$head" = "$ZETA_SHA" ] || { echo "FAIL: 839 HEAD $head != pinned $ZETA_SHA"; exit 1; }
          echo "$head" | tee "$GITHUB_WORKSPACE/ZETA839_COMMIT"
          cd ..
          git clone https://github.com/anthropics/formal-math.git
          cd formal-math
          FORMAL_SHA=fbdc36bbf17d20af3fd0447c6d1a8a02773c9844
          git fetch --depth 1 origin "$FORMAL_SHA"
          git checkout "$FORMAL_SHA"
          head="$(git rev-parse HEAD)"
          [ "$head" = "$FORMAL_SHA" ] || { echo "FAIL: formal-math HEAD $head != pinned $FORMAL_SHA"; exit 1; }
          echo "$head" | tee "$GITHUB_WORKSPACE/FORMAL_COMMIT"
          cd zeta23
          # The author's build recipe (lean/README.md), verbatim.
          SRC="$GITHUB_WORKSPACE/zeta-verify/zeta839/lean"
          command -v patch >/dev/null || { echo "FAIL: patch(1) not installed"; exit 1; }
          patch -p1 < "$SRC/upstream_relax.patch"
          cp -r "$SRC"/Distinct839 "$SRC"/Simple673 "$SRC"/Ceilings "$SRC"/Further "$SRC"/Line889 "$SRC"/scripts .
          cp "$SRC"/*.lean .
          cat "$SRC/lakefile.additions.toml" >> lakefile.toml
          # Fail-closed assembly checks.
          [ -f Distinct839/Local/RunAll.lean ] || { echo "FAIL: Distinct839 not copied"; exit 1; }
          [ -f Simple673/Local/RunAll.lean ] || { echo "FAIL: Simple673 not copied"; exit 1; }
          [ -f Line889/Local/RunAll.lean ] || { echo "FAIL: Line889 not copied"; exit 1; }
          [ -f scripts/PrintAxioms839.lean ] || { echo "FAIL: scripts not copied"; exit 1; }
          grep -q Distinct839Checker lakefile.toml || { echo "FAIL: lakefile additions not appended"; exit 1; }
          echo "project toolchain: $(cat lean-toolchain)"

      - name: Install the pinned toolchain
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)"

      - name: Fetch prebuilt oleans
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          lake exe cache get 2>&1 | tee "$GITHUB_WORKSPACE/zeta-cache.log"

      - name: Build search 1 of 3 (Distinct839.Local.RunAll)
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          export LEAN_NUM_THREADS="$(nproc)"
          lake build Distinct839.Local.RunAll 2>&1 | tee "$GITHUB_WORKSPACE/zeta-build-runall1.log"

      - name: Build search 2 of 3 (Simple673.Local.RunAll)
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          export LEAN_NUM_THREADS="$(nproc)"
          lake build Simple673.Local.RunAll 2>&1 | tee "$GITHUB_WORKSPACE/zeta-build-runall2.log"

      - name: Build search 3 of 3 (Line889.Local.RunAll)
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          export LEAN_NUM_THREADS="$(nproc)"
          lake build Line889.Local.RunAll 2>&1 | tee "$GITHUB_WORKSPACE/zeta-build-runall3.log"

      - name: Build the developments
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          export LEAN_NUM_THREADS="$(nproc)"
          lake build Solution839 Solution673 SolutionFurther Solution889 Ceilings SolutionCeilings 2>&1 | tee "$GITHUB_WORKSPACE/zeta-build-solutions.log"
          lake build Challenge839 Challenge673 ChallengeFurther Challenge889 ChallengeCeilings 2>&1 | tee -a "$GITHUB_WORKSPACE/zeta-build-solutions.log"

      - name: Build the spot checks (needed by the axiom scripts)
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          export LEAN_NUM_THREADS="$(nproc)"
          lake build Distinct839.Local.SpotChecks 2>&1 | tee "$GITHUB_WORKSPACE/zeta-build-spot1.log"
          lake build Simple673.Local.SpotChecks 2>&1 | tee "$GITHUB_WORKSPACE/zeta-build-spot2.log"
          lake build Line889.Local.SpotChecks 2>&1 | tee "$GITHUB_WORKSPACE/zeta-build-spot3.log"

      - name: Re-run the axiom audit
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          {
            for s in 839 673 Further 889 Ceilings; do
              echo "== scripts/PrintAxioms$s.lean"
              lake env lean "scripts/PrintAxioms$s.lean"
            done
          } 2>&1 | tee "$GITHUB_WORKSPACE/zeta-axioms.txt"
          # Diff against the author's own audit output (record, don't fail:
          # a difference is a finding for the audit note, not a build error).
          if diff -u "$GITHUB_WORKSPACE/zeta-verify/zeta839/lean/axioms.txt" \
              "$GITHUB_WORKSPACE/zeta-axioms.txt" > "$GITHUB_WORKSPACE/zeta-axioms.diff"; then
            echo "AXIOM AUDIT: identical to the author's axioms.txt"
          else
            echo "AXIOM AUDIT: DIFFERS from the author's axioms.txt -- see zeta-axioms.diff"
          fi

      - name: Statement-fidelity check (Compare scripts)
        if: steps.gate.outputs.proceed == 'true'
        working-directory: zeta-verify/formal-math/zeta23
        run: |
          set -o pipefail
          python3 scripts/make_compare.py 2>&1 | tee "$GITHUB_WORKSPACE/zeta-compare-gen.log"
          {
            for s in 839 673 Further 889 Ceilings; do
              echo "== scripts/Compare$s.lean"
              lake env lean "scripts/Compare$s.lean"
            done
          } 2>&1 | tee "$GITHUB_WORKSPACE/zeta-compare.log"

      - name: Upload evidence
        # Gate-closed ticks upload nothing (no files exist); a finished build
        # attempt always uploads, green or red.
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zeta-zero-verify-evidence
          path: |
            ZETA839_COMMIT
            FORMAL_COMMIT
            zeta-cache.log
            zeta-build-*.log
            zeta-axioms.txt
            zeta-axioms.diff
            zeta-compare-gen.log
            zeta-compare.log

      - name: Leave shared checkout clean (meta-rule)
        if: always()
        run: |
          rm -rf zeta-verify
          # Log and pin files are uploaded above; leave none behind.
          rm -f ZETA839_COMMIT FORMAL_COMMIT zeta-cache.log zeta-build-*.log \
            zeta-axioms.txt zeta-axioms.diff zeta-compare-gen.log zeta-compare.log
          # Self-heal check: no persistent git-config residue may survive.
          if git config --list 2>/dev/null | grep -qi sparse; then
            echo "FAIL: sparse-checkout residue in shared checkout"
            exit 1
          fi
