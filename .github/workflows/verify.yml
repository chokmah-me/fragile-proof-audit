name: verify

# Fast suite: every numeric gate except ab_fluid, plus the full Lean build.
# ab_fluid (5,249-piece Euler interval replay, hours-long) runs in the
# deep-replay workflow instead: weekly + on demand, with checkpoint resume.
# Splitting keeps per-push CI under ~2h and immune to runner time limits.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match PINNED in scripts/gates/ab_fluid.py and
  # scripts/gates/ab_fluid_boussinesq.py (same convention as deep-replay).
  AB_FLUID_PIN: d0124689230b58b4f86e7b90ac59de06404b3b6b

jobs:
  gates:
    # External PRs keep the clean-room GitHub-hosted runner; pushes and
    # manual runs use the self-hosted runner (persistent elan/pip cache).
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 180
    steps:
      # clean: false -- do NOT revert this to the default. The default
      # `git clean -ffdx` deletes the ab-fluid/ scratch clone (with its
      # .lake incremental progress) that the ab-fluid-euler-build workflow
      # keeps between dispatches for resume; a verify run landing between
      # two euler dispatches would silently turn the next euler run into a
      # fresh multi-hour build (this bit run #7, 2026-10-12). Side benefit:
      # the repo's own .lake/ now persists too, making this job incremental
      # instead of a full rebuild every push.
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Provision ab-fluid source (ab_fluid gates)
        run: |
          set -euo pipefail
          # The ab_fluid gates read a pinned fluid_lean clone from
          # $HOME/workspace/ab-fluid-verify (REPO in scripts/gates/
          # ab_fluid.py and ab_fluid_boussinesq.py). That clone used to
          # exist only because it was cloned by hand on the desktop
          # runner; the first gates run on a clean runner (dell-laptop,
          # run 38868711539) failed with "repo not found" verdict drift.
          # Provision it here so any runner satisfies the dependency.
          case "$AB_FLUID_PIN" in
            *[!0-9a-f]*)
              echo "AB_FLUID_PIN is not lowercase hex: $AB_FLUID_PIN" >&2
              exit 1
              ;;
          esac
          if [ "${#AB_FLUID_PIN}" -ne 40 ]; then
            echo "AB_FLUID_PIN must be a full 40-char sha" >&2
            exit 1
          fi
          DEST="$HOME/workspace/ab-fluid-verify"
          mkdir -p "$HOME/workspace"
          if [ -e "$DEST" ] && [ ! -d "$DEST/.git" ]; then
            mv "$DEST" "$DEST.broken-$(date +%s)"
            echo "moved aside a non-git leftover at $DEST"
          fi
          if [ -d "$DEST/.git" ]; then
            if [ "$(git -C "$DEST" rev-parse HEAD)" != "$AB_FLUID_PIN" ]; then
              git -C "$DEST" fetch --quiet origin
              git -C "$DEST" checkout --quiet "$AB_FLUID_PIN"
            fi
          else
            git clone --quiet https://github.com/tristanbuckmaster/fluid_lean "$DEST"
            git -C "$DEST" checkout --quiet "$AB_FLUID_PIN"
          fi
          got="$(git -C "$DEST" rev-parse HEAD)"
          echo "ab-fluid-verify at $got (want $AB_FLUID_PIN)"
          [ "$got" = "$AB_FLUID_PIN" ]
      - name: Run numeric gates (fast suite)
        run: python scripts/gates/check.py --skip ab_fluid

  lean:
    # Same routing as gates: PRs on hosted, everything else on self-hosted.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 360
    steps:
      # clean: false -- see the gates job: the default `git clean -ffdx`
      # would delete the ab-fluid-euler-build scratch clone between euler
      # dispatches (this bit run #7, 2026-10-12). Also makes the lean build
      # incremental instead of a full rebuild every push.
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean-toolchain') }}
      - name: Lake build
        run: |
          lake update
          lake build FragileProofAudit
      - name: Forge verify
        run: python scripts/forge/verify_lean_project.py --project . --target FragileProofAudit --allow-native-decide
