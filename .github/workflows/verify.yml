name: verify

# Fast suite: every numeric gate except ab_fluid, plus the full Lean build.
# ab_fluid (5,249-piece Euler interval replay, hours-long) runs in the
# deep-replay workflow instead: weekly + on demand, with checkpoint resume.
# Splitting keeps per-push CI under ~2h and immune to runner time limits.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run numeric gates (fast suite)
        run: python scripts/gates/check.py --skip ab_fluid

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean-toolchain') }}
      - name: Lake build
        run: |
          lake update
          lake build FragileProofAudit
      - name: Forge verify
        run: python scripts/forge/verify_lean_project.py --project . --target FragileProofAudit
