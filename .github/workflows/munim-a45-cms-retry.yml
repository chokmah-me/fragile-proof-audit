name: munim-a45-cms-retry

# One-shot Dell run of the two open (t,d) UNSAT instances from the
# 2026-10-19 harvest batch (Munim A(4)/A(5) lane), this time with the
# XOR-native solver CryptoMiniSat 5.11.21. Prior evidence: (4,5) timed
# out Minisat22 36m, Cadical195 25m, Kissat404 25m, MapleChrono 30m on
# the VM, then ate a full 3h of Cadical 3.0.1 + LRAT on this runner
# (run 39318221673); (5,6) ate 3h of Cadical 3.0.1 + LRAT on this runner
# (run 39350149232). The encoding's F_2 arithmetic is built from xor2
# gates flattened to CNF; no XOR-native solver has ever been run.
# Thoughtstream link 2 (2026-10-20) is the design record.
# NOT standing CI: delete this file and scratch/munim-a45-cms/ once the
# receipts are recorded (same one-shot precedent as munim-a45-sat-retry,
# deleted in fd24690).
#
# On dell-laptop only ([self-hosted, laptop]):
#   1. setup: python3 venv in $HOME (python-sat, same API as the VM batch);
#      cryptominisat5 binary vendored in scratch/munim-a45-cms/ (built from
#      source 5.11.21 on Ubuntu 24.04, the runner's WSL OS) -- asserted
#      runnable and hash-pinned below;
#   2. control: (4,4) must return a brute-force-verified model, else the
#      job fails before any open instance is touched;
#   3. (4,5): a 120s probe must show CryptoMiniSat recovering XOR clauses
#      from the CNF (preflight gate; zero recovered XORs fails the step
#      closed with no wall spent), then a 60-minute hard wall clock, FRAT
#      proof logging ON;
#   4. (5,6): runs only if (4,5) resolved (SAT or UNSAT); 3h hard wall,
#      FRAT proof logging ON.
# SAT on (4,5) would break A(4)=4 (resp. (5,6) breaks A(5)=5): the driver
# decodes and brute-force-verifies any model before recording it.
#
# Harness rules: pins are literals (no dispatch inputs); scratch work lives
# in $HOME outside the shared checkout and is removed in an always() step;
# verdicts fail closed; every step that captures an exit code opens with
# 'set +e' (AGENTS.md lesson (24): the runner forces bash -e, which killed
# the first sat-retry's rc capture at timeout's exit 124); the committed
# scratch harness is deleted with this file after the receipts land.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: munim-a45-cms-retry
  cancel-in-progress: false

jobs:
  cms-retry:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 330
    steps:
      - name: Set up python3 venv
        run: |
          set -euo pipefail
          command -v python3 >/dev/null 2>&1 || { echo "FAIL: python3 not found on runner"; exit 1; }
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          V="$HOME/cms-venv"
          rm -rf "$V"
          if ! python3 -m venv "$V"; then
            echo "NOTE: python3 -m venv failed (this runner's python3 lacks the venv module); attempting to install python3-venv via apt"
            installed=0
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              if sudo -n apt-get update -qq && sudo -n apt-get install -y -qq python3-venv; then installed=1; fi
            elif [ "$(id -u)" = 0 ]; then
              if apt-get update -qq && apt-get install -y -qq python3-venv; then installed=1; fi
            fi
            if [ "$installed" -ne 1 ]; then
              echo "FAIL: python3 venv module unavailable and python3-venv could not be installed (no passwordless sudo, not root). On the Dell WSL box run: sudo apt install -y python3-venv"; exit 1
            fi
            python3 -m venv "$V" || { echo "FAIL: venv creation still fails after python3-venv install"; exit 1; }
          fi
          "$V/bin/pip" install --quiet "python-sat==1.9.dev16" || "$V/bin/pip" install --quiet python-sat
          "$V/bin/pip" show python-sat | grep -E '^Version:'
          echo "$V/bin" >> "$GITHUB_PATH"

      - name: Assert cryptominisat5 binary runs and matches pin
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/scratch/munim-a45-cms/cryptominisat5"
          echo "abafefecdc14904541c268bc97077dc210a8d8112f13150c182313bd5a1f079d  $BIN" | sha256sum -c -
          "$BIN" --help > /dev/null
          echo "cryptominisat5 OK"

      - name: Copy harness to scratch and check pins
        run: |
          set -euo pipefail
          S="$GITHUB_WORKSPACE/scratch/munim-a45-cms"
          D="$HOME/cms-scratch"
          rm -rf "$D"; mkdir -p "$D"
          cp "$S/indep_sat.py" "$S/run_cms.py" "$D/"
          (cd "$D" && sha256sum -c - <<'EOF'
          aafa27ab017ade4a04274c23dcbf0937aff094b6f60695aea32a6e4a050157a3  indep_sat.py
          ed05da2371117862ec689a85095609a0ca5c04b4e76387b9f4ce80281d70359e  run_cms.py
          EOF
          )
          echo "harness pins OK"

      - name: Control (4,4) must return a verified model
        timeout-minutes: 15
        run: |
          set +e
          D="$HOME/cms-scratch"; cd "$D"
          "$HOME/cms-venv/bin/python" run_cms.py 44 "$GITHUB_WORKSPACE/scratch/munim-a45-cms/cryptominisat5" 1 . > "$GITHUB_WORKSPACE/control-44.log" 2>&1
          rc=$?
          cat "$GITHUB_WORKSPACE/control-44.log"
          [ $rc -eq 0 ] || { echo "FAIL: driver exited $rc"; exit 1; }
          grep -q 'brute-force-verify=(True, ' "$GITHUB_WORKSPACE/control-44.log" || { echo "FAIL: control did not verify"; exit 1; }
          cp result-4-4.txt "$GITHUB_WORKSPACE/"
          echo "CONTROL PASS: (4,4) SAT with brute-force-verified model"

      - name: Instance (4,5) XOR preflight, then 60m hard wall
        id: i45
        timeout-minutes: 70
        run: |
          set +e
          D="$HOME/cms-scratch"; cd "$D"
          BIN="$GITHUB_WORKSPACE/scratch/munim-a45-cms/cryptominisat5"
          "$HOME/cms-venv/bin/python" -c "import indep_sat; E,s,B,A = indep_sat.encode(4,5,assumptions=(),flag=True); E.cnf.to_file('inst-4-5.cnf')"
          echo "fa2ba0572d844c0d1cede157610125d06ef5043c7a9db5eec8bca33755839ef9  inst-4-5.cnf" | sha256sum -c - || { echo "FAIL: (4,5) CNF drifted from its pin"; echo "resolved=false" >> "$GITHUB_OUTPUT"; exit 1; }
          timeout 120 "$BIN" --threads=1 --verb=2 inst-4-5.cnf > probe-45.log 2>&1
          if grep -qE 'matrices recovered|Good +matrix' probe-45.log; then
            echo "PREFLIGHT PASS: Gauss matrices recovered in probe-45.log" | tee "$GITHUB_WORKSPACE/preflight-45.txt"
            grep -E 'matrices recovered|Good +matrix' probe-45.log | head -3 | tee -a "$GITHUB_WORKSPACE/preflight-45.txt"
            cp probe-45.log "$GITHUB_WORKSPACE/"
          else
            echo "PREFLIGHT FAIL: no Gauss matrix recovery visible in probe-45.log within 120s; no wall spent" | tee "$GITHUB_WORKSPACE/result-4-5.txt"
            cp probe-45.log "$GITHUB_WORKSPACE/" 2>/dev/null || true
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          timeout 3600 "$HOME/cms-venv/bin/python" run_cms.py 45 "$BIN" 1 . > "$GITHUB_WORKSPACE/inst-45.log" 2>&1
          rc=$?
          cat "$GITHUB_WORKSPACE/inst-45.log"
          cp inst-4-5.cnf "$GITHUB_WORKSPACE/" 2>/dev/null || true
          cp cms-4-5.log "$GITHUB_WORKSPACE/" 2>/dev/null || true
          if [ $rc -eq 124 ]; then
            echo "(4,5) NOTE: hit the 60m wall clock (timeout 124); instance unresolved" | tee "$GITHUB_WORKSPACE/result-4-5.txt"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ $rc -eq 0 ] || { echo "FAIL: driver exited $rc"; echo "resolved=false" >> "$GITHUB_OUTPUT"; exit 1; }
          grep -q 'SOLVER-FAIL' "$GITHUB_WORKSPACE/inst-45.log" && { echo "FAIL: solver error on (4,5)"; echo "resolved=false" >> "$GITHUB_OUTPUT"; exit 1; }
          cp result-4-5.txt "$GITHUB_WORKSPACE/"
          cp proof-4-5.frat "$GITHUB_WORKSPACE/" 2>/dev/null || true
          echo "resolved=true" >> "$GITHUB_OUTPUT"
          echo "(4,5) step done"

      - name: Instance (5,6), 3h hard wall, only if (4,5) resolved
        if: steps.i45.outputs.resolved == 'true'
        timeout-minutes: 190
        run: |
          set +e
          D="$HOME/cms-scratch"; cd "$D"
          timeout 10800 "$HOME/cms-venv/bin/python" run_cms.py 56 "$GITHUB_WORKSPACE/scratch/munim-a45-cms/cryptominisat5" 1 . > "$GITHUB_WORKSPACE/inst-56.log" 2>&1
          rc=$?
          cat "$GITHUB_WORKSPACE/inst-56.log"
          if [ $rc -eq 124 ]; then
            echo "(5,6) NOTE: hit the 3h wall clock (timeout 124); instance unresolved" | tee "$GITHUB_WORKSPACE/result-5-6.txt"
            exit 0
          fi
          [ $rc -eq 0 ] || { echo "FAIL: driver exited $rc"; exit 1; }
          grep -q 'SOLVER-FAIL' "$GITHUB_WORKSPACE/inst-56.log" && { echo "FAIL: solver error on (5,6)"; exit 1; }
          cp result-5-6.txt "$GITHUB_WORKSPACE/"
          cp proof-5-6.frat "$GITHUB_WORKSPACE/" 2>/dev/null || true
          cp inst-5-6.cnf "$GITHUB_WORKSPACE/" 2>/dev/null || true
          cp cms-5-6.log "$GITHUB_WORKSPACE/" 2>/dev/null || true
          echo "(5,6) step done"

      - name: Write result summary and pins
        if: always()
        run: |
          set +e
          {
            echo "=== munim-a45-cms-retry results ==="
            for f in result-4-4.txt result-4-5.txt result-5-6.txt; do
              if [ -f "$f" ]; then cat "$f"; else echo "$f: MISSING (step did not complete)"; fi
            done
            echo "=== pins ==="
            echo "workflow=munim-a45-cms-retry"
            echo "repo_commit=$GITHUB_SHA"
            echo "munim_repo=munimtechnologies/kakeya-small-fields"
            echo "munim_head=3671dfce4b5a42de65b531873fab9dc431f0fe26"
            echo "indep_sat_sha256=aafa27ab017ade4a04274c23dcbf0937aff094b6f60695aea32a6e4a050157a3"
            echo "run_cms_sha256=ed05da2371117862ec689a85095609a0ca5c04b4e76387b9f4ce80281d70359e"
            echo "cryptominisat5_sha256=abafefecdc14904541c268bc97077dc210a8d8112f13150c182313bd5a1f079d"
            echo "cryptominisat=5.11.21 (built from source on Ubuntu 24.04)"
            echo "solver_cmd=cryptominisat5 --threads=1 --verb=1 <cnf> <frat-proof>"
            echo "cnf_44_sha256=298d87a5fb9039ee1e777c4399bdde254e64d62eefe87284ec9434aa9ae205cc"
            echo "cnf_45_sha256=fa2ba0572d844c0d1cede157610125d06ef5043c7a9db5eec8bca33755839ef9"
            echo "cnf_56_sha256=0bcb6cf40f97c308dd7eed71cf60fa07d39a6f3c7b57d641d7deb473b5fe10d5"
            echo "symmetry_break=flag (s_i[r]=0 for r>i, proved sound, validated on (4,4) control)"
            echo "python_sat=$("$HOME/cms-venv/bin/pip" show python-sat 2>/dev/null | grep -E '^Version:' || echo unknown)"
            echo "runner=$RUNNER_NAME"
          } > "$GITHUB_WORKSPACE/RESULTS.txt" 2>&1 || true
          cat "$GITHUB_WORKSPACE/RESULTS.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munim-a45-cms-retry-evidence
          if-no-files-found: warn
          path: |
            control-44.log
            preflight-45.txt
            probe-45.log
            inst-45.log
            inst-56.log
            cms-4-5.log
            cms-5-6.log
            result-4-4.txt
            result-4-5.txt
            result-5-6.txt
            RESULTS.txt
            proof-4-5.frat
            proof-5-6.frat
            inst-4-5.cnf
            inst-5-6.cnf

      - name: Remove scratch dirs (shared-runner meta-rule)
        if: always()
        run: |
          rm -rf "$HOME/cms-scratch" "$HOME/cms-venv"
