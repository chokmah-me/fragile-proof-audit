name: turing-forge

# One-shot build + kernel axiom print for the Turing rigidity harvest
# audit (openai/math @ adc7f12, lean/ project). NOT standing CI:
# delete this file once the receipt is recorded.
#
# Why this exists: the audit (~/workspace/turing-recon/AUDIT.md on the
# control-plane VM) closed angles 1-3 PASS with the build leg a named
# GAP. The same build has run on the VM since 2026-10-20
# (turing-build/run-build.sh: lake build
# OAI.Computability.DegreeRigidity.Main) and never finished: the VM
# rebooted six times on 2026-10-22 alone, and the build sat at
# [8950/9144] with its heaviest modules taking ~1200 s each. At the
# user's word (2026-10-22, "offload it to the dell") the job moves to
# the overflow lane ([self-hosted, laptop], Dell, 32 GB), per the
# runner-first build dispatch rule (2026-10-21): heavy Lean builds of
# external target repos run on the user's runners, never on the VM.
#
# Procedure (the audit's closing recipe, exactly):
#   1. fresh clone of openai/math @
#      adc7f1241b42e322a6451854ab7e4b4c146bf78a (asserted), toolchain
#      leanprover/lean4:v4.34.1 (asserted from lean/lean-toolchain);
#   2. in lean/: lake exe cache get (optimization only, exit recorded
#      but NOT gated on: the recipe does not require the cache, and a
#      cache miss must not fail a sound build); lake build
#      OAI.Computability.DegreeRigidity.Main; then a scratch file
#      printing the axioms of the headline theorem, run under
#      lake env lean. No phase aborts the next.
#   3. fail-closed verdict: BUILD_EXIT and AXIOM_EXIT both 0 AND the
#      headline theorem OAI.TuringRigidity.ManuscriptMain.rigidity
#      present in the axiom output AND every axiom list within
#      {propext, Classical.choice, Quot.sound} AND no sorryAx
#      anywhere.
#
# Harness rules: pins are literals (no dispatch inputs); the scratch
# clone lives in $HOME outside the shared checkout and is removed in
# an always() step; no `lake update`; exit codes are captured with
# `rc=0` + `cmd || rc=$?` (the runner forces bash -e; a bare rc=$?
# after a failing command never runs, AGENTS.md (24)).
# The verdict parser joins wrapped lines before reading an axiom
# list: Lean wraps long lists across physical lines (2026-10-22
# thomgame-build lesson).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turing-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 600
    steps:
      - name: Install elan if missing
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf --retry 5 --retry-delay 10 --retry-all-errors | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Clone pinned target repo; run cache, build, axiom print
        timeout-minutes: 540
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          D="$HOME/turing-adc7f12"
          rm -rf "$D"
          git clone --filter=blob:none https://github.com/openai/math.git "$D"
          git -C "$D" checkout adc7f1241b42e322a6451854ab7e4b4c146bf78a
          HEAD=$(git -C "$D" rev-parse HEAD)
          echo "cloned HEAD: $HEAD"
          [ "$HEAD" = "adc7f1241b42e322a6451854ab7e4b4c146bf78a" ] || { echo "FAIL: HEAD != pin"; exit 1; }
          grep -qx 'leanprover/lean4:v4.34.1' "$D/lean/lean-toolchain" || { echo "FAIL: toolchain file mismatch"; exit 1; }
          cd "$D/lean"
          : > "$GITHUB_WORKSPACE/exits.txt"
          rc=0
          lake exe cache get > "$GITHUB_WORKSPACE/cache-get.log" 2>&1 || rc=$?
          echo "CACHE_EXIT:$rc" | tee -a "$GITHUB_WORKSPACE/exits.txt"
          rc=0
          lake build OAI.Computability.DegreeRigidity.Main > "$GITHUB_WORKSPACE/build.log" 2>&1 || rc=$?
          echo "BUILD_EXIT:$rc" | tee -a "$GITHUB_WORKSPACE/exits.txt"
          printf 'import OAI.Computability.DegreeRigidity.Main\n#print axioms OAI.TuringRigidity.ManuscriptMain.rigidity\n' > "$D/lean/TuringAxiomPrint.lean"
          rc=0
          lake env lean TuringAxiomPrint.lean > "$GITHUB_WORKSPACE/axiom_print.out" 2> "$GITHUB_WORKSPACE/axiom_print.err" || rc=$?
          echo "AXIOM_EXIT:$rc" | tee -a "$GITHUB_WORKSPACE/exits.txt"
          cat "$GITHUB_WORKSPACE/exits.txt"

      - name: Verdict (fail-closed)
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re, sys
          ws = __import__('os').environ['GITHUB_WORKSPACE']
          exits = {}
          for line in open(ws + '/exits.txt'):
              if ':' in line:
                  k, v = line.strip().split(':', 1)
                  exits[k] = int(v)
          ok = True
          for k in ('BUILD_EXIT', 'AXIOM_EXIT'):
              if exits.get(k) != 0:
                  print(f"FAIL: {k} = {exits.get(k)}")
                  ok = False
          out = open(ws + '/axiom_print.out').read()
          err = open(ws + '/axiom_print.err').read()
          if 'sorryAx' in out or 'sorryAx' in err:
              print("FAIL: sorryAx present in axiom output")
              ok = False
          if re.search(r': error:', err):
              print("FAIL: axiom_print.err contains an error line")
              ok = False
          allow = {'propext', 'Classical.choice', 'Quot.sound'}
          # Join wrapped axiom lists: a record starts at "'X' depends on
          # axioms:" and its list runs to the closing ']'.
          text = out.replace('\n', ' ')
          records = re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", text)
          nodep = re.findall(r"'([^']+)' does not depend on any axioms", text)
          seen = set()
          for name, lst in records:
              seen.add(name)
              axioms = {a.strip().strip(',') for a in lst.split(',') if a.strip()}
              extra = axioms - allow
              if extra:
                  print(f"FAIL: {name} depends on off-allowlist axioms: {sorted(extra)}")
                  ok = False
          for name in nodep:
              seen.add(name)
          headline = 'OAI.TuringRigidity.ManuscriptMain.rigidity'
          if headline not in seen:
              print(f"FAIL: headline theorem missing from axiom output: {headline}")
              ok = False
          print(f"declarations with axiom records: {len(seen)}")
          print("VERDICT: " + ("PASS" if ok else "FAIL"))
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Write pins file
        if: always()
        run: |
          set -uo pipefail
          {
            echo "target_repo=https://github.com/openai/math"
            echo "target_head=adc7f1241b42e322a6451854ab7e4b4c146bf78a"
            echo "toolchain=leanprover/lean4:v4.34.1"
            echo "mathlib_rev=d13f23b723b8a846827a245b89c10fc7d3f11612"
            echo "theorem=OAI.TuringRigidity.ManuscriptMain.rigidity"
            echo "lane=[self-hosted, laptop]"
            echo "procedure=lake exe cache get (non-gating); lake build OAI.Computability.DegreeRigidity.Main; lake env lean TuringAxiomPrint.lean (#print axioms, audit closing recipe)"
            cat "$GITHUB_WORKSPACE/exits.txt" 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/pins.txt"
          cat "$GITHUB_WORKSPACE/pins.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turing-forge-evidence
          path: |
            cache-get.log
            build.log
            axiom_print.out
            axiom_print.err
            exits.txt
            pins.txt
          if-no-files-found: warn

      - name: Remove scratch dirs (shared-runner meta-rule)
        if: always()
        run: |
          rm -rf "$HOME/turing-adc7f12"
