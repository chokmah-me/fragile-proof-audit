# One-shot: collect adopted ai-os skill bodies from the self-hosted
# runner's machine and upload them as an artifact. Manual dispatch only.
# Reads ONLY the listed skill directories/file — no credentials, no config.
name: fetch-gate-skills

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Collect skill bodies
        shell: bash
        run: |
          set -u
          base="/mnt/c/Users/Elke Shayna/Documents/00Dev"
          out="${RUNNER_TEMP}/skill-bodies"
          rm -rf "$out"
          mkdir -p "$out"
          for d in computational-claim-gate manuscript-integrity-gate lean-proof-forge paper-robustness-check ai-failure-mode-hygiene chokmah-research-engine; do
            if [ -d "$base/$d" ]; then
              cp -r "$base/$d" "$out/$d" && echo "collected: $d"
            else
              echo "MISSING: $base/$d"
            fi
          done
          # release-sync lives as a full skill inside the Grok discovery root
          rs="$base/ai-os/.grok/skills/release-sync"
          if [ -d "$rs" ]; then
            cp -r "$rs" "$out/release-sync" && echo "collected: release-sync"
          else
            echo "MISSING: $rs"
          fi
          # zenodo paper runbook (single file, ai-os project root)
          rb="$base/ai-os/zenodo-paper-runbook.md"
          if [ -f "$rb" ]; then
            cp "$rb" "$out/zenodo-paper-runbook.md" && echo "collected: zenodo-paper-runbook.md"
          else
            echo "MISSING: $rb"
          fi
          tar -czf "${RUNNER_TEMP}/gate-skill-bodies.tar.gz" -C "$out" .
          ls -la "${RUNNER_TEMP}/gate-skill-bodies.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-skill-bodies
          path: ${{ runner.temp }}/gate-skill-bodies.tar.gz
          if-no-files-found: error
