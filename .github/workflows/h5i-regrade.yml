name: h5i-regrade

# One-shot re-grade of the 13 stale rustfs certificates in
# h5i-dev/h5i-app-bench @ bebcf72c15d52bde888c49d6ea45b897033175d6.
# NOT standing CI: delete this file once the receipt is recorded.
#
# Why this exists: the h5i-app-bench audit (docs/audits/h5i-app-bench.md,
# verdict PARTIAL, main@63086e7) found 86/99 accepted certificates fully
# current at the pin and 13 stale, all rustfs: five kernel inputs
# (conddata.rs, defaults.rs, extras.rs, varctx.rs, generated
# RustfsKernel.lean) changed in ada9f32 ("Change scope (#17)",
# 2026-10-10 21:26 UTC) after the certificates were minted
# (2026-10-10 19:21 UTC), with no recheck since. The open question is
# narrow: does each certificated Solution.lean still grade-pass against
# the current (pinned) inputs, under the project's own grader?
#
# Procedure (the project's own standard, prove/harness/bench.py +
# coverage.py): for each of the 13 task ids, verify the committed
# Solution.lean's sha256 equals its certificate.json sha256 (the exact
# artifact the certificate attests), build the task workspace from the
# pinned sources (bench.build), then grade that exact file with
# bench.grade: forbidden-construct scan, import allowlist, statement
# defeq against an isolated target axiom (STATEMENT_OK), lake build,
# and #print axioms within STD_AXIOMS = {propext, Classical.choice,
# Quot.sound}.
#
# bench.grade isolates each grade in docker in the author's setup.
# This runner has no docker, so the driver replaces bench.docker with
# a local subprocess using the identical commands, and rewrites the
# two absolute paths the harness embeds for its mounts
# (/opt/h5i-app-lib -> the snapshotted library directory,
# /opt/lake/packages -> the nora project's .lake/packages) in the
# generated lakefile/manifest/symlink only. The graded Lean content,
# the statement check, the forbidden scan, and the axiom parser are
# the pinned harness's own code, unmodified. Dependency pins are the
# author's defaults: PACKAGES and the library snapshot both come from
# the nora port (the lake manifests of all six ports are identical;
# h5i_app_lib rev d337c3cfffa41aadf155cdf0ca92e24ebe9470cc).
#
# Controls (machinery validity; any failure makes the run INVALID,
# not a finding about the 13):
#   POS: nora-digest, a certificate verified current at the pin,
#        must grade-pass.
#   NEG-SORRY: the bench.solution_template for rustfs-wildcard
#        (a sorry proof) must grade-fail.
#   NEG-FORBIDDEN: the rustfs-wildcard Solution plus an appended
#        `axiom cheat : False` line must grade-fail at the
#        forbidden scan.
#
# Verdict: the verdict step prints RE-PASS: n/13 and MACHINERY:
# VALID/INVALID, and exits nonzero only when the machinery is
# invalid. A legitimate grade failure of one of the 13 is a finding,
# recorded per task in regrade-results.json, not a run failure.
#
# Harness rules: pins are literals (no dispatch inputs); the scratch
# clone lives in $HOME outside the shared checkout and is removed in
# an always() step; no `lake update`; exit codes are captured with
# `rc=0` + `cmd || rc=$?` (the runner forces bash -e; AGENTS.md (24)).
# One heavy job on the laptop lane (Dell, 32 GB), per the
# runner-first build dispatch rule (2026-10-21). Dispatched at the
# user's word, 2026-10-23: "Run the 13 re-grades on the Dell".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h5i-regrade
  cancel-in-progress: false

jobs:
  regrade:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 900
    steps:
      - name: Install elan if missing
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf --retry 5 --retry-delay 10 --retry-all-errors | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Clone pinned bench repo; assert pins
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          D="$HOME/h5i-regrade-bebcf72"
          rm -rf "$D"
          git clone https://github.com/h5i-dev/h5i-app-bench.git "$D"
          git -C "$D" checkout bebcf72c15d52bde888c49d6ea45b897033175d6
          HEAD=$(git -C "$D" rev-parse HEAD)
          echo "cloned HEAD: $HEAD"
          [ "$HEAD" = "bebcf72c15d52bde888c49d6ea45b897033175d6" ] || { echo "FAIL: HEAD != pin"; exit 1; }
          for p in nora artifactkeeper kanidm rustfs tuwunel oxicloud; do
            grep -qx 'leanprover/lean4:v4.31.0' "$D/prove/ports/$p/proofs/lean-toolchain" || { echo "FAIL: toolchain mismatch in $p"; exit 1; }
          done
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.31.0
          ls "$HOME/.elan/toolchains/leanprover--lean4---v4.31.0/bin"

      - name: Prepare grader environment (nora build + library snapshot)
        timeout-minutes: 300
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          D="$HOME/h5i-regrade-bebcf72"
          : > "$GITHUB_WORKSPACE/exits.txt"
          cd "$D/prove/ports/nora/proofs"
          rc=0
          lake exe cache get > "$GITHUB_WORKSPACE/nora-cache.log" 2>&1 || rc=$?
          echo "NORA_CACHE_EXIT:$rc" >> "$GITHUB_WORKSPACE/exits.txt"
          rc=0
          lake build > "$GITHUB_WORKSPACE/nora-build.log" 2>&1 || rc=$?
          echo "NORA_BUILD_EXIT:$rc" >> "$GITHUB_WORKSPACE/exits.txt"
          cd "$D/prove"
          rc=0
          bash scripts/snapshot-h5i-app-lib.sh > "$GITHUB_WORKSPACE/snapshot.log" 2>&1 || rc=$?
          echo "SNAPSHOT_EXIT:$rc" >> "$GITHUB_WORKSPACE/exits.txt"
          if [ ! -f "$D/prove/env/h5i-app-lib/H5iAppLib.lean" ]; then
            echo "snapshot script did not produce the library; manual copy fallback" >> "$GITHUB_WORKSPACE/snapshot.log"
            SRC="$D/prove/ports/nora/proofs/.lake/packages/h5i_app_lib/crates/h5i-app-core/proofs"
            rm -rf "$D/prove/env/h5i-app-lib"
            mkdir -p "$D/prove/env/h5i-app-lib"
            cp -r "$SRC/." "$D/prove/env/h5i-app-lib/" || true
            rm -rf "$D/prove/env/h5i-app-lib/.lake/packages" "$D/prove/env/h5i-app-lib/.lake/ci" || true
            git -C "$SRC" rev-parse HEAD > "$D/prove/env/h5i-app-lib/VERSION" 2>/dev/null || true
            echo "SNAPSHOT_FALLBACK:manual-copy" >> "$GITHUB_WORKSPACE/exits.txt"
          fi
          mkdir -p "$D/prove/env/h5i-app-lib/.lake" || true
          ln -sfn "$D/prove/ports/nora/proofs/.lake/packages" "$D/prove/env/h5i-app-lib/.lake/packages" || true
          echo "applib VERSION: $(cat "$D/prove/env/h5i-app-lib/VERSION" 2>/dev/null || echo MISSING)"
          cat "$GITHUB_WORKSPACE/exits.txt"

      - name: Re-grade the 13 stale certificates (project's own grader, local isolation)
        timeout-minutes: 840
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > "$GITHUB_WORKSPACE/regrade.py" << 'PYEOF'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          WS = Path(os.environ["GITHUB_WORKSPACE"])
          D = Path.home() / "h5i-regrade-bebcf72"
          PROVE = D / "prove"
          sys.path.insert(0, str(PROVE / "harness"))
          import bench
          PACKAGES = PROVE / "ports/nora/proofs/.lake/packages"
          APPLIB = PROVE / "env/h5i-app-lib"
          LEANBIN = Path.home() / ".elan/toolchains/leanprover--lean4---v4.31.0/bin"
          STALE = ["rustfs-allow-needs-statement", "rustfs-bucket-principal",
                   "rustfs-clean-canonical", "rustfs-clean-idempotent",
                   "rustfs-deny-only", "rustfs-explicit-deny",
                   "rustfs-force-delete", "rustfs-get-object-version",
                   "rustfs-not-action-force-delete", "rustfs-owner",
                   "rustfs-parse-i64", "rustfs-resolution-terminates",
                   "rustfs-wildcard"]
          POS = "nora-digest"
          results = {"tasks": {}, "controls": {}}
          assert (APPLIB / "H5iAppLib.lean").exists(), "applib snapshot missing"
          assert (PACKAGES / "aeneas").exists(), "nora packages missing"
          assert (LEANBIN / "lake").exists(), "lean toolchain v4.31.0 missing"
          _orig_lakefile = bench.lakefile
          def lakefile(t, roots):
              return _orig_lakefile(t, roots).replace("/opt/h5i-app-lib", str(APPLIB))
          bench.lakefile = lakefile
          _orig_manifest = bench.manifest
          def manifest(t):
              return _orig_manifest(t).replace("/opt/h5i-app-lib", str(APPLIB))
          bench.manifest = manifest
          _orig_symlink = os.symlink
          def symlink(src, dst, *a, **k):
              if str(src) == "/opt/lake/packages":
                  src = str(PACKAGES)
              return _orig_symlink(src, dst, *a, **k)
          os.symlink = symlink
          def local_docker(workdir, cmd, network=False, extra=()):
              env = dict(os.environ)
              env["PATH"] = str(LEANBIN) + ":" + env.get("PATH", "")
              return subprocess.run(["bash", "-lc", cmd], cwd=str(workdir),
                                    capture_output=True, text=True, env=env)
          bench.docker = local_docker
          def cert_ok(tid):
              c = json.loads((PROVE / "results/verification" / tid / "certificate.json").read_text())
              sol = PROVE / "results/verification" / tid / "Solution.lean"
              return c.get("sha256") == hashlib.sha256(sol.read_bytes()).hexdigest()
          def grade_accepted(tid):
              entry = {"cert_sha_ok": cert_ok(tid)}
              sol = PROVE / "results/verification" / tid / "Solution.lean"
              try:
                  bench.build(tid)
                  entry["build"] = "ok"
              except BaseException as e:
                  entry["build"] = "failed: " + repr(e)
                  return entry
              try:
                  entry["grade"] = bench.grade(tid, sol)
              except BaseException as e:
                  entry["grade"] = {"passed": False, "reason": "grader exception: " + repr(e)}
              shutil.rmtree(PROVE / "tasks" / tid, ignore_errors=True)
              return entry
          for tid in STALE + [POS]:
              print("RG: grading " + tid, flush=True)
              results["tasks"][tid] = grade_accepted(tid)
              print("RG: " + tid + " -> " + json.dumps(results["tasks"][tid].get("grade")), flush=True)
              (WS / "regrade-results.json").write_text(json.dumps(results, indent=2) + "\n")
          t_wild = bench.tasks()["rustfs-wildcard"]
          cheat = PROVE / "results/verification/rustfs-wildcard/Solution.lean"
          cheat_path = WS / "neg-forbidden-Solution.lean"
          cheat_path.write_text(cheat.read_text() + "\naxiom cheat : False\n")
          try:
              results["controls"]["neg_forbidden"] = bench.grade("rustfs-wildcard", cheat_path)
          except BaseException as e:
              results["controls"]["neg_forbidden"] = {"passed": True, "reason": "grader exception: " + repr(e)}
          print("RG: neg_forbidden -> " + json.dumps(results["controls"]["neg_forbidden"]), flush=True)
          tmpl_path = WS / "neg-sorry-Solution.lean"
          tmpl_path.write_text(bench.solution_template(t_wild))
          try:
              bench.build("rustfs-wildcard")
              results["controls"]["neg_sorry"] = bench.grade("rustfs-wildcard", tmpl_path)
          except BaseException as e:
              results["controls"]["neg_sorry"] = {"passed": True, "reason": "exception: " + repr(e)}
          shutil.rmtree(PROVE / "tasks/rustfs-wildcard", ignore_errors=True)
          print("RG: neg_sorry -> " + json.dumps(results["controls"]["neg_sorry"]), flush=True)
          (WS / "regrade-results.json").write_text(json.dumps(results, indent=2) + "\n")
          print("RG: done", flush=True)
          PYEOF
          rc=0
          python3 "$GITHUB_WORKSPACE/regrade.py" > "$GITHUB_WORKSPACE/regrade.log" 2>&1 || rc=$?
          echo "DRIVER_EXIT:$rc" >> "$GITHUB_WORKSPACE/exits.txt"
          tail -n 40 "$GITHUB_WORKSPACE/regrade.log" || true
          cat "$GITHUB_WORKSPACE/exits.txt"

      - name: Verdict (machinery controls + re-pass count)
        run: |
          set -uo pipefail
          python3 - << 'PYEOF'
          import json, os, sys
          ws = os.environ["GITHUB_WORKSPACE"]
          stale = ["rustfs-allow-needs-statement", "rustfs-bucket-principal",
                   "rustfs-clean-canonical", "rustfs-clean-idempotent",
                   "rustfs-deny-only", "rustfs-explicit-deny",
                   "rustfs-force-delete", "rustfs-get-object-version",
                   "rustfs-not-action-force-delete", "rustfs-owner",
                   "rustfs-parse-i64", "rustfs-resolution-terminates",
                   "rustfs-wildcard"]
          ok = True
          try:
              r = json.load(open(ws + "/regrade-results.json"))
          except Exception as e:
              print("INVALID: regrade-results.json unreadable: " + repr(e))
              sys.exit(1)
          tasks = r.get("tasks", {})
          controls = r.get("controls", {})
          exits = {}
          try:
              for line in open(ws + "/exits.txt"):
                  if ":" in line:
                      k, v = line.strip().split(":", 1)
                      exits[k] = v
          except Exception:
              pass
          if exits.get("DRIVER_EXIT") != "0":
              print("INVALID: driver exit = " + str(exits.get("DRIVER_EXIT")))
              ok = False
          pos = tasks.get("nora-digest", {}).get("grade") or {}
          if pos.get("passed") is not True:
              print("INVALID: POS control nora-digest did not pass: " + json.dumps(pos)[:400])
              ok = False
          else:
              print("POS control nora-digest: PASS (axioms " + json.dumps(pos.get("axioms")) + ")")
          ns = controls.get("neg_sorry") or {}
          if ns.get("passed") is not False:
              print("INVALID: NEG-SORRY control did not fail: " + json.dumps(ns)[:400])
              ok = False
          else:
              print("NEG-SORRY control: failed as expected (" + str(ns.get("reason")) + ")")
          nf = controls.get("neg_forbidden") or {}
          if nf.get("passed") is not False:
              print("INVALID: NEG-FORBIDDEN control did not fail: " + json.dumps(nf)[:400])
              ok = False
          else:
              print("NEG-FORBIDDEN control: failed as expected (" + str(nf.get("reason")) + ")")
          npass = 0
          for tid in stale:
              e = tasks.get(tid) or {}
              g = e.get("grade") or {}
              if e.get("cert_sha_ok") is not True:
                  print("INVALID: " + tid + " certificate sha256 mismatch")
                  ok = False
              if e.get("build") != "ok":
                  print("INVALID: " + tid + " workspace build: " + str(e.get("build")))
                  ok = False
              if g.get("passed") is True:
                  npass += 1
                  print(tid + ": RE-PASS axioms=" + json.dumps(g.get("axioms")) + " check_s=" + str(g.get("check_s")))
              else:
                  print(tid + ": FAIL reason=" + str(g.get("reason")) + " axioms=" + json.dumps(g.get("axioms")))
          print("RE-PASS: " + str(npass) + "/13")
          print("MACHINERY: " + ("VALID" if ok else "INVALID"))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write("h5i re-grade of 13 stale rustfs certificates: RE-PASS " + str(npass) + "/13; MACHINERY " + ("VALID" if ok else "INVALID") + "\n")
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Write pins file
        if: always()
        run: |
          set -uo pipefail
          {
            echo "target_repo=https://github.com/h5i-dev/h5i-app-bench"
            echo "target_head=bebcf72c15d52bde888c49d6ea45b897033175d6"
            echo "toolchain=leanprover/lean4:v4.31.0 (all six ports)"
            echo "grader=prove/harness/bench.py bench.build + bench.grade at the pin, docker replaced by local subprocess (identical commands); /opt/h5i-app-lib and /opt/lake/packages rewritten to the snapshotted library and the nora .lake/packages in generated lakefile/manifest/symlink only"
            echo "lib_pin=h5i-dev/h5i d337c3cfffa41aadf155cdf0ca92e24ebe9470cc (lake-manifest, all ports identical)"
            echo "aeneas_pin=b86120db3183b0107eb5f2637b11c424cd06ef1c"
            echo "standard=STD_AXIOMS={propext, Classical.choice, Quot.sound}; STATEMENT_OK defeq check per grade"
            echo "controls=POS nora-digest must pass; NEG sorry template must fail; NEG appended axiom must fail"
            echo "lane=[self-hosted, laptop]"
            echo "stale_13=rustfs-allow-needs-statement rustfs-bucket-principal rustfs-clean-canonical rustfs-clean-idempotent rustfs-deny-only rustfs-explicit-deny rustfs-force-delete rustfs-get-object-version rustfs-not-action-force-delete rustfs-owner rustfs-parse-i64 rustfs-resolution-terminates rustfs-wildcard"
            cat "$GITHUB_WORKSPACE/exits.txt" 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/pins.txt"
          cat "$GITHUB_WORKSPACE/pins.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5i-regrade-evidence
          path: |
            regrade-results.json
            regrade.log
            regrade.py
            nora-cache.log
            nora-build.log
            snapshot.log
            exits.txt
            pins.txt
          if-no-files-found: warn

      - name: Remove scratch dirs (shared-runner meta-rule)
        if: always()
        run: |
          rm -rf "$HOME/h5i-regrade-bebcf72"
