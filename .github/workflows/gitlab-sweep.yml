name: gitlab-sweep

# One-shot sweep for CVE-2026-110264 (GitLab CE/EE, CVSS 10.0).
# Report-only: checks each runner box (WSL guest + Windows host via
# /mnt/c and powershell.exe interop) for any GitLab installation,
# service, container, or package. Always exits 0; findings are in the
# job log and step summary. Delete this file after the sweep lands.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep-desktop:
    runs-on: [self-hosted, desktop]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Sweep for GitLab (desktop)
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/gitlab-sweep.sh" || true

  sweep-laptop:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Sweep for GitLab (laptop)
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/gitlab-sweep.sh" || true
