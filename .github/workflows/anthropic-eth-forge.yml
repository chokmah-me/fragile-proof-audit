name: anthropic-eth-forge

# One-shot forge for the Anthropic / Claude ETH formalization audit
# (github.com/anthropics/formal-math, eth/ project at the pin).
# Full clone at the pin, source scans, Mathlib cache, build of all
# default targets (MainResults, Challenge, Solution, proof libs),
# a statement corpus in three environments (MainResults env vs
# Challenge env vs Solution env, #print of every definition in
# MainResults.lean + #check of both theorems), an axiom audit via
# the repo's own scripts/PrintAxioms.lean, and a fail-closed
# verdict. The target dir persists across dispatches, so a timeout
# re-dispatch resumes from built oleans. Deleted after the receipt
# lands (forge protocol).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: [self-hosted, desktop]
    timeout-minutes: 350
    env:
      AETH_DIR: ${{ github.workspace }}/anthropic-eth-forge-evidence
      AETH_REPO: https://github.com/anthropics/formal-math.git
      AETH_PIN: 16a5ce41304fcdaea4e0be7c132e1c361dc26da5
      AETH_TARGET: ${{ github.workspace }}/../../anthropic-eth-target
      GLIBC_TUNABLES: glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1
    steps:
      - name: Runner probe
        shell: bash
        run: |
          set +e
          mkdir -p "$AETH_DIR" "$AETH_TARGET"
          {
            echo "host=$(hostname) os=$OSTYPE"
            echo "now_utc=$(date -u +%FT%TZ) now_epoch=$(date +%s)"
            echo "ntp_synchronized=$(timedatectl show -p NTPSynchronized --value 2>/dev/null || echo unknown)"
            nproc; free -g | head -2; df -h "$AETH_TARGET" | tail -1 || true
            for t in go cargo jq git python3; do
              if command -v "$t" >/dev/null 2>&1; then echo "tool_$t=yes"; else echo "tool_$t=no"; fi
            done
          } | tee "$AETH_DIR/00-probe.txt"
          exit 0

      - name: Clone at pin (retry x3)
        shell: bash
        run: |
          set +e
          mkdir -p "$AETH_TARGET"
          ok=0
          for attempt in 1 2 3; do
            echo "clone attempt $attempt"
            if [ ! -d "$AETH_TARGET/formal-math/.git" ]; then
              rm -rf "$AETH_TARGET/formal-math"
              git clone --filter=blob:none --no-checkout "$AETH_REPO" "$AETH_TARGET/formal-math"
            fi
            cd "$AETH_TARGET/formal-math" || exit 1
            git fetch --depth 1 origin "$AETH_PIN"
            git checkout -f FETCH_HEAD
            head_sha="$(git rev-parse HEAD)"
            tip="$(git ls-remote "$AETH_REPO" HEAD | awk '{print $1}')"
            echo "clone_head=$head_sha origin_head=$tip"
            echo "$head_sha" > "$AETH_DIR/01-head-sha.txt"
            echo "$tip" > "$AETH_DIR/01-origin-head.txt"
            test -f eth/MainResults.lean \
              && test -f eth/Challenge.lean \
              && test -f eth/Solution.lean \
              && test -f eth/lakefile.toml \
              && test -f eth/lean-toolchain \
              && test -f eth/comparator.json \
              && test -f eth/scripts/PrintAxioms.lean && ok=1
            [ "$ok" = 1 ] && break
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "CLONE_FAILED"; exit 1; }

      - name: Toolchain and manifest pins
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$AETH_TARGET/formal-math/eth" || exit 1
          tc="$(cat lean-toolchain)"
          echo "lean-toolchain: $tc" | tee "$AETH_DIR/02-toolchain.txt"
          elan toolchain list | tee -a "$AETH_DIR/02-toolchain.txt"
          if ! elan toolchain list | grep -q "v4.33.1"; then
            elan toolchain install leanprover/lean4:v4.33.1 2>&1 | tail -2
          fi
          elan toolchain list | tee -a "$AETH_DIR/02-toolchain.txt"
          lean_v="$(lean --version 2>&1)"
          echo "lean --version (repo dir): $lean_v" | tee -a "$AETH_DIR/02-toolchain.txt"
          sha256sum MainResults.lean Challenge.lean Solution.lean comparator.json paper.pdf \
            | tee "$AETH_DIR/02-file-hashes.txt"
          python3 - "$AETH_DIR" <<'PYEOF'
          import json, sys
          outdir = sys.argv[1]
          m = json.load(open('lake-manifest.json'))
          revs = {p['name']: p.get('rev','') for p in m['packages']}
          with open(outdir + '/02-manifest.txt', 'w') as f:
              f.write("packages=%d\n" % len(m['packages']))
              for k in sorted(revs):
                  f.write("%s %s\n" % (k, revs[k]))
          print("mathlib rev:", revs.get('mathlib'))
          PYEOF

      - name: Source scans (project + challenge, comment-stripped)
        shell: bash
        run: |
          set +e
          cd "$AETH_TARGET/formal-math/eth" || exit 1
          python3 - "$AETH_DIR" <<'PYEOF'
          import os, re, sys
          outdir = sys.argv[1]
          SORRY = re.compile(r'\b(sorry|admit)\b')
          ESCAPES = re.compile(r'\bnative_decide\b|@\[extern|implemented_by|ofReduceBool|\bpartial\s+def\b|\bunsafe\b')
          def strip_comments(src):
              out=[]; i=0; n=len(src); depth=0; instr=False
              while i<n:
                  c=src[i]; nx=src[i+1] if i+1<n else ''
                  if depth>0:
                      if c=='/' and nx=='-': depth+=1; i+=2; continue
                      if c=='-' and nx=='/': depth-=1; i+=2; continue
                      if c=='\n': out.append('\n')
                      i+=1; continue
                  if instr:
                      out.append(c)
                      if c=='\\' and i+1<n: out.append(src[i+1]); i+=2; continue
                      if c=='"': instr=False
                      i+=1; continue
                  if c=='/' and nx=='-': depth=1; i+=2; continue
                  if c=='-' and nx=='-':
                      while i<n and src[i]!='\n': i+=1
                      continue
                  if c=='"': instr=True
                  out.append(c); i+=1
              return ''.join(out)
          def scan(paths):
              files=0; sh=0; eh=0; hits=[]
              for p in paths:
                  files+=1
                  src=open(p, errors='replace').read()
                  code=strip_comments(src)
                  for ln, line in enumerate(code.split('\n'),1):
                      if SORRY.search(line): sh+=1; hits.append("%s:%d sorry %s" % (p,ln,line.strip()[:100]))
                      if ESCAPES.search(line): eh+=1; hits.append("%s:%d escape %s" % (p,ln,line.strip()[:100]))
              return files, sh, eh, hits
          all_paths=[]
          for root, dirs, fs in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.lake']
              for fn in fs:
                  if fn.endswith('.lean') and not fn.startswith('AethAuditEnv'):
                      all_paths.append(os.path.join(root, fn))
          all_paths = sorted(all_paths)
          ch_paths = [p for p in all_paths if os.path.basename(p) == 'Challenge.lean' and os.path.dirname(p) == '.']
          mod_paths = [p for p in all_paths if p not in ch_paths]
          mf, ms, me, mh = scan(mod_paths)
          cf, cs, ce, ch = scan(ch_paths)
          tf, ts, te = mf + cf, ms + cs, me + ce
          with open(outdir + '/03-scans.txt', 'w') as f:
              f.write("total_files=%d\ntotal_sorry_hits=%d\ntotal_escape_hits=%d\n" % (tf, ts, te))
              f.write("module_files=%d\nmodule_sorry_hits=%d\nmodule_escape_hits=%d\n" % (mf, ms, me))
              f.write("challenge_files=%d\nchallenge_sorry_hits=%d\nchallenge_escape_hits=%d\n" % (cf, cs, ce))
              for h in mh[:20]: f.write("MODHIT %s\n" % h)
              for h in ch[:20]: f.write("CHHIT %s\n" % h)
          print("total: files=%d sorry=%d escapes=%d" % (tf, ts, te))
          print("module: files=%d sorry=%d escapes=%d" % (mf, ms, me))
          print("challenge: files=%d sorry=%d escapes=%d" % (cf, cs, ce))
          PYEOF

      - name: Early evidence upload
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-eth-forge-evidence-early
          path: ${{ env.AETH_DIR }}
          retention-days: 30
          if-no-files-found: warn

      - name: Mathlib cache (fail closed)
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$AETH_TARGET/formal-math/eth" || exit 1
          cache_exit=""
          for attempt in 1 2; do
            lake exe cache get > "$AETH_DIR/04-cache-get.log" 2>&1
            cache_exit=$?
            echo "cache get attempt $attempt exit=$cache_exit"
            [ "$cache_exit" = 0 ] && break
            sleep 15
          done
          echo "$cache_exit" > "$AETH_DIR/04-cache-exit.txt"
          oleans="$(find "$AETH_TARGET/formal-math/eth/.lake" -name '*.olean' 2>/dev/null | wc -l)"
          echo "oleans_total=$oleans" | tee "$AETH_DIR/04-oleans.txt"
          [ "$cache_exit" = 0 ] || { echo "CACHE_FAILED"; exit 1; }

      - name: Clock check 2
        shell: bash
        run: |
          { echo "epoch=$(date +%s) utc=$(date -u +%FT%TZ)"; } > "$AETH_DIR/05-clock2.txt"
          cat "$AETH_DIR/05-clock2.txt"

      - name: Build all default targets
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$AETH_TARGET/formal-math/eth" || exit 1
          start=$(date +%s)
          lake build > "$AETH_DIR/06-build.log" 2>&1
          build_exit=$?
          end=$(date +%s)
          echo "$build_exit" > "$AETH_DIR/06-build-exit.txt"
          echo "build_seconds=$((end-start))" | tee "$AETH_DIR/06-build-seconds.txt"
          echo "build_exit=$build_exit"
          grep -c "declaration uses" "$AETH_DIR/06-build.log" | tee "$AETH_DIR/06-build-sorry-warnings.txt" || true

      - name: Statement corpora (3 envs) + axiom audit
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$AETH_TARGET/formal-math/eth" || exit 1
          python3 - "$AETH_TARGET/formal-math/eth" <<'PYEOF'
          import sys
          root = sys.argv[1]
          names = [
            "Lit", "CNF", "IsKCNF", "slot", "Satisfiable", "encClauses",
            "DecidesKSat", "InTime", "s", "ETH", "ETHIsFalse", "AllOccur",
            "numSat", "binary", "encInput", "lg", "expM", "expN",
            "timeMin", "CountsWithin", "MainTheorem",
          ]
          prints = "".join("#print MainResults.%s\n" % n for n in names)
          checks = "#check @MainResults.ethIsFalse\n#check @MainResults.mainTheorem\n"
          a = "import Challenge\n" + prints + checks
          b = "import Solution\n" + prints + checks
          c = "import MainResults\n" + prints
          open(root + '/AethAuditEnvA.lean', 'w').write(a)
          open(root + '/AethAuditEnvB.lean', 'w').write(b)
          open(root + '/AethAuditEnvC.lean', 'w').write(c)
          print("env files written:", len(names), "corpus entries + 2 theorem checks")
          PYEOF
          lake env lean AethAuditEnvA.lean > "$AETH_DIR/07-corpus-a.log" 2>&1
          echo "envA_exit=$?" | tee "$AETH_DIR/07-corpus-a-exit.txt"
          lake env lean AethAuditEnvB.lean > "$AETH_DIR/07-corpus-b.log" 2>&1
          echo "envB_exit=$?" | tee "$AETH_DIR/07-corpus-b-exit.txt"
          lake env lean AethAuditEnvC.lean > "$AETH_DIR/07-corpus-c.log" 2>&1
          echo "envC_exit=$?" | tee "$AETH_DIR/07-corpus-c-exit.txt"
          lake env lean scripts/PrintAxioms.lean > "$AETH_DIR/07-axioms.log" 2>&1
          echo "axioms_exit=$?" | tee "$AETH_DIR/07-axioms-exit.txt"
          cat "$AETH_DIR/07-axioms.log"

      - name: Verdict (fail-closed)
        shell: bash
        run: |
          set +e
          python3 - "$AETH_DIR" <<'PYEOF'
          import re, sys
          d = sys.argv[1] + '/'
          def read(n, default=''):
              try: return open(d+n).read()
              except FileNotFoundError: return default
          def num(txt, key):
              m = re.search(key + r'=(\d+)', txt)
              return int(m.group(1)) if m else -1
          probe = read('00-probe.txt'); scans = read('03-scans.txt')
          reasons = []
          head = read('01-head-sha.txt').strip()
          if head != '16a5ce41304fcdaea4e0be7c132e1c361dc26da5': reasons.append('HEAD != pin')
          if 'version 4.33.1,' not in read('02-toolchain.txt'): reasons.append('lean version != 4.33.1')
          if 'mathlib 0df444a360eaa60ab8c11dca51a86af692955474' not in read('02-manifest.txt'):
              reasons.append('mathlib rev mismatch')
          hashes = read('02-file-hashes.txt')
          for want in ('47f78a9550d95b37d8718dd1ee16ae824da893a5e17c319f737e6d0a5ed24944',
                       '63f54edafad0b4d1a4184c6279dc2fea4d8b3a6ef39fa04ab7fa72e86bfbb39e',
                       '27d304798a6ec294db7fdeee301227b70d72044cb31c85615901a8d728b0b98f',
                       '757e5537ccf47d1946521b0b5fb91a230cdcfd8933dc9ab047710709c15ffa7e',
                       '7af518b09342c967ea371c74b8989806684c5d02aabe5763ca08554aff5025a0'):
              if want not in hashes: reasons.append('file hash missing: ' + want[:12])
          tf = num(scans, 'total_files'); ts = num(scans, 'total_sorry_hits'); te = num(scans, 'total_escape_hits')
          ms = num(scans, 'module_sorry_hits'); me = num(scans, 'module_escape_hits')
          cs = num(scans, 'challenge_sorry_hits'); ce = num(scans, 'challenge_escape_hits')
          if tf != 1052: reasons.append('total files = %d (expected 1052)' % tf)
          if ts != 2: reasons.append('total sorry hits = %d (expected exactly 2, both in Challenge)' % ts)
          if te != 0: reasons.append('total escape hits = %d' % te)
          if ms != 0: reasons.append('module sorry hits = %d' % ms)
          if me != 0: reasons.append('module escape hits = %d' % me)
          if cs != 2: reasons.append('challenge sorry hits = %d (expected exactly 2, the two statements)' % cs)
          if ce != 0: reasons.append('challenge escape hits = %d' % ce)
          if read('04-cache-exit.txt').strip() != '0': reasons.append('cache get failed')
          if num(read('04-oleans.txt'), 'oleans_total') < 1000: reasons.append('mathlib oleans < 1000')
          if read('06-build-exit.txt').strip() != '0': reasons.append('build failed')
          for env, tag in (('a', 'A (challenge)'), ('b', 'B (solution)'), ('c', 'C (statements)')):
              if ('env%s_exit=0' % env.upper()) not in read('07-corpus-%s-exit.txt' % env):
                  reasons.append('corpus env %s failed' % tag)
          if 'axioms_exit=0' not in read('07-axioms-exit.txt'): reasons.append('axiom env failed')
          def norm(n):
              return re.sub(r'\s+', '', read(n))
          a, b, c = norm('07-corpus-a.log'), norm('07-corpus-b.log'), norm('07-corpus-c.log')
          chk1 = 'MainResults.ethIsFalse:MainResults.ETHIsFalse'
          chk2 = 'MainResults.mainTheorem:MainResults.MainTheorem'
          for chk, tag in ((chk1, 'ethIsFalse'), (chk2, 'mainTheorem')):
              if chk not in a: reasons.append('corpus A missing theorem check ' + tag)
              if chk not in b: reasons.append('corpus B missing theorem check ' + tag)
          a_defs = a.replace(chk1, '').replace(chk2, '')
          b_defs = b.replace(chk1, '').replace(chk2, '')
          corpus_equal = (a == b) and (a_defs == b_defs == c) and len(c) > 2000
          if not corpus_equal:
              reasons.append('statement corpora differ (A %d, B %d, C %d chars, normalized)' % (len(a), len(b), len(c)))
          ax = read('07-axioms.log')
          if 'sorryAx' in ax: reasons.append('sorryAx present')
          for bad in ('native_decide', 'ofReduceBool'):
              if bad in ax: reasons.append(bad + ' present in axioms')
          want = {'propext', 'Classical.choice', 'Quot.sound'}
          axsets = {}
          for thm in ('ethIsFalse', 'mainTheorem'):
              m = re.search(r"MainResults\.%s'?\s+depends on axioms:\s*\[([^\]]*)\]" % thm, ax)
              if not m:
                  reasons.append('axiom print missing theorem ' + thm)
                  axsets[thm] = set()
              else:
                  got = {x.strip() for x in m.group(1).split(',') if x.strip()}
                  axsets[thm] = got
                  if got != want: reasons.append('axioms for %s = %s (expected classical three)' % (thm, sorted(got)))
          m1 = re.search(r'now_epoch=(\d+)', probe); m2 = re.search(r'epoch=(\d+)', read('05-clock2.txt'))
          skew = 'n/a'
          if m1 and m2:
              skew = str(abs(int(m2.group(1)) - int(m1.group(1))) % 86400)
          verdict = 'PASS' if not reasons else 'BREAK'
          with open(d + '08-verdict.txt', 'w') as f:
              f.write('verdict=%s\n' % verdict)
              f.write('head=%s\n' % head)
              f.write('total_files=%d total_sorry=%d total_escapes=%d\n' % (tf, ts, te))
              f.write('module_sorry=%d module_escapes=%d\n' % (ms, me))
              f.write('challenge_sorry=%d (expected 2) challenge_escapes=%d\n' % (cs, ce))
              f.write('corpus_equal=%s corpus_chars=%d\n' % (corpus_equal, len(a)))
              for thm in ('ethIsFalse', 'mainTheorem'):
                  f.write('axioms_%s=%s\n' % (thm, ','.join(sorted(axsets.get(thm, set())))))
              f.write('clock_skew_seconds=%s\n' % skew)
              for r in reasons: f.write('REASON %s\n' % r)
          print('verdict=' + verdict)
          for r in reasons: print('REASON', r)
          PYEOF
          cat "$AETH_DIR/08-verdict.txt"

      - name: Evidence upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anthropic-eth-forge-evidence
          path: ${{ env.AETH_DIR }}
          retention-days: 30
          if-no-files-found: warn
