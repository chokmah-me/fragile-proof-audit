name: schur-forge

# One-shot independent verification leg for the Schur S(6) >= 537 harvest
# audit (Chen, arXiv:2610.31362). Deleted after the receipt is recorded.
# Clones the public repo at the pinned commit (pin asserted, tip recorded
# as context only), verifies the authors' SHA256SUMS 21/21, runs the
# authors' check.py, and runs an independent verifier written from the
# definitions (own parsers, z-first sum-free check, canonical-key
# inequivalence). Fail-closed verdict: PASS iff clock verified + pin ok
# + sums 21/21 + authors' check exit 0 with "all checks passed" +
# independent verifier exit 0 with INDEPENDENT: PASS and both triple
# counts at their exact vacuity anchors (143916 and 14426506).
# Runner-first rule overflow lane: [self-hosted, laptop] only.

on:
  workflow_dispatch:

concurrency:
  group: schur-forge-laptop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forge:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 60
    env:
      PIN_SHA: "92a9d5f1336a5a064b2bfe6597d967f59191e365"
      REPO_URL: "https://github.com/jeffchen006/Schur-Number-6.git"
    steps:
      - name: Probe runner + clock check
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/schur-evidence"
          rm -rf "$EV"
          mkdir -p "$EV"
          srv_hdr="$(curl -sI --max-time 30 https://github.com | tr -d '\r' | sed -n 's/^[Dd]ate: //p' | head -1)"
          run_epoch="$(date -u +%s)"
          srv_epoch=0
          if test -n "$srv_hdr"; then
            srv_epoch="$(date -u -d "$srv_hdr" +%s 2>/dev/null || echo 0)"
          fi
          skew=$(( run_epoch - srv_epoch ))
          abs_skew=$(( skew < 0 ? -skew : skew ))
          clock_ok=FAIL
          if test "$srv_epoch" -gt 0 && test "$abs_skew" -le 600; then clock_ok=ok; fi
          { echo "clock_ok=$clock_ok"
            echo "skew_seconds=$skew"
            echo "runner_epoch=$run_epoch"
            echo "server_epoch=$srv_epoch"
          } | tee "$EV/clock.txt"
          { echo "date: $(date -u +%FT%TZ)"
            echo "server_date: $srv_hdr"
            echo "runner: $RUNNER_NAME"
            uname -a
            python3 --version || echo "python3: MISSING"
            git --version || echo "git: MISSING"
          } | tee "$EV/probe.log"
          if test "$clock_ok" != "ok"; then
            echo "RUNNER CLOCK UNVERIFIED OR SKEWED (skew=${skew}s); failing closed" >&2
            exit 1
          fi

      - name: Clone target at pin
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/schur-evidence"
          cd "$HOME"
          rm -rf schur-target
          tip="$(git ls-remote "$REPO_URL" HEAD 2>/dev/null | awk '{print $1}')"
          ok=FAIL
          attempt=0
          while test "$attempt" -lt 3; do
            attempt=$(( attempt + 1 ))
            rm -rf schur-target
            if git clone -q "$REPO_URL" schur-target >> "$EV/clone.log" 2>&1; then
              if git -C schur-target checkout -q "$PIN_SHA" >> "$EV/clone.log" 2>&1; then
                ok=ok; break
              fi
            fi
            echo "clone attempt $attempt failed $(date -u +%FT%TZ)" >> "$EV/clone.log"
            sleep 20
          done
          head_sha=""
          if test -d schur-target/.git; then
            head_sha="$(git -C schur-target rev-parse HEAD)"
          fi
          pin_ok=FAIL
          if test "$ok" = "ok" && test "$head_sha" = "$PIN_SHA"; then pin_ok=ok; fi
          { echo "pin_ok=$pin_ok"
            echo "clone_attempts=$attempt"
            echo "head_sha=$head_sha"
            echo "expected_sha=$PIN_SHA"
            echo "tip_at_dispatch=${tip:-unresolved}"
          } | tee "$EV/pin.txt"
          if test "$pin_ok" != "ok"; then
            echo "PIN CHECKOUT FAILED (head=$head_sha); failing closed" >&2
            exit 1
          fi

      - name: Authors SHA256SUMS
        shell: bash
        run: |
          set -uo pipefail
          cd "$HOME/schur-target"
          EV="$HOME/schur-evidence"
          sha256sum -c SHA256SUMS > "$EV/sums-detail.txt" 2>&1 || true
          ok_lines="$(grep -c ': OK$' "$EV/sums-detail.txt" || true)"
          total_lines="$(grep -c '' SHA256SUMS || true)"
          { echo "sums_ok=$ok_lines"
            echo "sums_total=$total_lines"
          } | tee "$EV/sums.txt"
          if test "$ok_lines" != "21" || test "$total_lines" != "21"; then
            echo "SHA256SUMS NOT 21/21 (ok=$ok_lines total=$total_lines); failing closed" >&2
            exit 1
          fi

      - name: Stage early evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$GITHUB_WORKSPACE/schur-evidence-early"
          mkdir -p "$GITHUB_WORKSPACE/schur-evidence-early"
          for f in probe.log clock.txt clone.log pin.txt sums.txt sums-detail.txt; do
            cp "$HOME/schur-evidence/$f" "$GITHUB_WORKSPACE/schur-evidence-early/" 2>/dev/null || true
          done
          ls "$GITHUB_WORKSPACE/schur-evidence-early" || true

      - name: Upload early evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schur-forge-evidence-early
          path: schur-evidence-early
          if-no-files-found: warn

      - name: Authors check.py
        shell: bash
        run: |
          set -uo pipefail
          cd "$HOME/schur-target"
          EV="$HOME/schur-evidence"
          rc=0
          start=$(date +%s)
          python3 check.py > "$EV/authors-check.log" 2>&1 || rc=$?
          { echo "authors_seconds=$(( $(date +%s) - start ))"
            echo "AUTHORS_EXIT:$rc"
          } | tee "$EV/authors-exit.txt"
          cat "$EV/authors-check.log"
          if test "$rc" -ne 0; then echo "::error::AUTHORS CHECK FAILED rc=$rc (verdict will BREAK)"; fi

      - name: Independent verifier (embedded, definition-first)
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/schur-evidence"
          cat > "$EV/independent_verify.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Independent verifier for the Schur S(6) >= 537 certificates.

          Written from the definitions only (README / results.json):
            - a coloring of [1..n] is sum-free if no color class contains x, y, x+y
              (x = y allowed);
            - mod-538 sum-free: for the 537-colorings, no x, y with
              c(x) = c(y) = c((x+y) mod 538) whenever (x+y) mod 538 != 0.
          Does not import or reuse the authors' check.py code paths: sum-freeness is
          checked z-first (for each z, each split x + (z-x)), parsing is separate,
          and inequivalence uses canonical keys relabeled by least element.

          Usage: independent_verify.py <repo-dir>
          Prints one line per gate and a final INDEPENDENT: PASS/FAIL line.
          Exit 0 iff PASS.
          """
          import sys, os, json
          from math import gcd

          def fail(msg):
              print(f"FAIL: {msg}")
              print("INDEPENDENT: FAIL")
              sys.exit(1)

          def check_sum_free(c, n):
              """c: list indexed 1..n (c[0] unused). Returns (violations, triples)."""
              viol = []
              triples = 0
              for z in range(2, n + 1):
                  cz = c[z]
                  for x in range(1, z):
                      triples += 1
                      if c[x] == cz and c[z - x] == cz:
                          viol.append((x, z - x, z, cz))
                          if len(viol) >= 5:
                              return viol, triples
              return viol, triples

          def check_mod_free(c, n=537, m=538):
              viol = []
              for x in range(1, n + 1):
                  cx = c[x]
                  for y in range(1, n + 1):
                      s = x + y
                      if s >= m:
                          s -= m
                      if s == 0:
                          continue
                      if c[y] == cx and c[s] == cx:
                          viol.append((x, y, s, cx))
                          if len(viol) >= 5:
                              return viol
              return viol

          def relabel_by_least(c, n=537):
              """Canonical color labels: classes numbered by their least element."""
              least = {}
              for x in range(1, n + 1):
                  if c[x] not in least:
                      least[c[x]] = x
              order = sorted(least, key=lambda k: least[k])
              lab = {old: i + 1 for i, old in enumerate(order)}
              return tuple(lab[c[x]] for x in range(1, n + 1))

          def canon_key(c, n=537, m=538):
              """Min over units r of the relabeled image coloring x -> c(r*x mod m)."""
              best = None
              for r in range(1, m):
                  if gcd(r, m) != 1:
                      continue
                  img = [0] * (n + 1)
                  for x in range(1, n + 1):
                      img[x] = c[(r * x) % m]
                  key = relabel_by_least(img, n)
                  if best is None or key < best:
                      best = key
              return best

          def partition_sets(c, n):
              cls = {}
              for x in range(1, n + 1):
                  cls.setdefault(c[x], set()).add(x)
              return frozenset(frozenset(s) for s in cls.values())

          def main():
              root = sys.argv[1] if len(sys.argv) > 1 else "."
              os.chdir(root)

              # --- main certificate: certificate.col ---
              tok = open("certificate.col").read().split()
              if tok[:2] != ["537", "6"]:
                  fail(f"certificate.col header {tok[:2]} != ['537', '6']")
              vals = tok[2:]
              if len(vals) != 537:
                  fail(f"certificate.col has {len(vals)} values, expected 537")
              cert = [None] + [int(t) + 1 for t in vals]  # colors 1..6, index = number
              if set(cert[1:]) != {1, 2, 3, 4, 5, 6}:
                  fail(f"certificate colors used: {sorted(set(cert[1:]))}")
              viol, triples = check_sum_free(cert, 537)
              if viol:
                  fail(f"certificate.col monochromatic Schur triples: {viol}")
              print(f"cert_main_sumfree=PASS triples_checked={triples} colors=6 n=537")
              if check_mod_free(cert):
                  fail("certificate.col not sum-free modulo 538")
              print("cert_main_mod538=PASS")

              # --- the 131 partitions: solutions537.txt ---
              sols = {}
              for line in open("solutions537.txt"):
                  if line.startswith("#") or not line.strip():
                      continue
                  pid, s = line.split()
                  if pid in sols:
                      fail(f"duplicate id {pid}")
                  if len(s) != 537 or set(s) - set("123456"):
                      fail(f"{pid}: malformed coloring string")
                  sols[pid] = [None] + [int(ch) for ch in s]
              if len(sols) != 131:
                  fail(f"{len(sols)} partitions parsed, expected 131")
              fams = {}
              for pid in sols:
                  fams[pid.split(".")[0]] = fams.get(pid.split(".")[0], 0) + 1
              if fams != {"F1": 107, "F2": 14, "F3": 5, "F4": 4, "F5": 1}:
                  fail(f"family sizes {fams}")
              print(f"solutions_count=PASS count=131 families={json.dumps(fams, sort_keys=True)}")
              strings = set()
              parts = set()
              for pid, c in sols.items():
                  if set(c[1:]) != {1, 2, 3, 4, 5, 6}:
                      fail(f"{pid}: not all 6 colors used")
                  viol, _ = check_sum_free(c, 537)
                  if viol:
                      fail(f"{pid}: monochromatic Schur triples: {viol}")
                  if check_mod_free(c):
                      fail(f"{pid}: not sum-free modulo 538")
                  strings.add(tuple(c[1:]))
                  parts.add(partition_sets(c, 537))
              if len(strings) != 131 or len(parts) != 131:
                  fail(f"distinct strings={len(strings)} distinct partitions={len(parts)}")
              print("solutions_sumfree_mod538_distinct=PASS checked=131")
              if partition_sets(cert, 537) != partition_sets(sols["F1.001"], 537):
                  fail("certificate.col partition != solutions F1.001 partition (as sets)")
              print("cert_equals_F1.001_partition=PASS")
              keys = {}
              for pid, c in sols.items():
                  keys[pid] = canon_key(c)
              if len(set(keys.values())) != 131:
                  fail(f"canonical keys distinct: {len(set(keys.values()))} != 131")
              print("solutions_pairwise_inequivalent_units_mod538=PASS keys=131")

              # --- S(8) certificate as a standalone artifact ---
              s8raw = open("data/S8_n5372.txt").read().strip()
              if len(s8raw) != 5372 or set(s8raw) - set("12345678"):
                  fail(f"S8 file: len={len(s8raw)} alphabet={sorted(set(s8raw))}")
              s8 = [None] + [int(ch) for ch in s8raw]
              if set(s8[1:]) != set(range(1, 9)):
                  fail(f"S8 colors used: {sorted(set(s8[1:]))}")
              viol, triples8 = check_sum_free(s8, 5372)
              if viol:
                  fail(f"S8 monochromatic Schur triples: {viol}")
              print(f"s8_sumfree=PASS triples_checked={triples8} colors=8 n=5372")

              print("INDEPENDENT: PASS")

          if __name__ == "__main__":
              main()
          PYEOF
          rc=0
          start=$(date +%s)
          python3 "$EV/independent_verify.py" "$HOME/schur-target" > "$EV/independent.log" 2>&1 || rc=$?
          { echo "independent_seconds=$(( $(date +%s) - start ))"
            echo "INDEPENDENT_EXIT:$rc"
          } | tee "$EV/independent-exit.txt"
          cat "$EV/independent.log"
          if test "$rc" -ne 0; then echo "::error::INDEPENDENT VERIFIER FAILED rc=$rc (verdict will BREAK)"; fi

      - name: Verdict (fail-closed)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/schur-evidence"
          python3 - "$EV" <<'PYEOF'
          import os, re, sys
          ev = sys.argv[1]
          def read(name, default=""):
              p = os.path.join(ev, name)
              return open(p, encoding="utf-8", errors="replace").read() if os.path.exists(p) else default
          def has_line(name, line):
              return re.search(r"^" + re.escape(line) + r"$", read(name), re.M) is not None
          def contains(name, sub):
              return sub in read(name)
          fails = []
          if not has_line("clock.txt", "clock_ok=ok"): fails.append("clock_probe")
          if not has_line("pin.txt", "pin_ok=ok"): fails.append("pin")
          if not has_line("sums.txt", "sums_ok=21"): fails.append("sums_ok")
          if not has_line("sums.txt", "sums_total=21"): fails.append("sums_total")
          if not has_line("authors-exit.txt", "AUTHORS_EXIT:0"): fails.append("authors_exit")
          if not has_line("authors-check.log", "all checks passed"): fails.append("authors_passed_line")
          if not has_line("independent-exit.txt", "INDEPENDENT_EXIT:0"): fails.append("independent_exit")
          if not has_line("independent.log", "INDEPENDENT: PASS"): fails.append("independent_pass_line")
          if not contains("independent.log", "cert_main_sumfree=PASS triples_checked=143916"): fails.append("anchor_cert_triples")
          if not contains("independent.log", "s8_sumfree=PASS triples_checked=14426506"): fails.append("anchor_s8_triples")
          if not contains("independent.log", "solutions_pairwise_inequivalent_units_mod538=PASS"): fails.append("inequivalence_line")
          verdict = "PASS" if not fails else "BREAK"
          with open(os.path.join(ev, "verdict.txt"), "w") as fh:
              fh.write(f"verdict={verdict}\n")
              for f in fails: fh.write(f"fail={f}\n")
          print(verdict, fails)
          sys.exit(0 if not fails else 1)
          PYEOF
          vrc=$?
          echo "=== verdict.txt ==="
          cat "$EV/verdict.txt" || true
          exit $vrc

      - name: Stage evidence into workspace
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$GITHUB_WORKSPACE/schur-evidence"
          cp -r "$HOME/schur-evidence" "$GITHUB_WORKSPACE/schur-evidence" || true
          ls "$GITHUB_WORKSPACE/schur-evidence" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schur-forge-evidence
          path: schur-evidence
          if-no-files-found: error
