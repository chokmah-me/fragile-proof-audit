name: laptop-ping

# One-shot liveness check for the dell-laptop runner.
# Manual dispatch only. Runs only where the 'laptop' label lives,
# so a pickup is proof the Dell is online and its runner is listening.
# Prints identity only: no checkout, no secrets, no build.
# Delete this file after the check lands.

on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 5
    steps:
      - name: Ping
        run: |
          set -euo pipefail
          echo "laptop-ping OK"
          echo "runner_name: ${RUNNER_NAME:-unknown}"
          hostname
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          uname -sr
          uptime || true
