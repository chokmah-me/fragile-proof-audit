# Deep replay: the hours-long ab_fluid Euler interval-certificate gate.
#
# Triggers: weekly schedule + manual dispatch.  Runs OUTSIDE the per-push
# verify workflow so a slow runner never blocks merges; the gate is
# checkpointed (scripts/harness/resume.py), so an interrupted runner
# re-run resumes rather than restarts.  Failure here = the Euler PASS
# verdict no longer reproduces: investigate before re-pushing.
#
# AB_FLUID_PIN must match PINNED in scripts/gates/ab_fluid.py.

name: deep-replay

on:
  schedule:
    - cron: "23 6 * * 0" # Sundays ~02:23 ET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-replay
  cancel-in-progress: false

env:
  AB_FLUID_PIN: d0124689230b58b4f86e7b90ac59de06404b3b6b

jobs:
  ab_fluid:
    # Schedule/dispatch only (no PR trigger), so self-hosted is safe here.
    runs-on: [self-hosted, desktop]
    timeout-minutes: 360
    steps:
      # clean: false -- do NOT revert this to the default. The default
      # `git clean -ffdx` deletes results/.checkpoints/ (gitignored, so
      # the -x flag takes it), which is this gate's own checkpoint
      # journal: every run would restart the hours-long replay from
      # zero instead of resuming. It would also wipe the shared
      # checkout's .lake and untracked incoming/ material on the
      # desktop runner. Same rule as verify and ab-fluid-euler-build;
      # deep-replay was the holdout from the 2026-10-12 clean:false
      # pass (euler 2af00fa, verify acf8e54, zeta 8f2fcab).
      - uses: actions/checkout@v4
        with:
          clean: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Provision Euler source at pinned commit
        run: |
          set -euo pipefail
          # Same provisioning as verify.yml's gates job. The clone at
          # $HOME/workspace/ab-fluid-verify normally already exists on
          # this runner (cloned by hand in Oct 2026, and the verify
          # gates job now provisions it too); a bare `git clone` into
          # the existing directory fails, which would kill this run
          # before the gate starts. Provision idempotently instead:
          # no-op at the pin, fetch+checkout when off-pin, a non-git
          # leftover is moved aside, and the final HEAD is asserted.
          case "$AB_FLUID_PIN" in
            *[!0-9a-f]*)
              echo "AB_FLUID_PIN is not lowercase hex: $AB_FLUID_PIN" >&2
              exit 1
              ;;
          esac
          if [ "${#AB_FLUID_PIN}" -ne 40 ]; then
            echo "AB_FLUID_PIN must be a full 40-char sha" >&2
            exit 1
          fi
          DEST="$HOME/workspace/ab-fluid-verify"
          mkdir -p "$HOME/workspace"
          if [ -e "$DEST" ] && [ ! -d "$DEST/.git" ]; then
            mv "$DEST" "$DEST.broken-$(date +%s)"
            echo "moved aside a non-git leftover at $DEST"
          fi
          if [ -d "$DEST/.git" ]; then
            if [ "$(git -C "$DEST" rev-parse HEAD)" != "$AB_FLUID_PIN" ]; then
              git -C "$DEST" fetch --quiet origin
              git -C "$DEST" checkout --quiet "$AB_FLUID_PIN"
            fi
          else
            git clone --quiet https://github.com/tristanbuckmaster/fluid_lean "$DEST"
            git -C "$DEST" checkout --quiet "$AB_FLUID_PIN"
          fi
          got="$(git -C "$DEST" rev-parse HEAD)"
          echo "ab-fluid-verify at $got (want $AB_FLUID_PIN)"
          [ "$got" = "$AB_FLUID_PIN" ]

      - name: Run ab_fluid gate (checkpointed)
        run: python scripts/gates/ab_fluid.py

      - name: Upload gate meta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab_fluid_gate_meta
          path: results/ab_fluid_gate_meta.json
