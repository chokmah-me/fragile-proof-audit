name: eth-forge

# One-shot forge for the OpenAI ETH-disproof claim audit
# (github.com/openai/math, ComparatorChallenges/SubexponentialSAT).
# Sparse checkout at the pin, source scans, Mathlib cache, build of
# the solution module and the challenge module, a comparator-style
# statement-equivalence corpus (challenge env vs solution env,
# #print of every definition the statement names + #check of the
# theorem), an axiom audit, and a fail-closed verdict. The target
# dir persists across dispatches, so a timeout re-dispatch resumes
# from built oleans. Deleted after the receipt lands (forge
# protocol).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 350
    env:
      ETH_DIR: ${{ github.workspace }}/eth-forge-evidence
      ETH_REPO: https://github.com/openai/math.git
      ETH_PIN: 7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a
      ETH_TARGET: ${{ github.workspace }}/../../eth-target
      GLIBC_TUNABLES: glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1
    steps:
      - name: Runner probe
        shell: bash
        run: |
          set +e
          mkdir -p "$ETH_DIR" "$ETH_TARGET"
          {
            echo "host=$(hostname) os=$OSTYPE"
            echo "now_utc=$(date -u +%FT%TZ) now_epoch=$(date +%s)"
            echo "ntp_synchronized=$(timedatectl show -p NTPSynchronized --value 2>/dev/null || echo unknown)"
            nproc; free -g | head -2; df -h "$ETH_TARGET" | tail -1 || true
          } | tee "$ETH_DIR/00-probe.txt"
          exit 0

      - name: Sparse clone at pin (retry x3)
        shell: bash
        run: |
          set +e
          mkdir -p "$ETH_TARGET"
          ok=0
          for attempt in 1 2 3; do
            echo "clone attempt $attempt"
            if [ ! -d "$ETH_TARGET/math/.git" ]; then
              rm -rf "$ETH_TARGET/math"
              git clone --filter=blob:none --no-checkout "$ETH_REPO" "$ETH_TARGET/math"
            fi
            cd "$ETH_TARGET/math" || exit 1
            git config core.sparseCheckout true
            printf '%s\n' \
              '/lean/lakefile.lean' \
              '/lean/lean-toolchain' \
              '/lean/lake-manifest.json' \
              '/lean/formalization.yaml' \
              '/lean/README.md' \
              '/lean/OAI.lean' \
              '/lean/ComparatorChallenges/SubexponentialSAT.lean' \
              '/lean/ComparatorChallenges/SubexponentialSAT.json' \
              '/lean/ComparatorChallenges/README.md' \
              '/lean/OAI/Algorithms/SubexponentialSAT/' \
              '/lean/patches/' > .git/info/sparse-checkout
            git read-tree -mu HEAD
            git fetch --depth 1 origin "$ETH_PIN"
            git checkout -f FETCH_HEAD
            head_sha="$(git rev-parse HEAD)"
            tip="$(git ls-remote "$ETH_REPO" HEAD | awk '{print $1}')"
            echo "clone_head=$head_sha origin_head=$tip"
            echo "$head_sha" > "$ETH_DIR/01-head-sha.txt"
            echo "$tip" > "$ETH_DIR/01-origin-head.txt"
            test -f lean/ComparatorChallenges/SubexponentialSAT.lean \
              && test -f lean/OAI/Algorithms/SubexponentialSAT/Main.lean \
              && test -f lean/lakefile.lean && ok=1
            [ "$ok" = 1 ] && break
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "CLONE_FAILED"; exit 1; }

      - name: Toolchain and manifest pins
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$ETH_TARGET/math/lean" || exit 1
          tc="$(cat lean-toolchain)"
          echo "lean-toolchain: $tc" | tee "$ETH_DIR/02-toolchain.txt"
          elan toolchain list | tee -a "$ETH_DIR/02-toolchain.txt"
          if ! elan toolchain list | grep -q "v4.34.1"; then
            elan toolchain install leanprover/lean4:v4.34.1 2>&1 | tail -2
          fi
          elan toolchain list | tee -a "$ETH_DIR/02-toolchain.txt"
          lean_v="$(lean --version 2>&1)"
          echo "lean --version (repo dir): $lean_v" | tee -a "$ETH_DIR/02-toolchain.txt"
          python3 - "$ETH_DIR" <<'PYEOF'
          import json, sys
          outdir = sys.argv[1]
          m = json.load(open('lake-manifest.json'))
          revs = {p['name']: p.get('rev','') for p in m['packages']}
          with open(outdir + '/02-manifest.txt', 'w') as f:
              f.write("packages=%d\n" % len(m['packages']))
              for k in sorted(revs):
                  f.write("%s %s\n" % (k, revs[k]))
          print("mathlib rev:", revs.get('mathlib'))
          PYEOF
          grep -c "require" lakefile.lean | tee "$ETH_DIR/02-lakefile-requires.txt"

      - name: Source scans (module + challenge, comment-stripped)
        shell: bash
        run: |
          set +e
          cd "$ETH_TARGET/math/lean" || exit 1
          python3 - "$ETH_DIR" <<'PYEOF'
          import os, re, sys
          outdir = sys.argv[1]
          SORRY = re.compile(r'\b(sorry|admit)\b')
          ESCAPES = re.compile(r'\bnative_decide\b|@\[extern|implemented_by|ofReduceBool|\bpartial\s+def\b|\bunsafe\b')
          def strip_comments(src):
              out=[]; i=0; n=len(src); depth=0; instr=False
              while i<n:
                  c=src[i]; nx=src[i+1] if i+1<n else ''
                  if depth>0:
                      if c=='/' and nx=='-': depth+=1; i+=2; continue
                      if c=='-' and nx=='/': depth-=1; i+=2; continue
                      if c=='\n': out.append('\n')
                      i+=1; continue
                  if instr:
                      out.append(c)
                      if c=='\\' and i+1<n: out.append(src[i+1]); i+=2; continue
                      if c=='"': instr=False
                      i+=1; continue
                  if c=='/' and nx=='-': depth=1; i+=2; continue
                  if c=='-' and nx=='-':
                      while i<n and src[i]!='\n': i+=1
                      continue
                  if c=='"': instr=True
                  out.append(c); i+=1
              return ''.join(out)
          def scan(paths):
              files=0; sh=0; eh=0; hits=[]
              for p in paths:
                  files+=1
                  src=open(p, errors='replace').read()
                  code=strip_comments(src)
                  for ln, line in enumerate(code.split('\n'),1):
                      if SORRY.search(line): sh+=1; hits.append("%s:%d sorry %s" % (p,ln,line.strip()[:100]))
                      if ESCAPES.search(line): eh+=1; hits.append("%s:%d escape %s" % (p,ln,line.strip()[:100]))
              return files, sh, eh, hits
          mod_root='OAI/Algorithms/SubexponentialSAT'
          mod_paths=[]
          for root, dirs, fs in os.walk(mod_root):
              dirs[:] = [d for d in dirs if d != '.lake']
              for fn in fs:
                  if fn.endswith('.lean'): mod_paths.append(os.path.join(root, fn))
          mf, ms, me, mh = scan(sorted(mod_paths))
          cf, cs, ce, ch = scan(['ComparatorChallenges/SubexponentialSAT.lean'])
          with open(outdir + '/03-scans.txt', 'w') as f:
              f.write("module_files=%d\nmodule_sorry_hits=%d\nmodule_escape_hits=%d\n" % (mf, ms, me))
              f.write("challenge_files=%d\nchallenge_sorry_hits=%d\nchallenge_escape_hits=%d\n" % (cf, cs, ce))
              for h in mh[:20]: f.write("MODHIT %s\n" % h)
              for h in ch[:20]: f.write("CHHIT %s\n" % h)
          print("module: files=%d sorry=%d escapes=%d" % (mf, ms, me))
          print("challenge: files=%d sorry=%d escapes=%d" % (cf, cs, ce))
          PYEOF

      - name: Early evidence upload
        uses: actions/upload-artifact@v4
        with:
          name: eth-forge-evidence-early
          path: ${{ env.ETH_DIR }}
          retention-days: 30
          if-no-files-found: warn

      - name: Mathlib cache (fail closed)
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$ETH_TARGET/math/lean" || exit 1
          cache_exit=""
          for attempt in 1 2; do
            lake exe cache get > "$ETH_DIR/04-cache-get.log" 2>&1
            cache_exit=$?
            echo "cache get attempt $attempt exit=$cache_exit"
            [ "$cache_exit" = 0 ] && break
            sleep 15
          done
          echo "$cache_exit" > "$ETH_DIR/04-cache-exit.txt"
          oleans="$(find "$ETH_TARGET/math/.lake" "$ETH_TARGET/math/lean/.lake" -name '*.olean' 2>/dev/null | wc -l)"
          echo "oleans_total=$oleans" | tee "$ETH_DIR/04-oleans.txt"
          [ "$cache_exit" = 0 ] || { echo "CACHE_FAILED"; exit 1; }

      - name: Clock check 2
        shell: bash
        run: |
          { echo "epoch=$(date +%s) utc=$(date -u +%FT%TZ)"; } > "$ETH_DIR/05-clock2.txt"
          cat "$ETH_DIR/05-clock2.txt"

      - name: Build solution + challenge modules
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$ETH_TARGET/math/lean" || exit 1
          start=$(date +%s)
          lake build OAI.Algorithms.SubexponentialSAT.Main > "$ETH_DIR/06-build-solution.log" 2>&1
          sol_exit=$?
          end=$(date +%s)
          echo "$sol_exit" > "$ETH_DIR/06-build-solution-exit.txt"
          echo "solution_seconds=$((end-start))" | tee "$ETH_DIR/06-build-solution-seconds.txt"
          start=$(date +%s)
          lake build ComparatorChallenges.SubexponentialSAT > "$ETH_DIR/06-build-challenge.log" 2>&1
          ch_exit=$?
          end=$(date +%s)
          echo "$ch_exit" > "$ETH_DIR/06-build-challenge-exit.txt"
          echo "challenge_seconds=$((end-start))" | tee "$ETH_DIR/06-build-challenge-seconds.txt"
          echo "solution_exit=$sol_exit challenge_exit=$ch_exit"

      - name: Statement corpora (challenge env vs solution env) + axiom audit
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$ETH_TARGET/math/lean" || exit 1
          python3 - "$ETH_TARGET/math/lean" <<'PYEOF'
          import sys
          root = sys.argv[1]
          names = [
            "BinaryArithmetic.bitVal", "BinaryArithmetic.toNat",
            "SAT.Assignment", "SAT.Literal", "SAT.Clause", "SAT.CNF",
            "SAT.Literal.eval", "SAT.Clause.eval", "SAT.CNF.eval",
            "SAT.WidthAtMost", "SAT.satisfyingAssignments", "SAT.count",
            "Encoding.encodeNat", "Encoding.frame", "Encoding.encodeList",
            "Encoding.literalCode", "Encoding.clauseNumbers",
            "Encoding.cnfNumbers", "Encoding.encodeCNFBody",
            "Encoding.encodeCNF", "Encoding.formulaBitLength",
            "Computation.Trace", "Computation.PrimitiveMachine",
            "Computation.PrimitiveMachine.Cfg",
            "Computation.PrimitiveMachine.step",
            "Computation.PrimitiveMachine.init",
            "SqrtLog.Statement.runtimeScale",
            "SqrtLog.Statement.runtimeBound",
            "SqrtLogSpace.countWord", "SqrtLogSpace.LocatedCfg",
            "SqrtLogSpace.locatedInit", "SqrtLogSpace.headDisplacement",
            "SqrtLogSpace.LocatedCfg.monitor", "SqrtLogSpace.locatedStep",
            "SqrtLogSpace.visitedSpace",
          ]
          P = "OAI.Algorithms.SubexponentialSAT"
          corpus = "".join("#print %s.%s\n" % (P, n) for n in names)
          corpus += "#check @%s.SqrtLogSpace.exact_count_and_sat\n" % P
          a = "import ComparatorChallenges.SubexponentialSAT\n" + corpus
          b = ("import OAI.Algorithms.SubexponentialSAT.Main\n"
               "import OAI.Algorithms.SubexponentialSAT.SAT\n"
               "import OAI.Algorithms.SubexponentialSAT.BinaryArithmetic\n"
               "import OAI.Algorithms.SubexponentialSAT.Encoding\n"
               "import OAI.Algorithms.SubexponentialSAT.Computation\n"
               "import OAI.Algorithms.SubexponentialSAT.SqrtLog.StatementScale\n"
               "import OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.VisitedTape\n"
               "import OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.EncodingBounds\n"
               + corpus)
          c = ("import OAI.Algorithms.SubexponentialSAT.Main\n"
               "#print axioms %s.SqrtLogSpace.exact_count_and_sat\n" % P)
          open(root + '/EthAuditEnvA.lean', 'w').write(a)
          open(root + '/EthAuditEnvB.lean', 'w').write(b)
          open(root + '/EthAuditAxioms.lean', 'w').write(c)
          print("env files written:", len(names), "corpus entries + theorem check")
          PYEOF
          lake env lean EthAuditEnvA.lean > "$ETH_DIR/07-corpus-a.log" 2>&1
          echo "envA_exit=$?" | tee "$ETH_DIR/07-corpus-a-exit.txt"
          lake env lean EthAuditEnvB.lean > "$ETH_DIR/07-corpus-b.log" 2>&1
          echo "envB_exit=$?" | tee "$ETH_DIR/07-corpus-b-exit.txt"
          lake env lean EthAuditAxioms.lean > "$ETH_DIR/07-axioms.log" 2>&1
          echo "axioms_exit=$?" | tee "$ETH_DIR/07-axioms-exit.txt"
          head -3 "$ETH_DIR/07-axioms.log"

      - name: Verdict (fail-closed)
        shell: bash
        run: |
          set +e
          python3 - "$ETH_DIR" <<'PYEOF'
          import re, sys
          d = sys.argv[1] + '/'
          def read(n, default=''):
              try: return open(d+n).read()
              except FileNotFoundError: return default
          def num(txt, key):
              m = re.search(key + r'=(\d+)', txt)
              return int(m.group(1)) if m else -1
          probe = read('00-probe.txt'); scans = read('03-scans.txt')
          reasons = []
          head = read('01-head-sha.txt').strip()
          if head != '7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a': reasons.append('HEAD != pin')
          if 'version 4.34.1,' not in read('02-toolchain.txt'): reasons.append('lean version != 4.34.1')
          if 'mathlib d13f23b723b8a846827a245b89c10fc7d3f11612' not in read('02-manifest.txt'):
              reasons.append('mathlib rev mismatch')
          mf = num(scans, 'module_files'); ms = num(scans, 'module_sorry_hits'); me = num(scans, 'module_escape_hits')
          cs = num(scans, 'challenge_sorry_hits'); ce = num(scans, 'challenge_escape_hits')
          if mf != 3977: reasons.append('module files = %d (expected 3977)' % mf)
          if ms != 0: reasons.append('module sorry hits = %d' % ms)
          if me != 0: reasons.append('module escape hits = %d' % me)
          if cs != 1: reasons.append('challenge sorry hits = %d (expected exactly 1, the statement)' % cs)
          if ce != 0: reasons.append('challenge escape hits = %d' % ce)
          if read('04-cache-exit.txt').strip() != '0': reasons.append('cache get failed')
          if num(read('04-oleans.txt'), 'oleans_total') < 1000: reasons.append('mathlib oleans < 1000')
          if read('06-build-solution-exit.txt').strip() != '0': reasons.append('solution build failed')
          if read('06-build-challenge-exit.txt').strip() != '0': reasons.append('challenge build failed')
          if 'envA_exit=0' not in read('07-corpus-a-exit.txt'): reasons.append('env A (challenge corpus) failed')
          if 'envB_exit=0' not in read('07-corpus-b-exit.txt'): reasons.append('env B (solution corpus) failed')
          if 'axioms_exit=0' not in read('07-axioms-exit.txt'): reasons.append('axiom env failed')
          a = re.sub(r'\s+', '', read('07-corpus-a.log'))
          b = re.sub(r'\s+', '', read('07-corpus-b.log'))
          corpus_equal = (a == b) and len(a) > 2000
          if not corpus_equal: reasons.append('statement corpora differ (A %d chars vs B %d chars, normalized)' % (len(a), len(b)))
          ax = read('07-axioms.log')
          thm = 'exact_count_and_sat'
          if thm not in ax: reasons.append('axiom print missing theorem')
          if 'sorryAx' in ax: reasons.append('sorryAx present')
          for bad in ('native_decide', 'ofReduceBool'):
              if bad in ax: reasons.append(bad + ' present in axioms')
          found = set(re.findall(r'\b(propext|Classical\.choice|Quot\.sound)\b', ax))
          if not found: reasons.append('no permitted axioms found in print')
          m1 = re.search(r'now_epoch=(\d+)', probe); m2 = re.search(r'epoch=(\d+)', read('05-clock2.txt'))
          skew = 'n/a'
          if m1 and m2:
              # probe-to-clock2 elapsed seconds (report only; the pins
              # are content hashes, so wall-clock trust is not
              # load-bearing for this audit).
              skew = str(abs(int(m2.group(1)) - int(m1.group(1))) % 86400)
          verdict = 'PASS' if not reasons else 'BREAK'
          with open(d + '08-verdict.txt', 'w') as f:
              f.write('verdict=%s\n' % verdict)
              f.write('head=%s\n' % head)
              f.write('module_files=%d module_sorry=%d module_escapes=%d\n' % (mf, ms, me))
              f.write('challenge_sorry=%d (expected 1) challenge_escapes=%d\n' % (cs, ce))
              f.write('corpus_equal=%s corpus_chars=%d\n' % (corpus_equal, len(a)))
              f.write('axioms_found=%s\n' % ','.join(sorted(found)))
              f.write('clock_skew_seconds=%s\n' % skew)
              for r in reasons: f.write('REASON %s\n' % r)
          print('verdict=' + verdict)
          for r in reasons: print('REASON', r)
          PYEOF
          cat "$ETH_DIR/08-verdict.txt"

      - name: Stage verdict
        if: always()
        shell: bash
        run: |
          set +e
          cp "$ETH_DIR"/*.txt "$ETH_DIR"/*.log "$ETH_TARGET/math/.verdict-stage/" 2>/dev/null || true

      - name: Evidence upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-forge-evidence
          path: ${{ env.ETH_DIR }}
          retention-days: 30
          if-no-files-found: warn
