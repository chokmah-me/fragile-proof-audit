name: kopis-forge

# One-shot audit forge for the Kopis KEM harvest audit
# (rozbb/kopis-rs @ c368dee). NOT standing CI: delete this file
# once the receipt is recorded.
#
# Why this exists: the audit's M2 leg must independently reproduce,
# at the pin, the repo's own verification claim V-A:
#   for all three backends (serial / AVX2 / NEON) and all three
#   parameter sets, the Aeneas-extracted Rust public KEM API matches
#   the Lean spec, panic-free, with the axiom footprint of the
#   top-level theorems exactly the audited list in
#   lean/AxiomCheck.lean.
# Upstream CI at the pin is green, but upstream's receipt is never
# credited as ours (recon rule). At the user's word (2026-10-23,
# "do kopis") the job runs on the desktop lane
# ([self-hosted, desktop], DESKTOP-7HDI2D1) per the runner-first
# build dispatch rule (2026-10-21); heavy builds never run on the
# control-plane VM.
#
# Procedure (mirrors upstream CI's own Lean job at the pin):
#   1. fresh clone of rozbb/kopis-rs @
#      c368dee666cd1f0b6235907f40089e4ab53ed724 (asserted);
#      toolchain leanprover/lean4:v4.35.0 (asserted from
#      lean/lean-toolchain); AENEAS_VERSION.txt vs lake-manifest
#      aeneas pin recorded (upstream CI's own check);
#   2. environment probe recorded (cores, memory, disk, make /
#      python3 / sed presence);
#   3. lake exe cache get for Mathlib (gating: without the cache
#      the cold build cannot finish inside the job budget);
#   4. twin currency: make -C lean twins, then the target tree
#      must be clean under lean/ (a silent regeneration is a
#      stale checked-in generated file, recorded and gating);
#   5. comment-stripped source scans over lean/ (sorry / admit /
#      native_decide / bv_decide), recorded; sorry/admit gating;
#   6. make prove-kopis-serial, prove-kopis-avx2,
#      prove-kopis-neon as separate steps, each exit recorded,
#      none aborts the next. Each builds AxiomCheck, which fails
#      the build if the axiom footprint differs from the audited
#      list exactly -- its build log is the axiom receipt;
#   7. make test-avx2-model and make test-neon-model (the
#      intrinsic-model vector replays), exits recorded.
#
# Verdict (fail-closed):
#   PASS iff the pin asserted, cache get exit 0, twins left the
#   tree clean, scans show 0 sorry and 0 admit in code, all three
#   prove steps exit 0 (which includes AxiomCheck passing for all
#   three backends), and both model tests exit 0. Anything else
#   is FAIL. The verdict step exits with the verdict, so the run
#   conclusion carries it; the evidence artifact uploads either
#   way (always()).
#
# Parallelism: LEAN_NUM_THREADS=8 is set in the job env (the
# repo's own documented knob; each Lean worker's RSS is ~1.75 GB
# per the Makefile's comment, and the lane's cap is 27 GiB).
#
# Harness rules: pins are literals (no dispatch inputs); the
# scratch clone lives in $HOME outside the shared checkout and
# is removed in an always() step; evidence lives under
# $GITHUB_WORKSPACE/kopis-evidence and is uploaded by relative
# path; no `lake update`; exit codes are captured with
# `rc=0` + `cmd || rc=$?` (the runner forces bash -e;
# AGENTS.md (24)).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kopis-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: [self-hosted, desktop]
    timeout-minutes: 600
    env:
      TARGET_SHA: c368dee666cd1f0b6235907f40089e4ab53ed724
      LEAN_NUM_THREADS: "8"
    steps:
      - name: Install elan if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf --retry 5 --retry-delay 10 --retry-all-errors | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Probe environment
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          mkdir -p "$EV"
          {
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "host=$(hostname)"
            echo "nproc=$(nproc)"
            free -h || true
            df -h "$HOME" || true
            echo "make: $(make --version 2>/dev/null | head -1)"
            echo "python3: $(python3 --version 2>&1)"
            echo "sed: $(sed --version 2>/dev/null | head -1)"
            echo "git: $(git --version 2>&1)"
          } | tee "$EV/probe.log"
          exit 0

      - name: Clone target at pin and record pins
        shell: bash
        run: |
          set -euo pipefail
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          mkdir -p "$EV"
          export PATH="$HOME/.elan/bin:$PATH"
          rm -rf "$HOME/kopis-target"
          git clone -q https://github.com/rozbb/kopis-rs "$HOME/kopis-target"
          git -C "$HOME/kopis-target" checkout -q "$TARGET_SHA"
          HEAD=$(git -C "$HOME/kopis-target" rev-parse HEAD)
          echo "cloned HEAD: $HEAD"
          [ "$HEAD" = "$TARGET_SHA" ] || { echo "FAIL: HEAD != pin"; exit 1; }
          grep -q "leanprover/lean4:v4.35.0" "$HOME/kopis-target/lean/lean-toolchain" || { echo "FAIL: toolchain mismatch"; exit 1; }
          elan toolchain install leanprover/lean4:v4.35.0
          cd "$HOME/kopis-target"
          {
            echo "target_repo=https://github.com/rozbb/kopis-rs"
            echo "target_head=$HEAD"
            echo "toolchain=$(cat lean/lean-toolchain)"
            echo "aeneas_version_txt=$(tr -d '[:space:]' < AENEAS_VERSION.txt)"
            python3 -c "import json; print('aeneas_manifest_rev=' + [p['inputRev'] for p in json.load(open('lean/lake-manifest.json'))['packages'] if p['name']=='aeneas'][0])"
            python3 -c "import json; [print('dep_' + p['name'] + '=' + p.get('inputRev','')) for p in json.load(open('lean/lake-manifest.json'))['packages']]"
            echo "axiomcheck_sha256=$(sha256sum lean/AxiomCheck.lean | cut -d' ' -f1)"
            echo "kopisspec_bytes=$(wc -c < lean/KopisSpec.lean)"
            echo "kopisspec_sha256=$(sha256sum lean/KopisSpec.lean | cut -d' ' -f1)"
            echo "lane=[self-hosted, desktop]"
          } | tee "$EV/pins.txt"

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$HOME/kopis-target/lean" || { echo "CACHE_EXIT:127" >> "$EV/exits.txt"; exit 0; }
          lake --version 2>&1 | tee "$EV/lake-version.log"
          rc=0
          lake exe cache get > "$EV/cache-get.log" 2>&1 || rc=$?
          echo "CACHE_EXIT:$rc" >> "$EV/exits.txt"
          exit 0

      - name: Twin currency check
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          cd "$HOME/kopis-target" || { echo "TWINS_EXIT:127" >> "$EV/exits.txt"; echo "TWINS_DIRTY:1" >> "$EV/exits.txt"; exit 0; }
          rc=0
          make -C lean twins > "$EV/twins.log" 2>&1 || rc=$?
          echo "TWINS_EXIT:$rc" >> "$EV/exits.txt"
          git status --porcelain -- lean/ > "$EV/twins-status.txt"
          if [ -s "$EV/twins-status.txt" ]; then
            echo "TWINS_DIRTY:1" >> "$EV/exits.txt"
            git diff --stat -- lean/ > "$EV/twins-diff.txt" 2>&1
          else
            echo "TWINS_DIRTY:0" >> "$EV/exits.txt"
          fi
          exit 0

      - name: Source scans (comments stripped)
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          python3 - "$HOME/kopis-target/lean" > "$EV/scans.txt" 2>&1 <<'PYEOF'
          import re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          def strip(src):
              out, i, n = [], 0, len(src)
              while i < n:
                  if src.startswith('/-', i):
                      depth, i = 1, i + 2
                      while i < n and depth:
                          if src.startswith('/-', i): depth, i = depth + 1, i + 2
                          elif src.startswith('-/', i): depth, i = depth - 1, i + 2
                          else: i += 1
                      out.append(' ')
                  elif src.startswith('--', i):
                      j = src.find('\n', i)
                      i = n if j < 0 else j
                      out.append(' ')
                  else:
                      out.append(src[i]); i += 1
              return ''.join(out)
          pats = {k: re.compile(r'\b' + k + r'\b') for k in
                  ('sorry', 'admit', 'native_decide', 'bv_decide')}
          counts = {k: 0 for k in pats}
          files = sorted(root.rglob('*.lean'))
          hits = []
          for f in files:
              code = strip(f.read_text(errors='replace'))
              for k, p in pats.items():
                  c = len(p.findall(code))
                  if c:
                      counts[k] += c
                      hits.append(f"{f.relative_to(root)}: {k} x{c}")
          print(f"files_scanned={len(files)}")
          for k in pats: print(f"SCAN {k}: {counts[k]}")
          for h in hits: print("HIT", h)
          PYEOF
          rc=$?
          echo "SCAN_EXIT:$rc" >> "$EV/exits.txt"
          exit 0

      - name: Prove serial backend
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$HOME/kopis-target/lean" || { echo "PROVE_SERIAL_EXIT:127" >> "$EV/exits.txt"; exit 0; }
          rc=0
          make prove-kopis-serial > "$EV/prove-serial.log" 2>&1 || rc=$?
          echo "PROVE_SERIAL_EXIT:$rc" >> "$EV/exits.txt"
          exit 0

      - name: Prove AVX2 backend
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$HOME/kopis-target/lean" || { echo "PROVE_AVX2_EXIT:127" >> "$EV/exits.txt"; exit 0; }
          rc=0
          make prove-kopis-avx2 > "$EV/prove-avx2.log" 2>&1 || rc=$?
          echo "PROVE_AVX2_EXIT:$rc" >> "$EV/exits.txt"
          exit 0

      - name: Prove NEON backend
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$HOME/kopis-target/lean" || { echo "PROVE_NEON_EXIT:127" >> "$EV/exits.txt"; exit 0; }
          rc=0
          make prove-kopis-neon > "$EV/prove-neon.log" 2>&1 || rc=$?
          echo "PROVE_NEON_EXIT:$rc" >> "$EV/exits.txt"
          exit 0

      - name: Intrinsic model tests
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$HOME/kopis-target/lean" || { echo "TEST_AVX2_EXIT:127" >> "$EV/exits.txt"; echo "TEST_NEON_EXIT:127" >> "$EV/exits.txt"; exit 0; }
          rc=0
          make test-avx2-model > "$EV/test-avx2-model.log" 2>&1 || rc=$?
          echo "TEST_AVX2_EXIT:$rc" >> "$EV/exits.txt"
          rc=0
          make test-neon-model > "$EV/test-neon-model.log" 2>&1 || rc=$?
          echo "TEST_NEON_EXIT:$rc" >> "$EV/exits.txt"
          exit 0

      - name: Verdict
        shell: bash
        run: |
          set +e
          EV="$GITHUB_WORKSPACE/kopis-evidence"
          python3 - "$EV" <<'PYEOF'
          import re, sys
          from pathlib import Path
          ev = Path(sys.argv[1])
          def read(name):
              p = ev / name
              return p.read_text() if p.exists() else ''
          exits = dict(l.strip().split(':', 1) for l in
                       read('exits.txt').splitlines() if ':' in l)
          scans = dict((m.group(1), int(m.group(2))) for m in
                       re.finditer(r'SCAN (\w+): (\d+)', read('scans.txt')))
          pins = read('pins.txt')
          def z(k): return exits.get(k) == '0'
          checks = {
              'pin_ok': 'target_head=c368dee666cd1f0b6235907f40089e4ab53ed724' in pins
                        and 'leanprover/lean4:v4.35.0' in pins,
              'cache_get': z('CACHE_EXIT'),
              'twins_ran': z('TWINS_EXIT'),
              'twins_clean': exits.get('TWINS_DIRTY') == '0',
              'scan_zero_sorry': scans.get('sorry') == 0,
              'scan_zero_admit': scans.get('admit') == 0,
              'prove_serial': z('PROVE_SERIAL_EXIT'),
              'prove_avx2': z('PROVE_AVX2_EXIT'),
              'prove_neon': z('PROVE_NEON_EXIT'),
              'test_avx2_model': z('TEST_AVX2_EXIT'),
              'test_neon_model': z('TEST_NEON_EXIT'),
          }
          verdict = 'PASS' if all(checks.values()) else 'FAIL'
          lines = [f"{k}={'ok' if v else 'FAIL'}" for k, v in checks.items()]
          lines.append(f"VERDICT: {verdict}")
          out = '\n'.join(lines) + '\n'
          (ev / 'verdict.txt').write_text(out)
          print(out)
          sys.exit(0 if verdict == 'PASS' else 1)
          PYEOF
          rc=$?
          echo "verdict step exit: $rc"
          exit $rc

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kopis-forge-evidence
          path: kopis-evidence/
          if-no-files-found: warn

      - name: Cleanup scratch clone
        if: always()
        shell: bash
        run: |
          rm -rf "$HOME/kopis-target"
          exit 0
