name: oai-headline-forge

# Independent build + axiom audit of the four openai/math "headline" claims
# from the 2026-10-08 replay map: family 003 quasi-RH 7/8 zero-free region,
# the symmetric Mahler conjecture, and both Kaplansky direct-finiteness
# counterexamples (char 2 + odd char).
#
# Static recon (agent VM, 2026-10-08, openai/math @ fd4aeeb2e):
#   - M1 statement correspondence: PASS x4 at declaration level -- each named
#     declaration states its paper's headline claim.
#   - 0 sorry, 0 admit, 0 native_decide in the 3,365-file transitive OAI
#     import closure of the four modules.
# Upstream has no CI that builds this Lean code. This workflow is the build
# check: compile the four modules and run #print axioms on the four named
# main-result declarations, fail-closed against the
# propext / Quot.sound / Classical.choice allowlist.
#
# Scratch-project trick (cf. oai-honeycomb-forge.yml): vendor only the
# transitive closure (oai-headline-files.txt, computed at fd4aeeb2e) into a
# scratch lake project with just the 3 external deps the closure needs
# (mathlib, PrimeNumberTheoremAnd, rellich-kondrachov) at the exact revs from
# upstream's lake-manifest.json -- avoids the 46-package full-project closure.
#
# Manual dispatch only. Runs on the self-hosted WSL runner.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oai-headline-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: [self-hosted, desktop]
    timeout-minutes: 360
    steps:
      - name: Check out this repo
        # META-RULE (2026-10-09): never use sparse-checkout -- or leave any
        # other persistent git-config change -- on the shared self-hosted
        # checkout. Every workflow on DESKTOP-7HDI2D1 shares one
        # _work/<repo>/<repo> dir; a sparse config left behind silently guts
        # all later checkouts (verify died twice at setup-python with "no
        # requirements.txt" before this was found). The closure file list is
        # one small text file -- a full checkout is cheap and leaves no
        # residue. Scratch work goes in subdirs (oai-math/, headline-forge/).
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Pin openai/math commit
        run: |
          set -euo pipefail
          # The workspace root persists between runs on the self-hosted
          # runner -- a second dispatch would fail cloning into an existing
          # oai-math dir. Clean slate first (cf. META-RULE on checkout).
          rm -rf oai-math
          git clone --filter=blob:none --sparse https://github.com/openai/math.git oai-math
          cd oai-math
          # Fail-closed pin: no fallback to main. A wrong commit here would
          # silently build the wrong formalizations (adversarial review).
          git fetch --depth 1 origin fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
          git checkout fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
          head="$(git rev-parse HEAD)"
          [ "$head" = "fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb" ] || { echo "FAIL: oai-math HEAD $head != pinned fd4aeeb2e"; exit 1; }
          echo "$head" | tee ../OAI_COMMIT

      - name: Sparse-checkout the 3,365-file closure
        run: |
          set -euo pipefail
          cd oai-math
          git sparse-checkout set --no-cone --stdin < ../.github/workflows/oai-headline-files.txt
          echo "checked out lean files: $(find lean/OAI -name '*.lean' | wc -l)"
          # Upstream's own build applies lean/patches/<dep>-lean4341.patch to
          # each pinned dep (see the post_update hook in its lakefile). The
          # scratch project must apply the ones for the deps it uses -- the
          # raw dep revs do not elaborate against mathlib@d13f23b (run #4
          # died in rellich-kondrachov, 9635/12321 modules in).
          git sparse-checkout add lean/patches/rellich-kondrachov-lean4341.patch lean/patches/PrimeNumberTheoremAnd-lean4341.patch
          for p in rellich-kondrachov PrimeNumberTheoremAnd; do
            [ -f "lean/patches/${p}-lean4341.patch" ] || { echo "FAIL: patch lean/patches/${p}-lean4341.patch absent at pinned commit"; exit 1; }
          done

      - name: Scratch lake project (3 deps at upstream-pinned revs)
        run: |
          set -euo pipefail
          # Clean slate: a previous run's .lake may hold a manifest resolved
          # with the old require order.
          rm -rf headline-forge headline-stage
          mkdir -p headline-forge && cd headline-forge
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL
          package headline_forge where
          -- NOTE: mathlib MUST come last. PrimeNumberTheoremAnd and
          -- rellich-kondrachov pin older revisions of mathlib's satellite
          -- packages (batteries, aesop, Qq, ...); with mathlib first, lake
          -- resolves to those older revs and `lake exe cache get` then
          -- computes wrong hashes ("failed to fetch cache"). With mathlib
          -- last, its satellite revs win, matching upstream's manifest.
          require PrimeNumberTheoremAnd from git "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git" @ "c39a751132c88b6e8080b74c74023fd95b3d8be0"
          require "rellich-kondrachov" from git "https://github.com/abenenson/rellich-kondrachov.git" @ "70f85d4c1bf99c6e7d61e8be4daa6f3664d08d23"
          require mathlib from git "https://github.com/leanprover-community/mathlib4.git" @ "d13f23b723b8a846827a245b89c10fc7d3f11612"
          -- Declare the vendored OAI modules as a library. NOTE: do NOT set
          -- `roots` here -- a roots-restricted lib silently excludes every
          -- non-root module from the build plan, so dependencies never get
          -- .oleans and the build dies with "object file does not exist"
          -- (headline run #3). A bare declaration covers all vendored files.
          lean_lib OAI where
          EOF
          cd ../oai-math
          # NOTE: keep the leading lean/ in the tar paths -- the sparse
          # checkout lays files out as oai-math/lean/OAI/..., and stripping
          # the prefix (as the first version did) makes tar look in
          # oai-math/OAI/... which does not exist.
          mkdir -p ../headline-stage
          tar cf - -T ../.github/workflows/oai-headline-files.txt | tar xf - -C ../headline-stage
          mv ../headline-stage/lean/OAI ../headline-forge/OAI
          vendored=$(find ../headline-forge/OAI -name '*.lean' | wc -l)
          expected=$(wc -l < ../.github/workflows/oai-headline-files.txt)
          echo "vendored lean files: $vendored (expected $expected)"
          # Fail-fast (harness rule: no failure goes to waste -- run #1 died
          # here with a path bug, tar looking in oai-math/OAI instead of
          # oai-math/lean/OAI). Every listed file must have landed.
          [ "$vendored" -eq "$expected" ] || { echo "FAIL: vendored $vendored != expected $expected"; exit 1; }
          for mod in OAI/NumberTheory/DirichletL/Nonvanishing OAI/Analysis/Mahler/MainTheorem OAI/RingTheory/DirectFiniteness/FinitelyPresented OAI/Algebra/OddKaplansky/Main; do
            [ -f "../headline-forge/$mod.lean" ] || { echo "FAIL: missing root module $mod"; exit 1; }
          done

      - name: Fetch dependencies
        working-directory: headline-forge
        run: |
          set -o pipefail
          lake update 2>&1 | tee ../lake-update.log
          # Fail-fast (harness rule: no failure goes to waste -- run #2 died
          # at cache-get because satellites resolved to older revs; the
          # warning below is the early signal).
          if grep -q "pins different versions" ../lake-update.log; then
            echo "FAIL: dependency satellite version conflict -- 'require mathlib' must be last in lakefile.lean so its revs win"
            exit 1
          fi

      - name: Apply upstream compatibility patches
        working-directory: headline-forge
        run: |
          set -euo pipefail
          # Mirror upstream's post_update hook: its pinned dep revs need
          # lean/patches/<dep>-lean4341.patch applied to elaborate against
          # mathlib@d13f23b. Fail-closed: a patch that is missing or does not
          # apply cleanly fails the run here, not 42 minutes into the build.
          for dep in rellich-kondrachov PrimeNumberTheoremAnd; do
            # Absolute path: git -C re-roots relative paths under the dep dir.
            patch="$(pwd)/../oai-math/lean/patches/${dep}-lean4341.patch"
            dir=".lake/packages/${dep}"
            [ -f "$patch" ] || { echo "FAIL: patch missing: $patch"; exit 1; }
            [ -d "$dir" ] || { echo "FAIL: dep checkout missing: $dir"; exit 1; }
            git -C "$dir" apply --check "$patch" || { echo "FAIL: patch does not apply cleanly to $dir: $patch"; exit 1; }
            git -C "$dir" apply "$patch"
            echo "applied $patch -> $dir"
          done

      - name: Fetch mathlib prebuilt oleans
        working-directory: headline-forge
        run: lake exe cache get

      - name: Build the four headline modules
        working-directory: headline-forge
        run: |
          set -o pipefail
          lake build OAI.NumberTheory.DirichletL.Nonvanishing OAI.Analysis.Mahler.MainTheorem OAI.RingTheory.DirectFiniteness.FinitelyPresented OAI.Algebra.OddKaplansky.Main 2>&1 | tee ../build.log

      - name: Axiom audit (four main-result declarations)
        working-directory: headline-forge
        run: |
          cat > AxiomCheck.lean <<'EOF'
          import OAI.NumberTheory.DirichletL.Nonvanishing
          import OAI.Analysis.Mahler.MainTheorem
          import OAI.RingTheory.DirectFiniteness.FinitelyPresented
          import OAI.Algebra.OddKaplansky.Main
          #print axioms OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re
          #print axioms OAI.SymmetricMahler.symmetric_mahler
          #print axioms OAI.KaplanskyCounterexample.finitelyPresented_counterexample
          #print axioms OAI.OddKaplansky.main_theorem
          EOF
          lake env lean AxiomCheck.lean > ../axioms.txt 2>&1 || true
          cat ../axioms.txt

      - name: Verdict (fail-closed)
        run: |
          python3 - <<'EOF'
          import re, sys
          txt = open('axioms.txt').read()
          allow = {'propext', 'Quot.sound', 'Classical.choice'}
          decls = ['OAI.DirichletCharacter.LFunction_ne_zero_of_seven_eighths_lt_re',
                   'OAI.SymmetricMahler.symmetric_mahler',
                   'OAI.KaplanskyCounterexample.finitelyPresented_counterexample',
                   'OAI.OddKaplansky.main_theorem']
          # DOTALL + non-greedy: `#print axioms` wraps long lines, and a
          # single-line regex silently drops the wrapped listings (run #5:
          # two declarations reported "no axiom listing" despite being in
          # the log). Reproduced against run #5's verbatim axioms.txt.
          listings = re.findall(r"'?([\w.]+)'? depends on axioms: \[(.*?)\]", txt, re.DOTALL)
          found = {name: set() for name in decls}
          for name, ax in listings:
              if name in found:
                  found[name] = {a.strip().strip("'") for a in ax.split(',') if a.strip()}
          ok = True
          for name in decls:
              if not found[name]:
                  print(f'FAIL: no axiom listing for {name}')
                  ok = False
                  continue
              extra = found[name] - allow
              print(f'{name}: axioms={sorted(found[name])}')
              if extra:
                  print(f'  FAIL: axioms outside allowlist: {sorted(extra)}')
                  ok = False
          if 'sorryAx' in txt:
              print('FAIL: sorryAx present -- an unproved sorry leaked into the closure')
              ok = False
          print('PASS: all four within allowlist' if ok else 'FAIL: see above')
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headline-forge-evidence
          path: |
            axioms.txt
            build.log
            OAI_COMMIT

      - name: Leave shared checkout clean (meta-rule)
        if: always()
        run: |
          # Self-heal: never leave sparse-checkout (or other persistent git
          # state) behind in the shared self-hosted workspace -- see the
          # META-RULE comment on the checkout step above.
          # NOTE: never set `working-directory` on this step -- the default
          # step directory is already the repo checkout, so a repo-name value
          # re-roots under the checkout (fragile-proof-audit/fragile-proof-audit)
          # and the step dies before running anything (headline run #4).
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true
