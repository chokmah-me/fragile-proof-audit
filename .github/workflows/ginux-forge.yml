name: ginux-forge

# One-shot V-A verification leg for the Ginux audit
# (PIN: incoming/ginux/PIN.md; Zenodo report 10.5281/zenodo.23682548).
# Deleted after the receipt is recorded.
# Clones gmkurtzer/ginux at the paper's evaluated commit, installs the
# documented prerequisites (Rust 1.99.0 via rustup, clang, QEMU x86-64,
# OVMF), runs make doctor, then the V-A gates from the PIN.
# Fail-closed verdict: PASS iff the pin checkout is exact, doctor
# passes, and every expected-pass gate exits 0:
#   build, check, test-alpine, test-rocky-shell, test-multi-domain,
#   test-rocky-systemd, test-storage.
# make test-linux-runtime is the aggregate verification-boot gate; the
# repo itself discloses a failure there at the pin (post-exec
# system-supervisor lifecycle probe, docs/PERFORMANCE.md), so it is
# RECORD-ONLY: its exit code is reported, never counted for or
# against the verdict, and an unexpected pass is reported as such.
# The accelerator the project's own scripts select (kvm if /dev/kvm
# is read-writable, else tcg) is recorded in the verdict; tcg is a
# legitimate upstream configuration, not a failure.
# Runner-first rule overflow lane: [self-hosted, laptop] only.

on:
  workflow_dispatch:

concurrency:
  group: ginux-forge-laptop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pre-dispatch checks on this workflow
        run: python3 scripts/harness/pre_dispatch_checks.py --workflows .github/workflows/ginux-forge.yml

  forge:
    needs: gate
    runs-on: [self-hosted, laptop]
    timeout-minutes: 360
    env:
      PIN_SHA: "d11c126a048a51fe7eb9c4105f31760add1027ea"
      REPO_URL: "https://github.com/gmkurtzer/ginux.git"
    steps:
      - name: Runner and clock check
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          rm -rf "$EV"
          mkdir -p "$EV"
          srv_hdr="$(curl -sI --max-time 30 https://github.com | tr -d '\r' | sed -n 's/^[Dd]ate: //p' | head -1)"
          run_epoch="$(date -u +%s)"
          srv_epoch=0
          if test -n "$srv_hdr"; then
            srv_epoch="$(date -u -d "$srv_hdr" +%s 2>/dev/null || echo 0)"
          fi
          skew=$(( run_epoch - srv_epoch ))
          abs_skew=$(( skew < 0 ? -skew : skew ))
          clock_ok=FAIL
          if test "$srv_epoch" -gt 0 && test "$abs_skew" -le 600; then clock_ok=ok; fi
          # Probe (run 40789619184): /dev/kvm EXISTS in this WSL guest with
          # vmx/ept visible and kvm_intel nested=Y, but the node is
          # root:kvm 0660 and the runner user is not in the kvm group, so
          # the project's accelerator check fell back to tcg in runs 1-2.
          # Opening the node for this session (passwordless sudo is
          # verified on this runner) lets doctor and the gates use kvm.
          # Session-scoped only: the node mode resets with the WSL guest.
          kvm_chmod=not-needed
          if test -e /dev/kvm && ! test -w /dev/kvm; then
            kvm_chmod=failed
            if sudo -n chmod 0666 /dev/kvm >> "$EV/install.log" 2>&1; then kvm_chmod=ok; fi
          fi
          accel=tcg
          if test -r /dev/kvm && test -w /dev/kvm; then accel=kvm; fi
          sudo_ok=FAIL
          if sudo -n true 2>/dev/null; then sudo_ok=ok; fi
          { echo "clock_ok=$clock_ok"
            echo "skew_seconds=$skew"
            echo "runner_epoch=$run_epoch"
            echo "server_epoch=$srv_epoch"
            echo "accelerator=$accel"
            echo "kvm_chmod=$kvm_chmod"
            echo "sudo_passwordless=$sudo_ok"
          } | tee "$EV/runner.txt"
          { echo "date: $(date -u +%FT%TZ)"
            echo "server_date: $srv_hdr"
            echo "runner: $RUNNER_NAME"
            uname -a
            df -h "$HOME" || true
            nproc || true
            free -h || true
          } | tee "$EV/host.log"
          if test "$clock_ok" != "ok"; then
            echo "RUNNER CLOCK UNVERIFIED OR SKEWED (skew=${skew}s); failing closed" >&2
            exit 1
          fi

      - name: Clone target at pin
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME"
          tip="$(git ls-remote "$REPO_URL" HEAD 2>/dev/null | awk '{print $1}')"
          ok=FAIL
          attempt=0
          while test "$attempt" -lt 3; do
            attempt=$(( attempt + 1 ))
            rm -rf ginux-target
            if git clone -q "$REPO_URL" ginux-target >> "$EV/clone.log" 2>&1; then
              if git -C ginux-target checkout -q "$PIN_SHA" >> "$EV/clone.log" 2>&1; then
                ok=ok; break
              fi
            fi
            echo "clone attempt $attempt failed $(date -u +%FT%TZ)" >> "$EV/clone.log"
            sleep 20
          done
          head_sha=""
          if test -d ginux-target/.git; then
            head_sha="$(git -C ginux-target rev-parse HEAD)"
          fi
          pin_ok=FAIL
          if test "$ok" = "ok" && test "$head_sha" = "$PIN_SHA"; then pin_ok=ok; fi
          { echo "pin_ok=$pin_ok"
            echo "clone_attempts=$attempt"
            echo "head_sha=$head_sha"
            echo "expected_sha=$PIN_SHA"
            echo "tip_at_dispatch=${tip:-unresolved}"
          } | tee "$EV/pin.txt"
          if test "$pin_ok" != "ok"; then
            echo "PIN CHECKOUT FAILED (head=$head_sha); failing closed" >&2
            exit 1
          fi

      - name: Install prerequisites and run doctor
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          export PATH="$HOME/.cargo/bin:$PATH"
          need_apt=0
          command -v qemu-system-x86_64 >/dev/null 2>&1 || need_apt=1
          command -v clang >/dev/null 2>&1 || need_apt=1
          test -f /usr/share/OVMF/OVMF_CODE.fd || test -f /usr/share/edk2/x64/OVMF_CODE.fd || need_apt=1
          if test "$need_apt" -eq 1; then
            if sudo -n true 2>/dev/null; then
              sudo -n apt-get update -qq >> "$EV/install.log" 2>&1
              sudo -n apt-get install -y -qq qemu-system-x86 ovmf clang make git curl >> "$EV/install.log" 2>&1
            else
              echo "prerequisites missing and sudo is not passwordless; cannot install" | tee -a "$EV/install.log"
            fi
          fi
          if ! command -v cargo >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs -o "$EV/rustup-init.sh" >> "$EV/install.log" 2>&1
            sh "$EV/rustup-init.sh" -y --profile minimal --default-toolchain 1.99.0 >> "$EV/install.log" 2>&1
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add --toolchain 1.99.0 x86_64-unknown-none x86_64-unknown-uefi >> "$EV/install.log" 2>&1 || true
          # Ginux tools/qemu/common.sh finds OVMF only at OVMF_CODE.fd /
          # OVMF_VARS.fd (or the env vars); Ubuntu's ovmf package ships only
          # the _4M names. Resolve whichever exists and export both in this
          # shell (for doctor) and via GITHUB_ENV (for the gate steps).
          for cand in /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/x64/OVMF_CODE.fd /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/edk2/x64/OVMF_CODE_4M.fd; do
            if test -f "$cand"; then export OVMF_CODE="$cand"; break; fi
          done
          for cand in /usr/share/OVMF/OVMF_VARS.fd /usr/share/edk2/x64/OVMF_VARS.fd /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/edk2/x64/OVMF_VARS_4M.fd; do
            if test -f "$cand"; then export OVMF_VARS="$cand"; break; fi
          done
          echo "OVMF_CODE=${OVMF_CODE:-MISSING}" | tee "$EV/ovmf.txt"
          echo "OVMF_VARS=${OVMF_VARS:-MISSING}" | tee -a "$EV/ovmf.txt"
          if test -n "${OVMF_CODE:-}"; then echo "OVMF_CODE=$OVMF_CODE" >> "$GITHUB_ENV"; fi
          if test -n "${OVMF_VARS:-}"; then echo "OVMF_VARS=$OVMF_VARS" >> "$GITHUB_ENV"; fi
          # DIAGNOSTIC (run 4, at the user's word): QEMU 8.2 on this runner
          # defaults intel-iommu aw-bits to 39, so SAGAW lacks the 48-bit
          # bit Ginux's fail-closed IOMMU gate requires (runs 2-3 panicked
          # identically under tcg and kvm). QEMU >= 9.2 defaults aw-bits
          # to 48. This wrapper, reached through Ginux's own find_qemu()
          # hook ($QEMU_SYSTEM_X86_64 in tools/qemu/common.sh, used by
          # run.sh and doctor.sh), adds the width property to the
          # intel-iommu device argument. Upstream code is untouched; the
          # deviation is harness-side, logged per invocation, and must be
          # disclosed wherever run 4 evidence is used. NOT an as-shipped
          # V-A pass.
          mkdir -p "$HOME/ginux-qemu-wrap"
          props="$(qemu-system-x86_64 -device intel-iommu,help 2>&1 || true)"
          awprop=""
          if echo "$props" | grep -q 'intel-iommu\.aw-bits'; then
            awprop="aw-bits"
          elif echo "$props" | grep -q 'intel-iommu\.x-aw-bits'; then
            awprop="x-aw-bits"
          fi
          echo "aw_bits_property=${awprop:-NONE}" | tee "$EV/awbits.txt"
          if test -n "$awprop"; then
            cat > "$HOME/ginux-qemu-wrap/qemu-system-x86_64" <<WRAPEOF
          #!/usr/bin/env bash
          log="\$HOME/ginux-evidence/qemu-wrapper.log"
          out=()
          rewritten=0
          for a in "\$@"; do
            if test "\$a" = "intel-iommu,intremap=off"; then
              out+=("intel-iommu,intremap=off,$awprop=48")
              rewritten=1
            else
              out+=("\$a")
            fi
          done
          printf 'invoke rewritten=%s\n' "\$rewritten" >> "\$log" 2>/dev/null || true
          exec /usr/bin/qemu-system-x86_64 "\${out[@]}"
          WRAPEOF
            chmod +x "$HOME/ginux-qemu-wrap/qemu-system-x86_64"
            export QEMU_SYSTEM_X86_64="$HOME/ginux-qemu-wrap/qemu-system-x86_64"
            echo "QEMU_SYSTEM_X86_64=$QEMU_SYSTEM_X86_64" >> "$GITHUB_ENV"
            sha256sum "$QEMU_SYSTEM_X86_64" | tee -a "$EV/awbits.txt"
          fi
          { cargo --version || echo "cargo: MISSING"
            rustc --version || echo "rustc: MISSING"
            clang --version || echo "clang: MISSING"
            qemu-system-x86_64 --version || echo "qemu: MISSING"
          } | tee "$EV/tools.log"
          cd "$HOME/ginux-target"
          doctor_rc=0
          make doctor > "$EV/doctor.log" 2>&1 || doctor_rc=$?
          echo "doctor_exit=$doctor_rc" | tee "$EV/doctor.txt"
          cat "$EV/doctor.log"
          if test "$doctor_rc" -ne 0; then
            echo "MAKE DOCTOR FAILED rc=$doctor_rc; failing closed (infrastructure, not a claim verdict)" >&2
            echo "--- install.log (tail) ---" >&2
            tail -n 100 "$EV/install.log" >&2 || true
            exit 1
          fi

      - name: Gate build
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 2700 make build > "$EV/gate-build.log" 2>&1 || rc=$?
          echo "build rc=$rc seconds=$(( $(date +%s) - start ))" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-build.log"
          if test "$rc" -ne 0; then echo "::error::gate build FAILED rc=$rc"; fi
          exit 0

      - name: Gate check
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 2700 make check > "$EV/gate-check.log" 2>&1 || rc=$?
          echo "check rc=$rc seconds=$(( $(date +%s) - start ))" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-check.log"
          if test "$rc" -ne 0; then echo "::error::gate check FAILED rc=$rc"; fi
          exit 0

      - name: Gate test-linux-runtime (aggregate, record-only)
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 2700 make test-linux-runtime > "$EV/gate-test-linux-runtime.log" 2>&1 || rc=$?
          echo "test-linux-runtime rc=$rc seconds=$(( $(date +%s) - start )) record_only=1" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-test-linux-runtime.log"
          echo "record-only gate: rc=$rc (disclosed failure expected at pin; not counted in verdict)"
          exit 0

      - name: Gate test-alpine
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 2700 make test-alpine > "$EV/gate-test-alpine.log" 2>&1 || rc=$?
          echo "test-alpine rc=$rc seconds=$(( $(date +%s) - start ))" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-test-alpine.log"
          if test "$rc" -ne 0; then echo "::error::gate test-alpine FAILED rc=$rc"; fi
          exit 0

      - name: Gate test-rocky-shell
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 2700 make test-rocky-shell > "$EV/gate-test-rocky-shell.log" 2>&1 || rc=$?
          echo "test-rocky-shell rc=$rc seconds=$(( $(date +%s) - start ))" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-test-rocky-shell.log"
          if test "$rc" -ne 0; then echo "::error::gate test-rocky-shell FAILED rc=$rc"; fi
          exit 0

      - name: Gate test-multi-domain
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 2700 make test-multi-domain > "$EV/gate-test-multi-domain.log" 2>&1 || rc=$?
          echo "test-multi-domain rc=$rc seconds=$(( $(date +%s) - start ))" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-test-multi-domain.log"
          if test "$rc" -ne 0; then echo "::error::gate test-multi-domain FAILED rc=$rc"; fi
          exit 0

      - name: Gate test-rocky-systemd
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 5400 make test-rocky-systemd > "$EV/gate-test-rocky-systemd.log" 2>&1 || rc=$?
          echo "test-rocky-systemd rc=$rc seconds=$(( $(date +%s) - start ))" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-test-rocky-systemd.log"
          if test "$rc" -ne 0; then echo "::error::gate test-rocky-systemd FAILED rc=$rc"; fi
          exit 0

      - name: Gate test-storage
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          cd "$HOME/ginux-target"
          rc=0
          start=$(date +%s)
          timeout 2700 make test-storage > "$EV/gate-test-storage.log" 2>&1 || rc=$?
          echo "test-storage rc=$rc seconds=$(( $(date +%s) - start ))" >> "$EV/results.txt"
          tail -n 30 "$EV/gate-test-storage.log"
          if test "$rc" -ne 0; then echo "::error::gate test-storage FAILED rc=$rc"; fi
          exit 0

      - name: Verdict (fail-closed)
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/ginux-evidence"
          verdict=PASS
          detail=""
          for g in build check test-alpine test-rocky-shell test-multi-domain test-rocky-systemd test-storage; do
            line="$(grep -E "^$g rc=" "$EV/results.txt" 2>/dev/null | tail -1)"
            if test -z "$line"; then
              verdict=FAIL; detail="$detail $g=MISSING"
            elif echo "$line" | grep -q "rc=0"; then
              detail="$detail $g=ok"
            else
              verdict=FAIL; detail="$detail $g=$line"
            fi
          done
          agg="$(grep -E '^test-linux-runtime rc=' "$EV/results.txt" 2>/dev/null | tail -1)"
          accel="$(sed -n 's/^accelerator=//p' "$EV/runner.txt" 2>/dev/null | tail -1)"
          { echo "verdict=$verdict"
            echo "gates:$detail"
            echo "aggregate_record_only: $agg"
            echo "accelerator=${accel:-unknown}"
            echo "pin_sha=$PIN_SHA"
          } | tee "$EV/verdict.txt"
          if test "$verdict" != "PASS"; then
            echo "V-A VERDICT: FAIL (see gate lines above); failing closed" >&2
            exit 1
          fi
          echo "V-A VERDICT: PASS"

      - name: Stage evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$GITHUB_WORKSPACE/ginux-evidence"
          mkdir -p "$GITHUB_WORKSPACE/ginux-evidence"
          cp "$HOME"/ginux-evidence/* "$GITHUB_WORKSPACE/ginux-evidence/" 2>/dev/null || true
          if test -d "$HOME/ginux-target/build/qemu"; then
            for f in "$HOME"/ginux-target/build/qemu/*.log; do
              test -f "$f" || continue
              tail -n 500 "$f" > "$GITHUB_WORKSPACE/ginux-evidence/qemu-$(basename "$f")" || true
            done
          fi
          ls "$GITHUB_WORKSPACE/ginux-evidence" || true
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ginux-forge-evidence
          path: ginux-evidence
          if-no-files-found: warn
