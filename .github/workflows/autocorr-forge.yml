name: autocorr-forge

# One-shot independent build leg for the minimum-autocorrelation harvest
# audit (Chen & Gu, arXiv:2610.18888v1). Deleted after the receipt is
# recorded. The target is not a git repo: it is the arXiv e-print bundle,
# hash-pinned below. Fail-closed verdict: PASS iff tarball sha256 ok +
# PDF sha256 ok + authors' SOURCE_SHA256SUMS 67/67 ok + toolchain file
# and installed lean both 4.19.0 + Mathlib rev pin ok + runner clock
# verified twice + comment-stripped sorry/admit scan zero + escape scan
# zero + scan covered exactly the 41 pinned .lean files + Mathlib cache
# verified landed + lake build exit 0 + both audit files run exit 0 +
# all 30 audited theorems present in the axiom output and every axiom
# set inside the classical allowlist [propext, Classical.choice,
# Quot.sound].
# Heavy lane per the runner-first rule: [self-hosted, desktop] only.

on:
  workflow_dispatch:

# Serialize dispatches of this one-shot forge: two runs must never share
# the runner's $HOME evidence/target directories at the same time.
concurrency:
  group: autocorr-forge-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forge:
    runs-on: [self-hosted, desktop]
    timeout-minutes: 330
    env:
      TARBALL_SHA256: "98aeea11e3a6f6c7bf07497aaaeffca6b763f171104d36d70b3f88be1450df9a"
      PDF_SHA256: "7c28180faabfcc129e404b04fef56fe880d6fb0d4e96708196b5bea6c347947b"
      MATHLIB_REV: "c44e0c8ee63ca166450922a373c7409c5d26b00b"
      LEAN_NUM_THREADS: "8"
    steps:
      - name: Probe runner + clock check
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/autocorr-evidence"
          rm -rf "$EV"
          mkdir -p "$EV"
          srv_hdr="$(curl -sI --max-time 30 https://github.com | tr -d '\r' | sed -n 's/^[Dd]ate: //p' | head -1)"
          run_epoch="$(date -u +%s)"
          srv_epoch=0
          if test -n "$srv_hdr"; then
            srv_epoch="$(date -u -d "$srv_hdr" +%s 2>/dev/null || echo 0)"
          fi
          skew=$(( run_epoch - srv_epoch ))
          abs_skew=$(( skew < 0 ? -skew : skew ))
          clock_ok=FAIL
          if test "$srv_epoch" -gt 0 && test "$abs_skew" -le 600; then clock_ok=ok; fi
          { echo "clock_ok=$clock_ok"
            echo "skew_seconds=$skew"
            echo "runner_epoch=$run_epoch"
            echo "server_epoch=$srv_epoch"
          } | tee "$EV/clock.txt"
          { echo "date: $(date -u +%FT%TZ)"
            echo "server_date: $srv_hdr"
            echo "runner: $RUNNER_NAME"
            uname -a
            df -h "$HOME" | tail -1
            free -g | head -2 || true
            (command -v elan && elan --version) || echo "elan: MISSING"
            ls "$HOME/.elan/toolchains" 2>/dev/null || true
          } | tee "$EV/probe.log"
          if test "$clock_ok" != "ok"; then
            echo "RUNNER CLOCK UNVERIFIED OR SKEWED (skew=${skew}s); failing closed" >&2
            exit 1
          fi

      - name: Fetch target bundle at pin
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/autocorr-evidence"
          cd "$HOME"
          rm -rf autocorr-target autocorr-dl
          mkdir -p autocorr-dl
          ok=FAIL
          attempt=0
          while test "$attempt" -lt 3; do
            attempt=$(( attempt + 1 ))
            echo "=== download attempt $attempt $(date -u +%FT%TZ) ===" | tee -a "$EV/download.log"
            curl -fL --max-time 600 -o autocorr-dl/eprint.tar.gz https://arxiv.org/e-print/2610.18888 >> "$EV/download.log" 2>&1 || true
            curl -fL --max-time 600 -o autocorr-dl/paper.pdf https://arxiv.org/pdf/2610.18888 >> "$EV/download.log" 2>&1 || true
            got_t="$(sha256sum autocorr-dl/eprint.tar.gz 2>/dev/null | awk '{print $1}')"
            got_p="$(sha256sum autocorr-dl/paper.pdf 2>/dev/null | awk '{print $1}')"
            echo "attempt $attempt tarball_sha=$got_t pdf_sha=$got_p" | tee -a "$EV/download.log"
            if test "$got_t" = "$TARBALL_SHA256" && test "$got_p" = "$PDF_SHA256"; then ok=ok; break; fi
            sleep 20
          done
          { echo "bundle_ok=$ok"
            echo "download_attempts=$attempt"
            echo "tarball_sha256=${got_t:-none}"
            echo "pdf_sha256=${got_p:-none}"
          } | tee "$EV/bundle.txt"
          if test "$ok" != "ok"; then
            echo "BUNDLE PIN MISMATCH after $attempt attempts; failing closed" >&2
            exit 1
          fi
          mkdir -p autocorr-target
          tar -xzf autocorr-dl/eprint.tar.gz -C autocorr-target
          test -d autocorr-target/anc/lean
          test -f autocorr-target/anc/lean/lean-toolchain
          cd autocorr-target/anc/lean
          sha256sum -c SOURCE_SHA256SUMS.txt > "$EV/sums-detail.txt" 2>&1 || true
          ok_lines="$(grep -c ': OK$' "$EV/sums-detail.txt" || true)"
          total_lines="$(grep -c '' SOURCE_SHA256SUMS.txt || true)"
          { echo "sums_ok=$ok_lines"
            echo "sums_total=$total_lines"
          } | tee "$EV/sums.txt"
          if test "$ok_lines" != "67" || test "$total_lines" != "67"; then
            echo "SOURCE SUMS NOT 67/67 (ok=$ok_lines total=$total_lines); failing closed" >&2
            exit 1
          fi

      - name: Pins and toolchain
        shell: bash
        run: |
          set -uo pipefail
          cd "$HOME/autocorr-target/anc/lean"
          EV="$HOME/autocorr-evidence"
          tc="$(tr -d '\r' < lean-toolchain)"
          { echo "target=arXiv:2610.18888v1 e-print bundle (anc/lean project)"
            echo "toolchain_file=$tc"
            echo "manifest_sha256:"
            sha256sum lake-manifest.json
            echo "lane=[self-hosted, desktop]"
          } | tee "$EV/pins.txt"
          pin_ok=FAIL
          if test "$tc" = "leanprover/lean4:v4.19.0"; then pin_ok=ok; fi
          rev_ok=FAIL
          if grep -q "$MATHLIB_REV" lakefile.toml && grep -q "$MATHLIB_REV" lake-manifest.json; then rev_ok=ok; fi
          { echo "pin_ok=$pin_ok"
            echo "mathlib_rev_ok=$rev_ok"
          } > "$EV/pin.txt"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.19.0 > "$EV/toolchain-install.log" 2>&1 || true
          lean --version 2>&1 | tee "$EV/lean-version.log" || true
          if grep -qE "version 4\.19\.0," "$EV/lean-version.log"; then
            echo "toolchain_ok=ok" >> "$EV/pin.txt"
          else
            echo "toolchain_ok=FAIL" >> "$EV/pin.txt"
          fi
          cat "$EV/pin.txt"
          grep -q "FAIL" "$EV/pin.txt" && echo "::error::pin/toolchain check FAILED (verdict will BREAK)" || true
          lake --version 2>&1 | tee "$EV/lake-version.log" || true

      - name: Source scans (pre-build, project tree only)
        shell: bash
        run: |
          set -uo pipefail
          cd "$HOME/autocorr-target/anc/lean"
          EV="$HOME/autocorr-evidence"
          python3 - "$EV" <<'PYEOF'
          import os, re, sys
          ev = sys.argv[1]
          def strip_comments(src):
              out = []
              i, n, depth = 0, len(src), 0
              in_str = False
              while i < n:
                  c = src[i]
                  nxt = src[i+1] if i + 1 < n else ""
                  if depth > 0:
                      if c == "/" and nxt == "-":
                          depth += 1; i += 2; continue
                      if c == "-" and nxt == "/":
                          depth -= 1; i += 2; continue
                      if c == "\n": out.append("\n")
                      i += 1; continue
                  if in_str:
                      out.append(c)
                      if c == "\\":
                          if i + 1 < n: out.append(src[i+1]); i += 2; continue
                      elif c == '"': in_str = False
                      i += 1; continue
                  if c == "/" and nxt == "-":
                      depth = 1; i += 2; continue
                  if c == "-" and nxt == "-":
                      while i < n and src[i] != "\n": i += 1
                      continue
                  if c == '"': in_str = True
                  out.append(c); i += 1
              return "".join(out)
          sorry_hits, escape_hits = [], []
          esc = re.compile(r"@\[extern|implemented_by|\bunsafe\b|partial\s+def|ofReduceBool|native_decide")
          files = []
          for dp, dn, fn in os.walk("."):
              dn[:] = [d for d in dn if d != ".lake"]
              for f in fn:
                  if f.endswith(".lean"): files.append(os.path.join(dp, f))
          for path in files:
              src = open(path, encoding="utf-8", errors="ignore").read()
              code = strip_comments(src)
              for m in re.finditer(r"\b(sorry|admit)\b", code):
                  line = code[:m.start()].count("\n") + 1
                  sorry_hits.append(f"{path}:{line}:{m.group(1)}")
              for m in esc.finditer(code):
                  line = code[:m.start()].count("\n") + 1
                  escape_hits.append(f"{path}:{line}:{m.group(0)}")
          with open(os.path.join(ev, "scan.txt"), "w") as fh:
              fh.write(f"files_scanned={len(files)}\n")
              fh.write(f"sorry_hits={len(sorry_hits)}\n")
              for h in sorry_hits: fh.write("SORRY " + h + "\n")
              fh.write(f"escape_hits={len(escape_hits)}\n")
              for h in escape_hits: fh.write("ESCAPE " + h + "\n")
          print(f"files={len(files)} sorry={len(sorry_hits)} escapes={len(escape_hits)}")
          PYEOF
          cat "$EV/scan.txt" | head -20
          grep -Eq '^(sorry_hits|escape_hits)=[1-9]' "$EV/scan.txt" && echo "::error::scan hits present (verdict will BREAK)" || true

      - name: Stage early evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$GITHUB_WORKSPACE/autocorr-evidence-early"
          mkdir -p "$GITHUB_WORKSPACE/autocorr-evidence-early"
          for f in probe.log clock.txt download.log bundle.txt sums.txt sums-detail.txt pins.txt pin.txt lean-version.log lake-version.log toolchain-install.log scan.txt; do
            cp "$HOME/autocorr-evidence/$f" "$GITHUB_WORKSPACE/autocorr-evidence-early/" 2>/dev/null || true
          done
          ls "$GITHUB_WORKSPACE/autocorr-evidence-early" || true

      - name: Upload early evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocorr-forge-evidence-early
          path: autocorr-evidence-early
          if-no-files-found: warn

      - name: Fetch Mathlib cache (fail-closed)
        shell: bash
        run: |
          set -uo pipefail
          cd "$HOME/autocorr-target/anc/lean"
          export PATH="$HOME/.elan/bin:$PATH"
          EV="$HOME/autocorr-evidence"
          rc=1
          attempt=0
          while test "$attempt" -lt 2; do
            attempt=$(( attempt + 1 ))
            rc=0
            echo "=== cache attempt $attempt $(date -u +%FT%TZ) ===" >> "$EV/cache-get.log"
            lake exe cache get >> "$EV/cache-get.log" 2>&1 || rc=$?
            echo "cache attempt $attempt exit=$rc"
            if test "$rc" -eq 0; then break; fi
            sleep 30
          done
          mathlib_oleans=0
          if test -d .lake/packages/mathlib; then
            mathlib_oleans="$(find .lake/packages/mathlib -name '*.olean' | wc -l)"
          fi
          total_oleans="$(find .lake -name '*.olean' | wc -l)"
          { echo "CACHE_EXIT:$rc"
            echo "cache_attempts=$attempt"
            echo "mathlib_oleans=$mathlib_oleans"
            echo "total_oleans=$total_oleans"
          } | tee "$EV/cache-exit.txt"
          tail -10 "$EV/cache-get.log" || true
          if test "$rc" -ne 0; then
            echo "CACHE FETCH FAILED (exit $rc); failing closed" >&2
            exit 1
          fi
          if test "$mathlib_oleans" -lt 1000; then
            echo "CACHE INCOMPLETE (mathlib_oleans=$mathlib_oleans < 1000); failing closed" >&2
            exit 1
          fi

      - name: Clock check (pre-build)
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/autocorr-evidence"
          srv_hdr="$(curl -sI --max-time 30 https://github.com | tr -d '\r' | sed -n 's/^[Dd]ate: //p' | head -1)"
          run_epoch="$(date -u +%s)"
          srv_epoch=0
          if test -n "$srv_hdr"; then
            srv_epoch="$(date -u -d "$srv_hdr" +%s 2>/dev/null || echo 0)"
          fi
          skew=$(( run_epoch - srv_epoch ))
          abs_skew=$(( skew < 0 ? -skew : skew ))
          clock_ok=FAIL
          if test "$srv_epoch" -gt 0 && test "$abs_skew" -le 600; then clock_ok=ok; fi
          { echo "clock_ok=$clock_ok"
            echo "skew_seconds=$skew"
            echo "runner_epoch=$run_epoch"
            echo "server_epoch=$srv_epoch"
          } | tee "$EV/clock2.txt"
          if test "$clock_ok" != "ok"; then
            echo "RUNNER CLOCK UNVERIFIED OR SKEWED (skew=${skew}s); failing closed" >&2
            exit 1
          fi

      - name: Build library
        shell: bash
        run: |
          set -uo pipefail
          cd "$HOME/autocorr-target/anc/lean"
          export PATH="$HOME/.elan/bin:$PATH"
          EV="$HOME/autocorr-evidence"
          rc=0
          start=$(date +%s)
          lake build > "$EV/build.log" 2>&1 || rc=$?
          { echo "build_seconds=$(( $(date +%s) - start ))"
            echo "BUILD_EXIT:$rc"
          } | tee "$EV/build-exit.txt"
          if test "$rc" -ne 0; then echo "::error::BUILD FAILED rc=$rc (verdict will BREAK)"; fi
          tail -5 "$EV/build.log" || true

      - name: Show build + cache tails
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/autocorr-evidence"
          srv_hdr="$(curl -sI --max-time 30 https://github.com | tr -d '\r' | sed -n 's/^[Dd]ate: //p' | head -1)"
          run_epoch="$(date -u +%s)"
          srv_epoch=0
          if test -n "$srv_hdr"; then
            srv_epoch="$(date -u -d "$srv_hdr" +%s 2>/dev/null || echo 0)"
          fi
          if test "$srv_epoch" -gt 0; then
            echo "skew_seconds=$(( run_epoch - srv_epoch ))" | tee "$EV/clock3.txt"
          else
            echo "skew_seconds=unverified" | tee "$EV/clock3.txt"
          fi
          echo "=== cache-exit.txt ==="
          cat "$EV/cache-exit.txt" || echo "cache-exit.txt MISSING"
          echo "=== cache-get.log (tail 10) ==="
          tail -10 "$EV/cache-get.log" || echo "cache-get.log MISSING"
          echo "=== build-exit.txt ==="
          cat "$EV/build-exit.txt" || echo "build-exit.txt MISSING (build step did not complete)"
          echo "=== build.log (tail 30) ==="
          tail -30 "$EV/build.log" || echo "build.log MISSING"

      - name: Axiom audit (authors' Audit.lean + FiniteAudit.lean)
        shell: bash
        run: |
          set -uo pipefail
          cd "$HOME/autocorr-target/anc/lean"
          export PATH="$HOME/.elan/bin:$PATH"
          EV="$HOME/autocorr-evidence"
          rc=0
          lake env lean Audit.lean > "$EV/axioms.log" 2>&1 || rc=$?
          echo "AXIOM_AUDIT_EXIT:$rc" | tee "$EV/axiom-audit-exit.txt"
          rc2=0
          lake env lean FiniteAudit.lean > "$EV/axioms-finite.log" 2>&1 || rc2=$?
          echo "FINITE_AUDIT_EXIT:$rc2" | tee "$EV/finite-audit-exit.txt"
          if test "$rc" -ne 0; then echo "::error::AXIOM AUDIT FAILED rc=$rc (verdict will BREAK)"; fi
          if test "$rc2" -ne 0; then echo "::error::FINITE AUDIT FAILED rc=$rc2 (verdict will BREAK)"; fi
          cat "$EV/axioms.log"
          cat "$EV/axioms-finite.log"

      - name: Verdict (fail-closed)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          EV="$HOME/autocorr-evidence"
          python3 - "$EV" <<'PYEOF'
          import os, re, sys
          ev = sys.argv[1]
          def read(name, default=""):
              p = os.path.join(ev, name)
              return open(p, encoding="utf-8", errors="replace").read() if os.path.exists(p) else default
          def has_line(name, line):
              return re.search(r"^" + re.escape(line) + r"$", read(name), re.M) is not None
          fails = []
          if not has_line("clock.txt", "clock_ok=ok"): fails.append("clock_probe")
          if not has_line("clock2.txt", "clock_ok=ok"): fails.append("clock_prebuild")
          if not has_line("bundle.txt", "bundle_ok=ok"): fails.append("bundle_pin")
          if not has_line("sums.txt", "sums_ok=67"): fails.append("source_sums_ok")
          if not has_line("sums.txt", "sums_total=67"): fails.append("source_sums_total")
          if not has_line("pin.txt", "pin_ok=ok"): fails.append("pin")
          if not has_line("pin.txt", "mathlib_rev_ok=ok"): fails.append("mathlib_rev")
          if not has_line("pin.txt", "toolchain_ok=ok"): fails.append("toolchain")
          scan = read("scan.txt")
          m = re.search(r"^files_scanned=(\d+)$", scan, re.M)
          if not m or int(m.group(1)) != 41: fails.append("scan_vacuity")
          m = re.search(r"^sorry_hits=(\d+)$", scan, re.M)
          if not m or int(m.group(1)) != 0: fails.append("sorry_scan")
          m = re.search(r"^escape_hits=(\d+)$", scan, re.M)
          if not m or int(m.group(1)) != 0: fails.append("escape_scan")
          cache = read("cache-exit.txt")
          if not has_line("cache-exit.txt", "CACHE_EXIT:0"): fails.append("cache_exit")
          m = re.search(r"^mathlib_oleans=(\d+)$", cache, re.M)
          if not m or int(m.group(1)) < 1000: fails.append("cache_oleans")
          m3 = re.search(r"^skew_seconds=(-?\d+)$", read("clock3.txt"), re.M)
          if m3 and abs(int(m3.group(1))) > 3600: fails.append("clock_postbuild")
          if not has_line("build-exit.txt", "BUILD_EXIT:0"): fails.append("build")
          if not has_line("axiom-audit-exit.txt", "AXIOM_AUDIT_EXIT:0"): fails.append("axiom_audit_run")
          if not has_line("finite-audit-exit.txt", "FINITE_AUDIT_EXIT:0"): fails.append("finite_audit_run")
          log = read("axioms.log") + "\n" + read("axioms-finite.log")
          flat = re.sub(r"\n\s+", " ", log)
          names = [
            "Autocorrelation.DRR_identity",
            "Autocorrelation.P_bounds",
            "Autocorrelation.P_matches_paper",
            "Autocorrelation.P_monotoneOn",
            "Autocorrelation.autocorrelation_product_lower",
            "Autocorrelation.explicit_main",
            "Autocorrelation.explicit_ratio_gt",
            "Autocorrelation.explicit_ratio_identity",
            "Autocorrelation.finite_certificate",
            "Autocorrelation.g0_expansion",
            "Autocorrelation.g0_g1_match",
            "Autocorrelation.g1_expansion",
            "Autocorrelation.g1_g2_match",
            "Autocorrelation.g2_expansion",
            "Autocorrelation.g2_g3_match",
            "Autocorrelation.g3_expansion",
            "Autocorrelation.hasDerivAt_I",
            "Autocorrelation.hasDerivAt_P",
            "Autocorrelation.hasDerivAt_RR",
            "Autocorrelation.integral_P",
            "Autocorrelation.integral_PP",
            "Autocorrelation.limiting_main",
            "Autocorrelation.limiting_ratio_gt",
            "Autocorrelation.limiting_ratio_identity",
            "Autocorrelation.mass_integral",
            "Autocorrelation.monotone_extension_comparison",
            "Autocorrelation.overlap_integral",
            "Autocorrelation.relaxation_mass_arithmetic",
            "Autocorrelation.uniform_correlation",
            "Autocorrelation.witness_admissibility",
          ]
          allow = {"propext", "Classical.choice", "Quot.sound"}
          depends, noax = {}, set()
          for mm in re.finditer(r"'([^']+)' depends on axioms: \[([^\]]*)\]", flat):
              depends.setdefault(mm.group(1), set()).update(
                  a.strip() for a in mm.group(2).split(",") if a.strip())
          for mm in re.finditer(r"'([^']+)' does not depend on any axioms", flat):
              noax.add(mm.group(1))
          found = {}
          for n in set(depends) | noax:
              if n in depends and n in noax:
                  fails.append(f"axioms_conflict:{n}")
                  found[n] = depends[n]
              elif n in depends:
                  found[n] = depends[n]
              else:
                  found[n] = set()
          for n in names:
              if n not in found:
                  fails.append(f"axioms_missing:{n}")
              elif not found[n] <= allow:
                  fails.append(f"axioms_offlist:{n}:{sorted(found[n] - allow)}")
          verdict = "PASS" if not fails else "BREAK"
          m3 = re.search(r"skew_seconds=(-?\d+)", read("clock3.txt"))
          with open(os.path.join(ev, "verdict.txt"), "w") as fh:
              fh.write(f"verdict={verdict}\n")
              fh.write(f"clock_postbuild_skew_seconds={m3.group(1) if m3 else 'unknown'}\n")
              for f in fails: fh.write(f"fail={f}\n")
              for n in names:
                  if n in found: fh.write(f"axioms {n} = {sorted(found[n])}\n")
          print(verdict, fails)
          sys.exit(0 if not fails else 1)
          PYEOF
          vrc=$?
          echo "=== verdict.txt ==="
          cat "$EV/verdict.txt" || true
          exit $vrc

      - name: Stage evidence into workspace
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$GITHUB_WORKSPACE/autocorr-evidence"
          cp -r "$HOME/autocorr-evidence" "$GITHUB_WORKSPACE/autocorr-evidence" || true
          ls "$GITHUB_WORKSPACE/autocorr-evidence" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocorr-forge-evidence
          path: autocorr-evidence
          if-no-files-found: error
