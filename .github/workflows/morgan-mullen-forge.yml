name: morgan-mullen-forge

# Independent audit of the Morgan-Mullen Lean formalization
# (florian-hellwig/morgan-mullen at a pinned commit, arXiv:2610.36534):
# build the project on the HP lane, scan the sources, run the authors'
# Audit.lean and AuditDeep.lean as-is, and classify every printed axiom
# set against the permitted universe pinned in
# incoming/morgan-mullen/PIN.md (classical three +
# Lean.ofReduceBool + Lean.trustCompiler + the two declared literature
# axioms; sorryAx never). Fail-closed: any mismatch stops the run.
# One-shot workflow: deleted after the audit closes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morgan-mullen-forge
  cancel-in-progress: false

env:
  MM_COMMIT: 03fb9bd6c2605f7d4df111c154db14ed2f570b7b
  MM_REPO: https://github.com/florian-hellwig/morgan-mullen.git

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pre-dispatch checks on this workflow
        run: python3 scripts/harness/pre_dispatch_checks.py --workflows .github/workflows/morgan-mullen-forge.yml

  forge:
    needs: gate
    runs-on: [self-hosted, desktop]
    timeout-minutes: 330
    steps:
      - name: Runner probe
        continue-on-error: true
        run: |
          set +e
          echo "runner: $(hostname)"
          df -h "$HOME" || true
          free -h || true
          exit 0

      - name: Validate pinned commit
        run: |
          set -euo pipefail
          case "$MM_COMMIT" in
            ????????????????????????????????????????) ;;
            *) echo "FAIL: MM_COMMIT is not 40-hex"; exit 1 ;;
          esac
          case "$MM_COMMIT" in
            *[!0-9a-f]*) echo "FAIL: MM_COMMIT is not 40-hex"; exit 1 ;;
          esac
          echo "pin ok: $MM_COMMIT"

      - name: Install elan
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Clone at the pin and verify in-tree hashes
        run: |
          set -euo pipefail
          mkdir -p evidence
          rm -rf mm-src
          git clone "$MM_REPO" mm-src
          cd mm-src
          git checkout "$MM_COMMIT"
          got_head=$(git rev-parse HEAD)
          echo "HEAD: $got_head (expect $MM_COMMIT)" | tee ../evidence/pins.txt
          [ "$got_head" = "$MM_COMMIT" ] || { echo "FAIL: HEAD mismatch"; exit 1; }
          cat > ../evidence/expected.sha256 <<'EOF'
          d5edba4e4b8faad9c1baeadb265716d20d03be4d1a2647dc5e35b0c0325bea7b  lean-toolchain
          f5a2366ca278c3aa1c94cb4ca6deb6b346481dd0ca2dd82dca26fde37699a19a  lakefile.toml
          797e133c7b78dbd75cee03f104f6278c66d6538166d63866d9c62270043947bb  lake-manifest.json
          171d8b863279d3a31691afbe17c09cc7e514c4aefd386a87229a54f165537350  AXIOMS_AUDIT.txt
          2cdd97d8073420625e8741db43023bbe11c64438bc1d9d819b18e26818365810  Audit.lean
          374c1c1ff43cb39a9c27968a24aceec75b09018934c53f125bbe2680a08bc4ac  AuditDeep.lean
          a680011e6d0baafe1a8da09b81e3df8be0ac6b526003a934cf173b49326727fc  MorganMullen/Axioms.lean
          EOF
          sha256sum -c ../evidence/expected.sha256 | tee -a ../evidence/pins.txt
          toolchain=$(cat lean-toolchain)
          echo "toolchain: $toolchain" | tee -a ../evidence/pins.txt
          [ "$toolchain" = "leanprover/lean4:v4.34.1" ] || { echo "FAIL: toolchain drift"; exit 1; }
          count=$(find . -name '*.lean' -not -path './.lake/*' | wc -l)
          echo "lean files: $count (expect 43)" | tee -a ../evidence/pins.txt
          [ "$count" -eq 43 ] || { echo "FAIL: lean file count drift"; exit 1; }

      - name: Source scans (sorry, admit, declared axioms)
        run: |
          set -euo pipefail
          cd mm-src
          if grep -rnw sorry MorganMullen/ MorganMullen.lean Audit.lean AuditDeep.lean; then
            echo "FAIL: sorry token in sources"; exit 1
          fi
          if grep -rnw admit MorganMullen/ MorganMullen.lean Audit.lean AuditDeep.lean; then
            echo "FAIL: admit token in sources"; exit 1
          fi
          echo "no sorry/admit tokens"
          grep -rn "^axiom " MorganMullen/ | tee ../evidence/declared-axioms.txt
          n=$(grep -rn "^axiom " MorganMullen/ | wc -l)
          [ "$n" -eq 2 ] || { echo "FAIL: expected exactly 2 declared axioms, got $n"; exit 1; }
          grep -q "garefalakis_kapetanakis" ../evidence/declared-axioms.txt || { echo "FAIL: garefalakis_kapetanakis declaration missing"; exit 1; }
          grep -q "rosser_schoenfeld_psi" ../evidence/declared-axioms.txt || { echo "FAIL: rosser_schoenfeld_psi declaration missing"; exit 1; }
          echo "declared axioms: exactly the two pinned literature axioms"

      - name: Mathlib cache and build
        run: |
          set -euo pipefail
          cd mm-src
          lake exe cache get
          echo "cache ok"
          lake build 2>&1 | tee ../evidence/build.log
          grep -q "Build completed successfully" ../evidence/build.log || { echo "FAIL: build did not complete"; exit 1; }
          if grep -n "sorry" ../evidence/build.log; then
            echo "FAIL: sorry mentioned in build log"; exit 1
          fi
          grep -q "Build completed successfully (3672 jobs)" ../evidence/build.log || { echo "FAIL: job count differs from the authors' pinned 3672"; exit 1; }
          echo "build ok: 3672 jobs, no sorry in log"

      - name: Authors Audit.lean as-is, exact axiom classification
        run: |
          set -euo pipefail
          cd mm-src
          lake env lean Audit.lean 2>&1 | tee ../evidence/audit.log
          python3 - <<'PY'
          import re, sys
          s = open("../evidence/audit.log", encoding="utf-8").read()
          got = {m.group(1): sorted(a.strip() for a in m.group(2).split(","))
                 for m in re.finditer(r"'([\w.]+)' depends on axioms: \[(.*?)\]", s, re.S)}
          std = ["Classical.choice", "Quot.sound", "propext"]
          comp = sorted(std + ["Lean.ofReduceBool", "Lean.trustCompiler",
                               "MorganMullen.rosser_schoenfeld_psi"])
          expected = {
              "MorganMullen.morgan_mullen": sorted(comp + ["MorganMullen.garefalakis_kapetanakis"]),
              "MorganMullen.hachenberger_lower_bound": comp,
              "MorganMullen.hachenberger_eq_iff": comp,
              "MorganMullen.pcn_sub_theta_cn_abs_le": std,
              "MorganMullen.pcn_error_le_star": comp,
              "MorganMullen.pcn_theta_cn": comp,
              "MorganMullen.pcn_ratio_tendsto_one": comp,
          }
          bad = False
          for name, exp in expected.items():
              if name not in got:
                  print(f"FAIL: no axiom list for {name} in Audit.lean output"); bad = True
              elif got[name] != exp:
                  print(f"FAIL: axiom list of {name} changed\n expected {exp}\n got      {got[name]}"); bad = True
              else:
                  print(f"{name}: exact match ({len(exp)} axioms)")
          extra = set(got) - set(expected)
          if extra:
              print(f"FAIL: unexpected declarations in Audit.lean output: {sorted(extra)}"); bad = True
          if bad:
              sys.exit(1)
          print("AUDIT CLASSIFICATION: all 7 exact")
          PY

      - name: Authors AuditDeep.lean as-is, trusted-base markers
        run: |
          set -euo pipefail
          cd mm-src
          lake env lean AuditDeep.lean 2>&1 | tee ../evidence/auditdeep.log
          grep -q 'constants reachable from morgan_mullen: 67982' ../evidence/auditdeep.log || { echo "FAIL: reachable-constant count drift"; exit 1; }
          grep -q 'checkers evaluated by `Lean.ofReduceBool` (25):' ../evidence/auditdeep.log || { echo "FAIL: checker count is not 25"; exit 1; }
          grep -q 'OK: no project constant used by a checker has' ../evidence/auditdeep.log || { echo "FAIL: deep-audit OK line missing (implemented_by/extern)"; exit 1; }
          grep -q 'declares exactly the axioms' ../evidence/auditdeep.log || { echo "FAIL: deep-audit declared-axiom line missing"; exit 1; }
          grep -q 'OK: all of them are among the 25 checkers of the main theorem' ../evidence/auditdeep.log || { echo "FAIL: Corollary 8.8 checker containment line missing"; exit 1; }
          grep -q 'OK: the checkers of Corollary 8.9 are among the 25 checkers of the main theorem' ../evidence/auditdeep.log || { echo "FAIL: Corollary 8.9 checker containment line missing"; exit 1; }
          echo "AuditDeep markers: all present"

      - name: Auditor superset (weight_le_Wq, Theorem 7.8)
        run: |
          set -euo pipefail
          cd mm-src
          cat > AuditExtra.lean <<'EOF'
          import MorganMullen
          #print axioms MorganMullen.weight_le_Wq
          EOF
          lake env lean AuditExtra.lean 2>&1 | tee ../evidence/audit-extra.log
          python3 - <<'PY'
          import re, sys
          s = open("../evidence/audit-extra.log", encoding="utf-8").read()
          m = re.search(r"'([\w.]+)' depends on axioms: \[(.*?)\]", s, re.S)
          if not m or m.group(1) != "MorganMullen.weight_le_Wq":
              print("FAIL: no axiom list for MorganMullen.weight_le_Wq"); sys.exit(1)
          got = sorted(a.strip() for a in m.group(2).split(","))
          permitted = {"Classical.choice", "Quot.sound", "propext",
                       "Lean.ofReduceBool", "Lean.trustCompiler",
                       "MorganMullen.garefalakis_kapetanakis",
                       "MorganMullen.rosser_schoenfeld_psi"}
          if not set(got) <= permitted:
              print(f"FAIL: weight_le_Wq uses axioms outside the permitted set: {sorted(set(got) - permitted)}"); sys.exit(1)
          if "sorryAx" in got:
              print("FAIL: weight_le_Wq depends on sorryAx"); sys.exit(1)
          if "MorganMullen.rosser_schoenfeld_psi" not in got:
              print("FAIL: weight_le_Wq does not use rosser_schoenfeld_psi as the paper states"); sys.exit(1)
          print(f"weight_le_Wq: subset of permitted set, RS present: {got}")
          PY

      - name: Verdict
        run: |
          set -euo pipefail
          {
            echo "FORGE-VERDICT: PASS"
            echo "All legs green: pins + in-tree hashes, source scans, build (3672 jobs),"
            echo "authors' Audit.lean exact classification (7 declarations),"
            echo "authors' AuditDeep.lean trusted-base markers, auditor superset subset check."
            echo "Permitted universe: classical three + Lean.ofReduceBool + Lean.trustCompiler"
            echo "+ MorganMullen.garefalakis_kapetanakis + MorganMullen.rosser_schoenfeld_psi. No sorryAx."
          } | tee evidence/verdict.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morgan-mullen-forge-evidence
          path: evidence/
