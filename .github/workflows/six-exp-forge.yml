name: six-exp-forge

# One-shot build + kernel axiom print for the strong-six-exponentials
# harvest triage (telaviv/strong-six-exponentials @ 1625bdf). NOT
# standing CI: delete this file once the receipt is recorded.
#
# Why this exists: the same procedure has run on the control-plane VM
# since 2026-10-20 (build-driver.sh in the triage tree) and never
# finished: the VM reboots roughly hourly, and the build sat at
# [9102/9124] for hours with its lean workers at ~4% CPU. At the user's
# word (2026-10-22, "off load this to the dell laptop") the job moves
# to the overflow lane ([self-hosted, laptop], Dell, 32 GB), per the
# runner-first build dispatch rule (2026-10-21): heavy Lean builds of
# external target repos run on the user's runners, never on the VM.
#
# Procedure (mirrors build-driver.sh exactly):
#   1. fresh clone of telaviv/strong-six-exponentials @ 1625bdf3
#      (asserted), toolchain leanprover/lean4:v4.35.0 (asserted);
#   2. lake exe cache get; lake build; lake env lean Axioms.lean,
#      each phase's exit code recorded, no phase aborting the next;
#   3. fail-closed verdict: all three exits 0 AND every #print axioms
#      list in axiom_print.out within {propext, Classical.choice,
#      Quot.sound} (or "does not depend on any axioms") AND both
#      headline theorems present (StrongSix.SixExp.six_exponentials,
#      StrongSix.M2.strongSixExponentials) AND no sorryAx anywhere.
#
# Harness rules: pins are literals (no dispatch inputs); the scratch
# dir lives in $HOME outside the shared checkout and is removed in an
# always() step; no `lake update`; exit codes are captured with
# `rc=0` + `cmd || rc=$?` (the runner forces bash -e; a bare rc=$?
# after a failing command never runs, AGENTS.md (24)).
# The verdict parser joins wrapped lines before reading an axiom
# list: Lean wraps long lists across physical lines (2026-10-22
# thomgame-build lesson).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: six-exp-forge
  cancel-in-progress: false

jobs:
  forge:
    runs-on: [self-hosted, laptop]
    timeout-minutes: 600
    steps:
      - name: Install elan if missing
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf --retry 5 --retry-delay 10 --retry-all-errors | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Clone pinned target repo; run cache, build, axiom print
        timeout-minutes: 540
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          D="$HOME/sixexp-1625bdf"
          rm -rf "$D"
          git clone https://github.com/telaviv/strong-six-exponentials.git "$D"
          git -C "$D" checkout 1625bdf3c0a7d9222bacd876d738d7540109bea6
          HEAD=$(git -C "$D" rev-parse HEAD)
          echo "cloned HEAD: $HEAD"
          [ "$HEAD" = "1625bdf3c0a7d9222bacd876d738d7540109bea6" ] || { echo "FAIL: HEAD != pin"; exit 1; }
          grep -qx 'leanprover/lean4:v4.35.0' "$D/lean-toolchain" || { echo "FAIL: toolchain file mismatch"; exit 1; }
          cd "$D"
          : > "$GITHUB_WORKSPACE/exits.txt"
          rc=0
          lake exe cache get > "$GITHUB_WORKSPACE/cache-get.log" 2>&1 || rc=$?
          echo "CACHE_EXIT:$rc" | tee -a "$GITHUB_WORKSPACE/exits.txt"
          rc=0
          lake build > "$GITHUB_WORKSPACE/build.log" 2>&1 || rc=$?
          echo "BUILD_EXIT:$rc" | tee -a "$GITHUB_WORKSPACE/exits.txt"
          rc=0
          lake env lean Axioms.lean > "$GITHUB_WORKSPACE/axiom_print.out" 2> "$GITHUB_WORKSPACE/axiom_print.err" || rc=$?
          echo "AXIOM_EXIT:$rc" | tee -a "$GITHUB_WORKSPACE/exits.txt"
          cat "$GITHUB_WORKSPACE/exits.txt"

      - name: Verdict (fail-closed)
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          import re, sys
          ws = __import__('os').environ['GITHUB_WORKSPACE']
          exits = {}
          for line in open(ws + '/exits.txt'):
              if ':' in line:
                  k, v = line.strip().split(':', 1)
                  exits[k] = int(v)
          ok = True
          for k in ('CACHE_EXIT', 'BUILD_EXIT', 'AXIOM_EXIT'):
              if exits.get(k) != 0:
                  print(f"FAIL: {k} = {exits.get(k)}")
                  ok = False
          out = open(ws + '/axiom_print.out').read()
          err = open(ws + '/axiom_print.err').read()
          if 'sorryAx' in out or 'sorryAx' in err:
              print("FAIL: sorryAx present in axiom output")
              ok = False
          if re.search(r': error:', err):
              print("FAIL: axiom_print.err contains an error line")
              ok = False
          allow = {'propext', 'Classical.choice', 'Quot.sound'}
          # Join wrapped axiom lists: a record starts at "'X' depends on
          # axioms:" and its list runs to the closing ']'.
          text = out.replace('\n', ' ')
          records = re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", text)
          nodep = re.findall(r"'([^']+)' does not depend on any axioms", text)
          seen = set()
          for name, lst in records:
              seen.add(name)
              axioms = {a.strip().strip(',') for a in lst.split(',') if a.strip()}
              extra = axioms - allow
              if extra:
                  print(f"FAIL: {name} depends on off-allowlist axioms: {sorted(extra)}")
                  ok = False
          for name in nodep:
              seen.add(name)
          for headline in ('StrongSix.SixExp.six_exponentials', 'StrongSix.M2.strongSixExponentials'):
              if headline not in seen:
                  print(f"FAIL: headline theorem missing from axiom output: {headline}")
                  ok = False
          print(f"declarations with axiom records: {len(seen)}")
          print("VERDICT: " + ("PASS" if ok else "FAIL"))
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Write pins file
        if: always()
        run: |
          set -uo pipefail
          {
            echo "target_repo=https://github.com/telaviv/strong-six-exponentials"
            echo "target_head=1625bdf3c0a7d9222bacd876d738d7540109bea6"
            echo "toolchain=leanprover/lean4:v4.35.0"
            echo "lane=[self-hosted, laptop]"
            echo "procedure=lake exe cache get; lake build; lake env lean Axioms.lean (mirrors build-driver.sh)"
            cat "$GITHUB_WORKSPACE/exits.txt" 2>/dev/null || true
          } > "$GITHUB_WORKSPACE/pins.txt"
          cat "$GITHUB_WORKSPACE/pins.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-exp-forge-evidence
          path: |
            cache-get.log
            build.log
            axiom_print.out
            axiom_print.err
            exits.txt
            pins.txt
          if-no-files-found: warn

      - name: Remove scratch dirs (shared-runner meta-rule)
        if: always()
        run: |
          rm -rf "$HOME/sixexp-1625bdf"
