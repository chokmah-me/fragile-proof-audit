name = "FragileProofAudit"
version = "0.1.0"
keywords = ["math", "number-theory", "formal-verification", "proof-audit"]
defaultTargets = ["FragileProofAudit"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "FragileProofAudit"
